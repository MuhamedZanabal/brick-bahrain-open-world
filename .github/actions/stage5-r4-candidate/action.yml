name: Run one Stage 5 revision 4 candidate lane
description: Execute a fresh independent candidate, complete compatibility evidence, rescan runtime diagnostics and rebuild 40 deterministic generated shards.
inputs:
  lane: {required: true, description: C1 or C2}
  artifact-lane: {required: true, description: c1 or c2}
  project-root: {required: true, description: Absolute detached project root}
  engine-output: {required: true, description: Absolute detached engine root}
  evidence-dir: {required: true, description: Absolute compatibility evidence directory}
  run-full-suite: {required: false, default: 'false', description: Run inherited C1 runtime suite}
runs:
  using: composite
  steps:
    - id: bundle
      uses: ./.github/actions/stage5-r4-materialize
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: bahrain-brick-pr59-authority-run-a-29538386331, path: build/source-artifact, repository: MuhamedZanabal/brick-bahrain-open-world, run-id: '29538386331', github-token: '${{ github.token }}'}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: stage2-engine-package-4.5.2-stable-29685721858, path: build/engine-artifact, repository: MuhamedZanabal/brick-bahrain-open-world, run-id: '29685721858', github-token: '${{ github.token }}'}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: stage4-4-5-2-prep-29818942517, path: build/stage4-prep, repository: MuhamedZanabal/brick-bahrain-open-world, run-id: '29818942517', github-token: '${{ github.token }}'}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: stage4-4-5-2-aggregate-result-29818942517, path: build/stage4-aggregate, repository: MuhamedZanabal/brick-bahrain-open-world, run-id: '29818942517', github-token: '${{ github.token }}'}
    - shell: bash
      run: |
        set -euo pipefail
        rm -rf '${{ inputs.project-root }}' '${{ inputs.engine-output }}' '${{ inputs.evidence-dir }}' 'build/${{ inputs.artifact-lane }}'
        mkdir -p '${{ inputs.evidence-dir }}'
        export STAGE5_R4_REPORT_PATH="$(realpath '${{ inputs.evidence-dir }}')/PROJECT_COMPATIBILITY_CENSUS.json"
        python3 '${{ steps.bundle.outputs.analyzer }}' patch-base --bundle-root '${{ steps.bundle.outputs.base_bundle_root }}'
        extra=()
        final_extra=()
        if test '${{ inputs.run-full-suite }}' = true; then extra+=(--run-full-suite); final_extra+=(--run-full-suite); fi
        set +e
        PYTHONPATH='${{ steps.bundle.outputs.base_bundle_root }}' python3 '${{ steps.bundle.outputs.base_analyzer }}' candidate \
          --source-artifact build/source-artifact --engine-artifact build/engine-artifact \
          --stage4-prep build/stage4-prep --stage4-aggregate build/stage4-aggregate \
          --project-root '${{ inputs.project-root }}' --engine-output '${{ inputs.engine-output }}' \
          --output 'build/${{ inputs.artifact-lane }}' --bundle-root '${{ steps.bundle.outputs.base_bundle_root }}' \
          --lane '${{ inputs.lane }}' "${extra[@]}"
        base_rc=$?
        set -e
        mkdir -p 'build/${{ inputs.artifact-lane }}'
        printf '%s\n' "$base_rc" > 'build/${{ inputs.artifact-lane }}/BASE_ANALYZER_EXIT_CODE.txt'
        PYTHONPATH='${{ steps.bundle.outputs.bundle_root }}' python3 '${{ steps.bundle.outputs.analyzer }}' finalize-candidate \
          --project-root '${{ inputs.project-root }}' \
          --engine-binary '${{ inputs.engine-output }}/Godot_v4.5.2-stable_linux.x86_64' \
          --evidence-dir '${{ inputs.evidence-dir }}' --output 'build/${{ inputs.artifact-lane }}' \
          --bundle-root '${{ steps.bundle.outputs.bundle_root }}' --source-artifact build/source-artifact \
          --lane '${{ inputs.lane }}' "${final_extra[@]}"
        printf '0\n' > 'build/${{ inputs.artifact-lane }}/ANALYZER_EXIT_CODE.txt'
        test -f 'build/${{ inputs.artifact-lane }}/CANDIDATE_${{ inputs.lane }}_RESULT.json'
        test -f 'build/${{ inputs.artifact-lane }}/PROJECT_COMPATIBILITY_CENSUS.json'
        test -f 'build/${{ inputs.artifact-lane }}/SOURCE_DELTA_ADJUDICATION.json'
        test "$(find 'build/${{ inputs.artifact-lane }}/shards' -name SHARD_MANIFEST.json -type f | wc -l)" -eq 40
    - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      if: always()
      with:
        name: stage5-4-5-2-r4-${{ inputs.artifact-lane }}-evidence-${{ github.run_id }}
        path: |
          build/${{ inputs.artifact-lane }}
          !build/${{ inputs.artifact-lane }}/FULL_GENERATED_${{ inputs.lane }}_CLOSURE.zip
          !build/${{ inputs.artifact-lane }}/generated_closure/**
          !build/${{ inputs.artifact-lane }}/shards/**
        retention-days: 30
        compression-level: 9
        include-hidden-files: true
    - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      if: always()
      with:
        name: stage5-4-5-2-r4-${{ inputs.artifact-lane }}-generated-closure-${{ github.run_id }}
        path: |
          build/${{ inputs.artifact-lane }}/FULL_GENERATED_${{ inputs.lane }}_CLOSURE.zip
          build/${{ inputs.artifact-lane }}/FULL_GENERATED_${{ inputs.lane }}_MANIFEST.json
          build/${{ inputs.artifact-lane }}/UID_CACHE_${{ inputs.lane }}_LANE_FORENSIC.json
        retention-days: 30
        compression-level: 0
        include-hidden-files: true
    - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      if: always()
      with: {name: 'stage5-4-5-2-r4-${{ inputs.artifact-lane }}-shard-source-${{ github.run_id }}', path: 'build/${{ inputs.artifact-lane }}/shards', retention-days: 1, compression-level: 0, include-hidden-files: true}
