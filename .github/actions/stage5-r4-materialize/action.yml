name: Materialize Godot 4.5.2 Stage 5 revision 4 analyzer
description: Materialize the preserved revision 3 base and verified revision 4 evidence-completion overlay.
outputs:
  base_analyzer: {description: Preserved revision 3 analyzer, value: '${{ steps.base.outputs.analyzer }}'}
  base_bundle_root: {description: Preserved revision 3 bundle root, value: '${{ steps.base.outputs.bundle_root }}'}
  analyzer: {description: Revision 4 analyzer entrypoint, value: '${{ steps.unpack.outputs.analyzer }}'}
  bundle_root: {description: Revision 4 bundle root, value: '${{ steps.unpack.outputs.bundle_root }}'}
  analyzer_source_sha256: {description: Revision 4 analyzer source authority, value: '${{ steps.unpack.outputs.analyzer_source_sha256 }}'}
  analyzer_loader_sha256: {description: Revision 4 loader authority, value: '${{ steps.unpack.outputs.analyzer_loader_sha256 }}'}
runs:
  using: composite
  steps:
    - id: base
      uses: ./.github/actions/stage5-4-5-2-materialize
    - id: unpack
      shell: bash
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/stage5-4-5-2-r4-bundle"
        rm -rf "$d"
        mkdir -p "$d"
        c="$GITHUB_WORKSPACE/.github/forensics/qualification/stage5_project_compatibility_4_5_2/revision4_bundle"
        cat "$c"/stage5_r4_bundle_*.b64part | tr -d '\r\n' > "$d/bundle.b64"
        test "$(sha256sum "$d/bundle.b64" | cut -d' ' -f1)" = bd202e11ae88e6f5d6c40f7973148108b3b87d6d80130f8d8ccf3e8379473f7f
        base64 -d "$d/bundle.b64" > "$d/bundle.zip"
        test "$(sha256sum "$d/bundle.zip" | cut -d' ' -f1)" = 01915eeae84d4ac94cf9b59cff21ac9205a131e503c8c9702b0794541040ab95
        unzip -q "$d/bundle.zip" -d "$d"
        python3 - "$d" <<'PY'
        import hashlib,json,sys
        from pathlib import Path
        root=Path(sys.argv[1]); authority=json.loads((root/'BUNDLE_INTEGRITY.json').read_text())
        def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
        for record in authority['files']:
            p=root/record['path']; assert p.is_file(), record['path']; assert p.stat().st_size==record['bytes']; assert sha(p)==record['sha256']
        records=[{'path':r['path'],'sha256':sha(root/r['path'])} for r in authority['analyzer_source_files']]
        aggregate=hashlib.sha256((json.dumps(records,sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest()
        assert aggregate==authority['analyzer_source_sha256']=='999895744f59d25dc863a5533f1dcb253c8caf1462900c848cf558f4582ba6d5'
        assert sha(root/'stage5_r4.py')==authority['analyzer_loader_sha256']=='68b0b0ab16bd3c79547db1c808cec570b4c55a18d24f75de37f9ace7b5ecc634'
        assert sha(root/'test_stage5_r4.py')==authority['test_sha256']=='7ab08496e2dc9c8c022c5fbc50ae88fde291892ee136e1ca1046942426e4ea36'
        PY
        chmod +x "$d/stage5_r4.py"
        echo "analyzer=$d/stage5_r4.py" >> "$GITHUB_OUTPUT"
        echo "bundle_root=$d" >> "$GITHUB_OUTPUT"
        echo "analyzer_source_sha256=999895744f59d25dc863a5533f1dcb253c8caf1462900c848cf558f4582ba6d5" >> "$GITHUB_OUTPUT"
        echo "analyzer_loader_sha256=68b0b0ab16bd3c79547db1c808cec570b4c55a18d24f75de37f9ace7b5ecc634" >> "$GITHUB_OUTPUT"
