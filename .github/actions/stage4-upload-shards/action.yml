name: Upload Stage 4 model shards
description: Upload exactly forty deterministic 20-model shard artifacts.
inputs:
  side:
    description: Lowercase import side identifier.
    required: true
  root:
    description: Root directory containing shard 00 through 39.
    required: true
  run-id:
    description: Workflow run identifier.
    required: true
runs:
  using: composite
  steps:
    - name: Upload shard 00
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: stage4-${{ inputs.side }}-shard-00-${{ inputs.run-id }}
        path: ${{ inputs.root }}/00
        if-no-files-found: error
        compression-level: 9
        retention-days: 14
        include-hidden-files: true
    - name: Upload shard 01
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
