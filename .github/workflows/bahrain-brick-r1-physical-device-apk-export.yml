name: Bahrain Brick R1 Appetize Upload — One Shot

on:
  push:
    branches:
      - work/bahrain-brick-renderer-runtime-debugging-r1
    paths:
      - .github/workflows/bahrain-brick-r1-physical-device-apk-export.yml

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: bahrain-brick-r1-appetize-upload
  cancel-in-progress: true

jobs:
  upload-mobile:
    if: github.event.head_commit.message == 'ci: one-shot Appetize upload bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: MuhamedZanabal/brick-bahrain-open-world
      PR_NUMBER: '63'
      ARTIFACT_ID: '8699178791'
      EXPECTED_SHA256: ec4ea74480cd36e25c2e146aac03abdfeb8ef0bb22b78a7b726b871fe8c4e787
    steps:
      - name: Create ephemeral encrypted-token handoff
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out token-private.pem 2>/dev/null
          openssl pkey -in token-private.pem -pubout -out token-public.pem
          PUBLIC_KEY_B64=$(base64 -w0 token-public.pem)
          BODY="APPETIZE_KEY_REQUEST::${GITHUB_RUN_ID}::${PUBLIC_KEY_B64}"
          jq -n --arg body "$BODY" '{body:$body}' > key-comment.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --data-binary @key-comment.json > key-comment-response.json
          jq -e '.id' key-comment-response.json >/dev/null

      - name: Receive encrypted token
        shell: bash
        run: |
          set -euo pipefail
          MARKER="APPETIZE_TOKEN_CIPHERTEXT::${GITHUB_RUN_ID}::"
          CIPHERTEXT=''
          for attempt in $(seq 1 120); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              -o comments.json
            MATCH=$(jq -r --arg marker "$MARKER" '[.[] | select(.body | startswith($marker))] | last // empty | @base64' comments.json)
            if [[ -n "$MATCH" ]]; then
              DECODED=$(printf '%s' "$MATCH" | base64 -d)
              BODY=$(printf '%s' "$DECODED" | jq -r '.body')
              CIPHERTEXT=${BODY#"$MARKER"}
              break
            fi
            sleep 5
          done
          test -n "$CIPHERTEXT"
          printf '%s' "$CIPHERTEXT" | base64 -d > token.enc
          openssl pkeyutl -decrypt \
            -inkey token-private.pem \
            -in token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out token.txt
          APPETIZE_TOKEN=$(cat token.txt)
          echo "::add-mask::${APPETIZE_TOKEN}"
          [[ "$APPETIZE_TOKEN" =~ ^tok_[A-Za-z0-9]+$ ]]
          printf 'APPETIZE_TOKEN=%s\n' "$APPETIZE_TOKEN" >> "$GITHUB_ENV"
          rm -f token.enc

      - name: Download and verify retained Mobile APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o mobile-artifact.zip
          unzip -q mobile-artifact.zip
          APK='bahrain-brick-r1-physical-mobile-arm64.apk'
          test -f "$APK"
          test "$(stat -c %s "$APK")" = '299778961'
          echo "${EXPECTED_SHA256}  ${APK}" | sha256sum --check --status
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"

      - name: Upload to Appetize and publish link
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error --location \
            --max-time 1200 \
            -o appetize-response.json \
            -w '%{http_code}' \
            -X POST 'https://api.appetize.io/v1/apps' \
            -H "X-API-KEY: ${APPETIZE_TOKEN}" \
            -F "file=@${APK_PATH};type=application/vnd.android.package-archive" \
            -F 'platform=android' \
            -F 'note=Bahrain Brick R1 Mobile Vulkan diagnostic build' \
            -F 'timeout=600' \
            -F 'appPermissions.run=public')
          printf 'Appetize HTTP status: %s\n' "$HTTP_CODE"
          if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
            jq -c 'del(.token, .apiToken, .api_key)' appetize-response.json || cat appetize-response.json
            exit 1
          fi
          PUBLIC_KEY=$(jq -r '.publicKey // .buildId // empty' appetize-response.json)
          test -n "$PUBLIC_KEY"
          APP_URL="https://appetize.io/app/${PUBLIC_KEY}"
          BUNDLE=$(jq -r '.bundle // empty' appetize-response.json)
          NAME=$(jq -r '.name // .appDisplayName // empty' appetize-response.json)
          RESULT_BODY="APPETIZE_UPLOAD_RESULT::${GITHUB_RUN_ID}::${APP_URL}::${PUBLIC_KEY}::${BUNDLE}::${NAME}"
          jq -n --arg body "$RESULT_BODY" '{body:$body}' > result-comment.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --data-binary @result-comment.json > result-comment-response.json
          jq -e '.id' result-comment-response.json >/dev/null
          printf '%s\n' "$APP_URL" > APPETIZE_URL.txt
          printf '%s\n' "$PUBLIC_KEY" > APPETIZE_PUBLIC_KEY.txt
          rm -f token.txt token-private.pem token-public.pem

      - name: Publish non-secret upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-r1-appetize-mobile-${{ github.run_id }}
          path: |
            APPETIZE_URL.txt
            APPETIZE_PUBLIC_KEY.txt
            appetize-response.json
          retention-days: 30
