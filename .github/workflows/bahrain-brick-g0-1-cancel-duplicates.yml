name: Cancel Duplicate G0.1 Runs

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-upgrade-v1]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-g0-1-cancel-duplicates.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel_duplicates:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel only unintended duplicate runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 30126886822 30126952569; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done
