name: Bahrain Brick G0.1 Android Startup Root Cause

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-upgrade-v1]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/bahrain-brick-g0-1-android-startup.yml
      - authority/bahrain_brick_g0_1_android_startup.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-g0-1-android-startup-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ARTIFACT_ID: '8586122615'
  SOURCE_ARTIFACT_SHA256: 4d4d3a696f4a326c3ddd63d1f51c278263fc25e6f2e00f68c0c3b64fb3c2e9ee
  APK_MEMBER: tier-b/apks/bahrain-brick-g0-gl-compatibility-x86_64.apk
  APK_SHA256: 8461e9916b5636a35dd921d674529013b7b4623b3504f2332a9d7b4ac064b7eb
  PACKAGE_ID: com.brickbahrain.g0gl

jobs:
  qualify_android_startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out bounded G0.1 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate no-rebuild authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('authority/bahrain_brick_g0_1_android_startup.json').read_text())
          assert data['parent_graphics_head']=='2ec1aaae3bd52e12a20cb130f5b3293e237d26da'
          assert data['renderer_evidence_source_commit']=='6ade72ed02084791128dcf4a91223e695d802c15'
          assert data['apk']['sha256']=='8461e9916b5636a35dd921d674529013b7b4623b3504f2332a9d7b4ac064b7eb'
          assert data['apk']['package_id']=='com.brickbahrain.g0gl'
          assert data['initial_investigation_rebuild_permitted'] is False
          assert data['renderer_defaults_may_change'] is False
          assert data['g1_authorized'] is False
          PY

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17.0.12'
          check-latest: false

      - name: Set up API 34 x86_64 Android environment
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            emulator
            platforms;android-34
            build-tools;34.0.0
            system-images;android-34;default;x86_64

      - name: Install inspection tools and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils unzip zip
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi

      - name: Extract exact existing APK without rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/g0_1/source build/g0_1/apk build/g0_1/raw
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output build/g0_1/source/tier-b.zip
          echo "$SOURCE_ARTIFACT_SHA256  build/g0_1/source/tier-b.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          archive=Path('build/g0_1/source/tier-b.zip')
          target=Path('build/g0_1/apk/bahrain-brick-g0-gl-compatibility-x86_64.apk')
          with zipfile.ZipFile(archive) as zf:
              data=zf.read(os.environ['APK_MEMBER'])
          target.write_bytes(data)
          actual=hashlib.sha256(data).hexdigest()
          if actual != os.environ['APK_SHA256']:
              raise SystemExit(f'APK SHA mismatch: {actual}')
          Path('build/g0_1/raw/apk_sha256.txt').write_text(actual+'\n')
          PY
          rm -f build/g0_1/source/tier-b.zip

      - name: Execute ordered startup investigation
        id: investigate
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$PWD/build/g0_1"
          RAW="$ROOT/raw"
          APK="$ROOT/apk/bahrain-brick-g0-gl-compatibility-x86_64.apk"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK/platform-tools/adb"
          EMULATOR="$SDK/emulator/emulator"
          AVDMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/avdmanager' | sort | tail -1)"
          APKANALYZER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort | tail -1)"
          AAPT2="$SDK/build-tools/34.0.0/aapt2"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          ZIPALIGN="$SDK/build-tools/34.0.0/zipalign"
          AVD_NAME=bahrain_brick_g0_1_api34
          mkdir -p "$RAW/native" "$ROOT/avd-home" "$ROOT/emulator-home"

          cap() {
            name="$1"; shift
            set +e
            "$@" > "$RAW/$name.stdout" 2> "$RAW/$name.stderr"
            code=$?
            set -e
            printf '%s\n' "$code" > "$RAW/$name.exit_code"
          }
          cap_shell() {
            name="$1"; shift
            cap "$name" "$ADB" shell "$@"
          }
          cleanup() {
            if test -n "${LOGCAT_PID:-}"; then kill "$LOGCAT_PID" >/dev/null 2>&1 || true; fi
            "$ADB" emu kill >/dev/null 2>&1 || true
            if test -n "${EMULATOR_PID:-}"; then kill "$EMULATOR_PID" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          set -e

          cap apksigner "$APKSIGNER" verify --verbose --print-certs "$APK"
          cat "$RAW/apksigner.stdout" "$RAW/apksigner.stderr" > "$RAW/apksigner.txt"
          cap aapt2_packagename "$AAPT2" dump packagename "$APK"
          cat "$RAW/aapt2_packagename.stdout" "$RAW/aapt2_packagename.stderr" > "$RAW/aapt2_packagename.txt"
          cap manifest "$APKANALYZER" manifest print "$APK"
          cp "$RAW/manifest.stdout" "$RAW/manifest.xml"
          cap manifest_xmltree "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml
          cat "$RAW/manifest_xmltree.stdout" "$RAW/manifest_xmltree.stderr" > "$RAW/manifest_xmltree.txt"
          unzip -l "$APK" > "$RAW/unzip_list.txt" 2>&1 || true
          zipinfo "$APK" > "$RAW/zipinfo.txt" 2>&1 || true
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" > "$RAW/zipalign.txt" 2>&1 || true
          python3 - "$APK" "$RAW/native" <<'PY'
          import subprocess,sys,tempfile,zipfile
          from pathlib import Path
          apk=Path(sys.argv[1]); out=Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          with tempfile.TemporaryDirectory() as td, zipfile.ZipFile(apk) as zf:
              root=Path(td)
              for name in zf.namelist():
                  if not (name.startswith('lib/') and name.endswith('.so')): continue
                  target=root/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(zf.read(name))
                  safe=name.replace('/','__')
                  for flag,label in [('-h','header'),('-d','dynamic'),('-n','notes')]:
                      result=subprocess.run(['readelf',flag,str(target)],text=True,capture_output=True)
                      (out/f'{safe}.{label}.txt').write_text(result.stdout+result.stderr)
          PY

          "$EMULATOR" -accel-check > "$RAW/emulator_acceleration.txt" 2>&1 || true
          printf '%s\n' 'system-images;android-34;default;x86_64' > "$RAW/avd_package.txt"
          export ANDROID_AVD_HOME="$ROOT/avd-home"
          export ANDROID_EMULATOR_HOME="$ROOT/emulator-home"
          rm -rf "$ANDROID_AVD_HOME/$AVD_NAME.avd" "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD_NAME" --package 'system-images;android-34;default;x86_64' --device 'pixel_6' > "$RAW/avd_create.txt" 2>&1
          nohup "$EMULATOR" "@$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader -accel auto -memory 4096 -cores 4 \
            -camera-back none -camera-front none > "$RAW/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          printf '%s\n' "$EMULATOR_PID" > "$RAW/emulator.pid"
          set +e
          "$ADB" wait-for-device
          wait_code=$?
          set -e
          printf '%s\n' "$wait_code" > "$RAW/adb_wait.exit_code"
          booted=false
          if test "$wait_code" -eq 0; then
            for attempt in $(seq 1 240); do
              value="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              printf '%s\n' "$value" > "$RAW/boot_completed.txt"
              if test "$value" = 1; then booted=true; break; fi
              sleep 2
            done
          fi
          printf '%s\n' "$booted" > "$RAW/emulator_booted.txt"
          if test "$booted" != true; then exit 0; fi

          "$ADB" shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          "$ADB" shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          "$ADB" shell wm size 2400x1080 >/dev/null 2>&1 || true
          "$ADB" shell wm density 420 >/dev/null 2>&1 || true
          "$ADB" shell input keyevent 82 >/dev/null 2>&1 || true

          cap_shell build_fingerprint getprop ro.build.fingerprint
          cap_shell api_level getprop ro.build.version.sdk
          cap_shell android_version getprop ro.build.version.release
          cap_shell cpu_abi getprop ro.product.cpu.abi
          cap_shell cpu_abilist getprop ro.product.cpu.abilist
          cap_shell uname_m uname -m
          cap_shell opengles_version getprop ro.opengles.version
          cap_shell current_user am get-current-user
          cap_shell wm_size wm size
          cap_shell wm_density wm density
          cap_shell meminfo_device cat /proc/meminfo
          cap_shell df_data df -h /data
          cap_shell surfaceflinger dumpsys SurfaceFlinger
          cap_shell vulkan_features pm list features

          cap install "$ADB" install -r -t "$APK"
          cap_shell pm_path pm path "$PACKAGE_ID"
          cap_shell dumpsys_package_before dumpsys package "$PACKAGE_ID"
          cap_shell resolve_activity cmd package resolve-activity --brief "$PACKAGE_ID"
          cap_shell resolve_activity_intent cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$PACKAGE_ID"
          cap_shell query_activities cmd package query-activities --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE_ID"

          "$ADB" logcat -c >/dev/null 2>&1 || true
          "$ADB" logcat -v threadtime > "$RAW/logcat_full.txt" 2>&1 &
          LOGCAT_PID=$!
          sleep 30

          cap_shell force_stop am force-stop "$PACKAGE_ID"
          cap_shell pm_clear pm clear "$PACKAGE_ID"
          cap monkey "$ADB" shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1
          cap_shell pidof_after_monkey pidof "$PACKAGE_ID"
          cap_shell ps_after_monkey ps -A
          cap_shell dumpsys_activities_after_monkey dumpsys activity activities

          component="$(cat "$RAW/resolve_activity.stdout" "$RAW/resolve_activity_intent.stdout" "$RAW/query_activities.stdout" | grep -E '^[[:alnum:]_.]+/[[:alnum:]_.$]+' | head -1 | tr -d '\r')"
          printf '%s\n' "$component" > "$RAW/resolved_component.txt"
          if test -n "$component"; then
            cap am_start "$ADB" shell am start -W -S -n "$component"
          else
            printf '%s\n' 127 > "$RAW/am_start.exit_code"
            : > "$RAW/am_start.stdout"
            printf '%s\n' 'No resolved component' > "$RAW/am_start.stderr"
          fi
          cap_shell pidof_after_am_start pidof "$PACKAGE_ID"
          cap_shell ps_after_am_start ps -A
          cap_shell dumpsys_activities_after_am_start dumpsys activity activities
          cap_shell dumpsys_processes_after_am_start dumpsys activity processes
          cap_shell dumpsys_window_after_am_start dumpsys window windows
          cap_shell meminfo_after_am_start dumpsys meminfo "$PACKAGE_ID"

          sleep 60
          cap_shell pidof_final pidof "$PACKAGE_ID"
          cap_shell ps_final ps -A
          cap_shell dumpsys_activities_final dumpsys activity activities
          cap_shell dumpsys_processes_final dumpsys activity processes
          cap_shell dumpsys_window_final dumpsys window windows
          cap_shell meminfo_final dumpsys meminfo "$PACKAGE_ID"
          cap_shell dumpsys_package_after dumpsys package "$PACKAGE_ID"
          cap_shell tombstones ls -la /data/tombstones
          cap_shell dropbox dumpsys dropbox --print
          kill "$LOGCAT_PID" >/dev/null 2>&1 || true
          wait "$LOGCAT_PID" >/dev/null 2>&1 || true
          LOGCAT_PID=""

      - name: Verify raw evidence boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s build/g0_1/apk/bahrain-brick-g0-gl-compatibility-x86_64.apk
          test "$(cat build/g0_1/raw/apk_sha256.txt)" = "$APK_SHA256"
          test -f build/g0_1/raw/apksigner.txt
          test -f build/g0_1/raw/manifest.xml
          test -f build/g0_1/raw/unzip_list.txt
          test -f build/g0_1/raw/emulator_booted.txt
          grep -R -- '--export-debug\|reconstruct_manama_souq' .github/workflows/bahrain-brick-g0-1-android-startup.yml && exit 1 || true

      - name: Upload G0.1 raw root-cause evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-g0-1-android-startup-${{ github.run_id }}
          path: build/g0_1
          if-no-files-found: error
          retention-days: 30
