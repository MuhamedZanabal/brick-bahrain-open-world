name: Bahrain Brick G0.2 Android Paired Renderer Qualification

on:
  pull_request:
    branches: [work/bahrain-brick-g0-1-android-startup-root-cause-v1]
    types: [opened, synchronize]
    paths:
      - .github/workflows/bahrain-brick-g0-2-android-paired.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: bahrain-brick-g0-2-android-paired
  cancel-in-progress: false

env:
  SOURCE_ARTIFACT_ID: '8586122615'
  SOURCE_ARTIFACT_SHA256: 4d4d3a696f4a326c3ddd63d1f51c278263fc25e6f2e00f68c0c3b64fb3c2e9ee
  GL_APK_SHA256: 8461e9916b5636a35dd921d674529013b7b4623b3504f2332a9d7b4ac064b7eb
  MOBILE_APK_SHA256: 0b33ba62c48ac14f1d5c331c98d1a318de427ad0b6c2dd247af327f5f1bd3a02

jobs:
  paired_android_qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out bounded G0.2 branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Materialize tested collector and finalizer payload
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if test -f tools/graphics/bootstrap_g0_2_payload.py; then
            python3 tools/graphics/bootstrap_g0_2_payload.py
            git add tools/graphics/run_g0_2_android_paired.sh tools/graphics/finalize_g0_2_android_evidence.py
            git rm -r tools/graphics/g0_2_payload tools/graphics/bootstrap_g0_2_payload.py
            changed=true
          fi
          if test -f tools/graphics/apply_g0_2_scope_fix.py; then
            python3 tools/graphics/apply_g0_2_scope_fix.py
            git add tools/graphics/run_g0_2_android_paired.sh tests/graphics/test_g0_2_android_renderer_qualification_contract.py
            git rm tools/graphics/apply_g0_2_scope_fix.py
            changed=true
          fi
          bash -n tools/graphics/run_g0_2_android_paired.sh
          python3 -m py_compile tools/graphics/finalize_g0_2_android_evidence.py
          if test "$changed" = true; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'G0.2: materialize and correct paired Android harness'
            target_branch="${GITHUB_HEAD_REF:-work/bahrain-brick-graphics-g0-2-android-renderer-qualification}"
            git push origin "HEAD:$target_branch"
          fi

      - name: Validate G0.2 contract before execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_g0_2_android_renderer_qualification_contract.py -v
          bash -n tools/graphics/run_g0_2_android_paired.sh
          python3 -m py_compile tools/graphics/finalize_g0_2_android_evidence.py
          test "$(git merge-base HEAD d89d3e22e25bba8c266219dcca3cfd223e658b7b)" = d89d3e22e25bba8c266219dcca3cfd223e658b7b
          test -z "$(git diff --name-only d89d3e22e25bba8c266219dcca3cfd223e658b7b...HEAD | grep -Ev '^(\.github/workflows/|authority/bahrain_brick_g0_2_|tools/graphics/.*g0_2|tests/graphics/test_g0_2_|docs/superpowers/(specs|plans)/2026-07-25-g0-2)' || true)"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17.0.12'
          check-latest: false

      - name: Set up API 34 AOSP x86_64 Android environment
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            emulator
            platforms;android-34
            build-tools;34.0.0
            system-images;android-34;default;x86_64

      - name: Install evidence inspection dependencies and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils unzip python3-pil
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          mkdir -p build/g0_2
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check > build/g0_2/EMULATOR_ACCELERATION.txt 2>&1 || true

      - name: Recover exact paired APK and shared-import authority without rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/build/g0_2/source"
          mkdir -p "$root"
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output build/g0_2/source-artifact.zip
          echo "$SOURCE_ARTIFACT_SHA256  build/g0_2/source-artifact.zip" | sha256sum -c -
          python3 - "$root" build/g0_2/source-artifact.zip <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys,zipfile
          root=Path(sys.argv[1]); archive=Path(sys.argv[2])
          required={
            'tier-b/apks/bahrain-brick-g0-gl-compatibility-x86_64.apk':('bahrain-brick-g0-gl-compatibility-x86_64.apk',os.environ['GL_APK_SHA256']),
            'tier-b/apks/bahrain-brick-g0-mobile-vulkan-x86_64.apk':('bahrain-brick-g0-mobile-vulkan-x86_64.apk',os.environ['MOBILE_APK_SHA256']),
            'tier-b/IMPORTED_STATE_MANIFEST.json':('IMPORTED_STATE_MANIFEST.json',None),
            'tier-b/CLONE_IDENTITY.json':('CLONE_IDENTITY.json',None),
            'tier-b/GL_VARIANT_OVERRIDE.json':('GL_VARIANT_OVERRIDE.json',None),
            'tier-b/MOBILE_VARIANT_OVERRIDE.json':('MOBILE_VARIANT_OVERRIDE.json',None),
          }
          records=[]
          with zipfile.ZipFile(archive) as zf:
            names=set(zf.namelist())
            for member,(target_name,expected_sha) in required.items():
              if member not in names: raise SystemExit(f'missing source artifact member: {member}')
              data=zf.read(member); actual=hashlib.sha256(data).hexdigest()
              if expected_sha and actual != expected_sha: raise SystemExit(f'hash mismatch: {member}')
              (root/target_name).write_bytes(data)
              records.append({'source_member':member,'target':target_name,'bytes':len(data),'sha256':actual})
          (root/'SOURCE_EXTRACTION.json').write_text(json.dumps({'schema_version':1,'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),'rebuild_performed':False,'records':records},indent=2,sort_keys=True)+'\n')
          PY
          rm -f build/g0_2/source-artifact.zip

      - name: Execute independent GL and Mobile Android state machines
        shell: bash
        run: |
          set -o pipefail
          bash tools/graphics/run_g0_2_android_paired.sh \
            "$PWD" "$PWD/build/g0_2/source" "$PWD/build/g0_2/raw" \
            2>&1 | tee build/g0_2/paired-runner.log

      - name: Finalize paired renderer reports and dual-device handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/graphics/finalize_g0_2_android_evidence.py \
            --raw build/g0_2/raw \
            --output build/g0_2/reports/graphics/g0_2 \
            --handoff-output build/g0_2/staged_device_handoff

      - name: Validate terminal evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/g0_2/reports/graphics/g0_2')
          required=[
            'authority.json','shared_import_equivalence.json','emulator_environment.json','apk_inventory.json',
            'gl_compatibility/state_machine.json','gl_compatibility/package_report.json','gl_compatibility/launch_report.json','gl_compatibility/runtime.json','gl_compatibility/frame_metrics.csv','gl_compatibility/logcat_full.txt','gl_compatibility/logcat_critical.txt','gl_compatibility/screenshot.png','gl_compatibility/classification.json',
            'mobile_vulkan/state_machine.json','mobile_vulkan/package_report.json','mobile_vulkan/launch_report.json','mobile_vulkan/runtime.json','mobile_vulkan/frame_metrics.csv','mobile_vulkan/logcat_full.txt','mobile_vulkan/logcat_critical.txt','mobile_vulkan/screenshot.png','mobile_vulkan/classification.json',
            'screenshot_comparison.json','screenshot_difference.png','G0_2_TERMINAL_REPORT.json','G0_2_TERMINAL_REPORT.md',
          ]
          for rel in required:
            path=root/rel
            assert path.is_file() and path.stat().st_size>0, rel
          terminal=json.loads((root/'G0_2_TERMINAL_REPORT.json').read_text())
          assert terminal['terminal_outcome'] in {
            'G0_2_ANDROID_BOTH_RENDERERS_FUNCTIONAL','G0_2_ANDROID_GL_ONLY_FUNCTIONAL','G0_2_ANDROID_MOBILE_ONLY_FUNCTIONAL',
            'G0_2_ANDROID_NEITHER_RENDERER_FUNCTIONAL','G0_2_ANDROID_INFRASTRUCTURE_INSUFFICIENT','G0_2_EVIDENCE_INSUFFICIENT'}
          assert terminal['gate_g0']=='G0_EVIDENCE_INSUFFICIENT'
          assert terminal['renderer_decision'] is None
          assert terminal['renderer_defaults_modified'] is False
          assert terminal['g1_authorized'] is False
          for key in ('gl_compatibility','mobile_vulkan'):
            classification=json.loads((root/key/'classification.json').read_text())['classification']
            assert classification.startswith('ANDROID_')
          PY
          for required in README.md device_result.schema.json run_device_test.sh run_device_test.ps1 adb_capture_commands.txt expected_markers.txt apk_sha256.txt; do
            test -s "build/g0_2/staged_device_handoff/$required"
          done

      - name: Upload bounded G0.2 evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-g0-2-android-paired-${{ github.run_id }}
          path: |
            build/g0_2/reports
            build/g0_2/staged_device_handoff
            build/g0_2/raw
            build/g0_2/paired-runner.log
            build/g0_2/EMULATOR_ACCELERATION.txt
            build/g0_2/source/SOURCE_EXTRACTION.json
          if-no-files-found: error
          retention-days: 30
