name: Bahrain Brick G0.2 Terminal Packager Diagnostic

on:
  pull_request:
    branches: [work/bahrain-brick-g0-1-android-startup-root-cause-v1]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-g0-2-android-paired.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-g0-2-terminal-packager-diagnostic
  cancel-in-progress: false

jobs:
  diagnose_terminal_packager:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact G0.2 branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install report dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Capture deterministic packager stdout and stderr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/g0_2_packager_diagnostic
          python3 tools/graphics/materialize_g0_2_terminal_packager.py \
            > build/g0_2_packager_diagnostic/materialize.stdout.txt \
            2> build/g0_2_packager_diagnostic/materialize.stderr.txt
          materialize_code=$?
          printf '%s\n' "$materialize_code" > build/g0_2_packager_diagnostic/materialize.exit-code.txt
          set +e
          python3 tools/graphics/package_g0_2_terminal.py \
            > build/g0_2_packager_diagnostic/package.stdout.txt \
            2> build/g0_2_packager_diagnostic/package.stderr.txt
          package_code=$?
          set -e
          printf '%s\n' "$package_code" > build/g0_2_packager_diagnostic/package.exit-code.txt
          find reports/graphics/g0_2 -maxdepth 3 -type f -printf '%P\t%s\n' \
            > build/g0_2_packager_diagnostic/generated-files.txt 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/g0_2_packager_diagnostic')
          value={
            'schema_version':1,
            'materialize_exit_code':int((root/'materialize.exit-code.txt').read_text()),
            'package_exit_code':int((root/'package.exit-code.txt').read_text()),
            'terminal_report_exists':Path('reports/graphics/g0_2/G0_2_TERMINAL_REPORT.json').is_file(),
            'android_execution_performed':False,
          }
          (root/'summary.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload compact packager diagnostic
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-g0-2-packager-diagnostic-${{ github.run_id }}
          path: build/g0_2_packager_diagnostic
          if-no-files-found: error
          retention-days: 7
