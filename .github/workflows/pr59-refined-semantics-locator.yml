name: Locate PR59 Refined Semantics Run
on:
  push:
    branches: [ci/pr59-existing-apk-gate-closure-20260717]
    paths: [.github/workflows/pr59-refined-semantics-locator.yml]
permissions: {actions: read, contents: write}
jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: ci/pr59-existing-apk-gate-closure-20260717, fetch-depth: 20}
      - shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/MuhamedZanabal/brick-bahrain-open-world/actions/workflows/pr59-refine-model-semantics.yml/runs?branch=ci/pr59-existing-apk-gate-closure-20260717&per_page=5'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          runs=json.load(urllib.request.urlopen(req))['workflow_runs']; assert runs
          r=runs[0]
          open('.github/forensics/LATEST_REFINED_SEMANTICS_RUN.json','w').write(json.dumps({'run_id':r['id'],'status':r['status'],'conclusion':r['conclusion'],'head_sha':r['head_sha']},sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/LATEST_REFINED_SEMANTICS_RUN.json; git commit -m 'ci(forensics): record refined semantic run'; git fetch origin ci/pr59-existing-apk-gate-closure-20260717; git rebase origin/ci/pr59-existing-apk-gate-closure-20260717; git push origin HEAD:ci/pr59-existing-apk-gate-closure-20260717
