name: Bahrain Brick Graphics G0 Tier B Android Emulator

on:
  pull_request:
    branches: [work/bahrain-brick-manama-souq-vertical-slice-v1]
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bahrain-brick-graphics-g0-tier-b-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_PR_NUMBER: '59'
  FROZEN_PR_HEAD: 5b4e2466ef84f3984f3bf336b31925d4d2e97a7f
  FROZEN_PR_BASE: fc8f00182f97c39015610d6603fa7c9c44364c5d

jobs:
  tier_b_preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'reopened'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run G0 source contracts and exact-tree census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/g0-tier-b-preflight/reports/graphics/g0
          python3 tools/graphics/g0_source_tree_census.py \
            --repo-root "$PWD" \
            --frozen "$FROZEN_PR_HEAD" \
            --graphics "$(git rev-parse HEAD)" \
            --composite-authority authority/manama_souq_composite_source.json \
            --output-root build/g0-tier-b-preflight/reports/graphics/g0
          python3 -m unittest discover -s tests/graphics -p 'test_*.py' -v \
            2>&1 | tee build/g0-tier-b-preflight/contracts.log

      - name: Verify PR 59 authority through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/{os.environ['FROZEN_PR_NUMBER']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "bahrain-brick-graphics-g0-tier-b",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          observed = {
              "state": payload["state"], "draft": payload["draft"], "merged": payload["merged"],
              "base_sha": payload["base"]["sha"], "head_sha": payload["head"]["sha"],
              "changed_files": payload["changed_files"],
          }
          expected = {
              "state": "open", "draft": True, "merged": False,
              "base_sha": os.environ["FROZEN_PR_BASE"], "head_sha": os.environ["FROZEN_PR_HEAD"],
              "changed_files": 54,
          }
          failures = {key: {"expected": value, "observed": observed.get(key)} for key, value in expected.items() if observed.get(key) != value}
          Path("build/g0-tier-b-preflight/pr59-authority.json").write_text(json.dumps({"expected": expected, "observed": observed, "failures": failures, "unchanged": not failures}, indent=2, sort_keys=True) + "\n")
          if failures:
              raise SystemExit(json.dumps(failures, sort_keys=True))
          PY

      - name: Upload Tier B preflight evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-graphics-g0-tier-b-preflight-${{ github.run_id }}
          path: build/g0-tier-b-preflight
          if-no-files-found: error
          retention-days: 30

  renderer_tier_b:
    needs: tier_b_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact Android renderer candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reconstruct exact composite once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/g0-android
          bash tools/vertical_slice/reconstruct_manama_souq_composite.sh \
            A \
            "$PWD/build/g0-android/reconstruction" \
            "$PWD/authority/manama_souq_composite_source.json" \
            "$(git rev-parse HEAD)"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17.0.12'
          check-latest: false

      - name: Set up API 34 AOSP x86_64 Android emulator toolchain
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            emulator
            platforms;android-34
            build-tools;34.0.0
            system-images;android-34;default;x86_64

      - name: Install host display dependencies and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check | tee build/g0-android/EMULATOR_ACCELERATION_PRECHECK.txt || true

      - name: Execute API 34 Android Tier B evidence
        id: tier_b
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash tools/graphics/run_android_tier_b.sh \
            "$PWD" \
            "$PWD/build/g0-android/reconstruction" \
            "$PWD/build/g0-android/tier-b" \
            2>&1 | tee build/g0-android/tier-b-runner.log

      - name: Upload Tier B Android renderer evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-graphics-g0-tier-b-${{ github.run_id }}
          path: |
            build/g0-android/tier-b/reports/graphics/g0
            build/g0-android/tier-b/apks
            build/g0-android/tier-b/HARNESS_INJECTION.json
            build/g0-android/tier-b/IMPORTED_STATE_MANIFEST.json
            build/g0-android/tier-b/CLONE_IDENTITY.json
            build/g0-android/tier-b/GL_VARIANT_OVERRIDE.json
            build/g0-android/tier-b/MOBILE_VARIANT_OVERRIDE.json
            build/g0-android/tier-b/DEVICE_BASELINE.json
            build/g0-android/tier-b/EMULATOR_ACCELERATION.txt
            build/g0-android/tier-b/TIER_B_EVIDENCE_INVENTORY.json
            build/g0-android/tier-b-runner.log
            build/g0-android/EMULATOR_ACCELERATION_PRECHECK.txt
            build/g0-android/reconstruction/evidence/FROZEN_CONTROLS_PRE.json
            build/g0-android/reconstruction/evidence/FROZEN_CONTROLS_POST.json
            build/g0-android/reconstruction/evidence/FINAL_TREE_AUTHORITY.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Tier B functional conclusion
        if: always()
        shell: bash
        run: test '${{ steps.tier_b.outcome }}' = success
