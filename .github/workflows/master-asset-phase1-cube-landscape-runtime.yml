name: Bahrain Brick Master Asset Phase 1 Cube Landscape Runtime

on:
  push:
    branches:
      - work/bahrain-brick-master-asset-integration-v1
    paths:
      - .github/workflows/master-asset-phase1-cube-landscape-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-master-asset-phase1-cube-landscape-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARTIFACT_ID: "9031108247"
  SOURCE_RUN_ID: "31290094969"
  EXPECTED_CUBE_SHA256: "00b2e146a7af0cc1043e9492f87c9ef2747d884aa0ada987e9be812537de8e2b"
  GODOT_VERSION: "4.3"
  EXPECTED_GODOT_VERSION: "4.3.stable.official.77dcf97d8"
  ANDROID_BUILD_TOOLS: "34.0.0"
  SYSTEM_IMAGE: "system-images;android-34;default;x86_64"
  PACKAGE_NAME: "com.bahrainbrick.cubesmoke"
  VERSION_CODE: "2"
  VERSION_NAME: "0.1.1-phase1-landscape"
  APK_NAME: "bahrain-brick-phase1-cube-landscape.apk"

jobs:
  cube_landscape_runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact qualification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Recover and verify canonical cube source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-landscape"
          SOURCE="$ROOT/source"
          REPORTS="$ROOT/reports"
          mkdir -p "$SOURCE" "$REPORTS" "$ROOT/logs" "$ROOT/artifacts"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$ROOT/source.zip"
          unzip -tq "$ROOT/source.zip"
          unzip -q "$ROOT/source.zip" -d "$SOURCE"
          test -f "$SOURCE/cube-a/bb_validation_cube_1m.glb"
          test -f "$SOURCE/cube-b/bb_validation_cube_1m.glb"
          test -f "$SOURCE/reports/CUBE_GENERATION_A.json"
          test -f "$SOURCE/reports/CUBE_GENERATION_B.json"
          test -f "$SOURCE/reports/CUBE_INDEPENDENT_VALIDATION.json"
          cmp "$SOURCE/cube-a/bb_validation_cube_1m.glb" "$SOURCE/cube-b/bb_validation_cube_1m.glb"
          printf '%s  %s\n' "$EXPECTED_CUBE_SHA256" "$SOURCE/cube-a/bb_validation_cube_1m.glb" | sha256sum -c -
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path(sys.argv[1])
          source = root / "source"
          a = json.loads((source / "reports/CUBE_GENERATION_A.json").read_text())
          b = json.loads((source / "reports/CUBE_GENERATION_B.json").read_text())
          independent = json.loads((source / "reports/CUBE_INDEPENDENT_VALIDATION.json").read_text())
          assert a["dimensions_m"] == [1.0, 1.0, 1.0], a
          assert b["dimensions_m"] == [1.0, 1.0, 1.0], b
          assert independent["passed"] is True, independent
          assert independent["bounds"]["dimensions"] == [1.0, 1.0, 1.0], independent
          cube = source / "cube-a/bb_validation_cube_1m.glb"
          report = {
              "source_run_id": 31290094969,
              "source_artifact_id": 9031108247,
              "cube_sha256": hashlib.sha256(cube.read_bytes()).hexdigest(),
              "cube_dimensions_m": [1.0, 1.0, 1.0],
              "deterministic_repeat": True,
              "independent_validation": "PASS",
          }
          assert report["cube_sha256"] == "00b2e146a7af0cc1043e9492f87c9ef2747d884aa0ada987e9be812537de8e2b"
          (root / "reports/SOURCE_AUTHORITY.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Provision Java 17
        uses: actions/setup-java@81c13a41f910e657690fdbe251b91fddc27e217c
        with:
          distribution: temurin
          java-version: "17"

      - name: Provision pinned Android API 34 environment
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: "14742923"
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            emulator
            ${{ env.SYSTEM_IMAGE }}

      - name: Provision emulator libraries and screenshot validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep -q 'libpulse.so.0'
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0

      - name: Install checksum-verified Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-landscape"
          DOWNLOADS="$ROOT/downloads"
          REPORTS="$ROOT/reports"
          mkdir -p "$DOWNLOADS" "$REPORTS"
          cd "$DOWNLOADS"
          base="https://github.com/godotengine/godot/releases/download/4.3-stable"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/$archive" -o "$archive"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/$templates" -o "$templates"
          grep " $archive$" SHA512-SUMS.txt | sha512sum -c -
          grep " $templates$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$archive" -d godot-bin
          GODOT="$DOWNLOADS/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          unzip -q "$templates" -d godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          "$GODOT" --version | tee "$REPORTS/GODOT_VERSION.txt"
          grep -qx "$EXPECTED_GODOT_VERSION" "$REPORTS/GODOT_VERSION.txt"

          JAVA_SDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_SDK_PATH"
          export/android/android_sdk_path = "$SDK_ROOT"
          EOF
          printf 'java_sdk_path=%s\nandroid_sdk_path=%s\n' "$JAVA_SDK_PATH" "$SDK_ROOT" | tee "$REPORTS/GODOT_ANDROID_EDITOR_SETTINGS.txt"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated landscape Godot cube project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-landscape"
          SOURCE="$ROOT/source"
          PROJECT="$ROOT/project"
          LOGS="$ROOT/logs"
          mkdir -p "$PROJECT/assets" "$LOGS"
          cp "$SOURCE/cube-a/bb_validation_cube_1m.glb" "$PROJECT/assets/"

          cat > "$PROJECT/project.godot" <<'EOF'
          ; Isolated Phase 1 qualification project. Not a production-project override.
          config_version=5

          [application]
          config/name="Bahrain Brick Phase 1 Cube Landscape"
          run/main_scene="res://main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=0

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          environment/defaults/default_clear_color=Color(0.02, 0.03, 0.05, 1)
          textures/vram_compression/import_etc2_astc=true
          EOF
          grep -qx 'window/handheld/orientation=0' "$PROJECT/project.godot"
          grep -qx 'textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"

          cat > "$PROJECT/main.gd" <<'EOF'
          extends Node3D

          func _ready() -> void:
              var camera := $Camera3D as Camera3D
              camera.look_at(Vector3.ZERO, Vector3.UP)
              var meshes := find_children("*", "MeshInstance3D", true, false)
              if meshes.size() != 1:
                  push_error("CUBE_SMOKE_MESH_COUNT_INVALID count=%d" % meshes.size())
                  get_tree().quit(2)
                  return
              var mesh := meshes[0] as MeshInstance3D
              var material := StandardMaterial3D.new()
              material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              material.albedo_color = Color(1.0, 0.38, 0.04, 1.0)
              mesh.material_override = material
              var size := mesh.get_aabb().size
              print("BAHRAIN_BRICK_CUBE_SMOKE_READY size=%.3f,%.3f,%.3f" % [size.x, size.y, size.z])
          EOF

          cat > "$PROJECT/main.tscn" <<'EOF'
          [gd_scene load_steps=3 format=3]

          [ext_resource type="PackedScene" path="res://assets/bb_validation_cube_1m.glb" id="1_cube"]
          [ext_resource type="Script" path="res://main.gd" id="2_script"]

          [node name="CubeSmoke" type="Node3D"]
          script = ExtResource("2_script")

          [node name="Cube" parent="." instance=ExtResource("1_cube")]

          [node name="Camera3D" type="Camera3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 2.4, 1.8, 2.4)
          current = true
          EOF

          cp export_presets.cfg "$PROJECT/export_presets.cfg"
          KEYSTORE="$RUNNER_TEMP/bahrain-brick-phase1-landscape-debug.keystore"
          rm -f "$KEYSTORE"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Bahrain Brick Phase 1 Landscape,O=Zanabal Gaming,C=BH'
          python3 - "$PROJECT/export_presets.cfg" "$KEYSTORE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          key = Path(sys.argv[2]).resolve().as_posix()
          text = path.read_text(encoding="utf-8")
          replacements = [
              (r'(?m)^architectures/armeabi-v7a=.*$', 'architectures/armeabi-v7a=false'),
              (r'(?m)^architectures/arm64-v8a=.*$', 'architectures/arm64-v8a=false'),
              (r'(?m)^architectures/x86_64=.*$', 'architectures/x86_64=true'),
              (r'(?m)^architectures/x86=.*$', 'architectures/x86=false'),
              (r'(?m)^keystore/debug=.*$', f'keystore/debug="{key}"'),
              (r'(?m)^keystore/release=.*$', f'keystore/release="{key}"'),
              (r'(?m)^version/code=.*$', 'version/code=2'),
              (r'(?m)^version/name=.*$', 'version/name="0.1.1-phase1-landscape"'),
              (r'(?m)^package/unique_name=.*$', 'package/unique_name="com.bahrainbrick.cubesmoke"'),
              (r'(?m)^package/name=.*$', 'package/name="Bahrain Brick Cube Landscape"'),
          ]
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f"replacement count={count}: {pattern}")
          text = re.sub(r'(?m)^launcher_icons/.*\n?', '', text)
          path.write_text(text, encoding="utf-8")
          PY

          "$GODOT" --headless --path "$PROJECT" --editor --import --quit --verbose 2>&1 | tee "$LOGS/GODOT_IMPORT.log"
          grep -q 'bb_validation_cube_1m' "$LOGS/GODOT_IMPORT.log"
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|ERROR:.*(failed|missing|invalid)' "$LOGS/GODOT_IMPORT.log"

      - name: Export and independently validate landscape APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-landscape"
          PROJECT="$ROOT/project"
          REPORTS="$ROOT/reports"
          LOGS="$ROOT/logs"
          APK="$ROOT/artifacts/$APK_NAME"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"
          "$GODOT" --headless --path "$PROJECT" --verbose --export-debug Android "$APK" 2>&1 | tee "$LOGS/ANDROID_EXPORT.log"
          test -s "$APK"
          unzip -t "$APK" > "$LOGS/APK_ZIP_INTEGRITY.txt"
          sha256sum "$APK" | tee "$REPORTS/APK_SHA256SUM.txt"
          stat -c '%n %s' "$APK" | tee "$REPORTS/APK_SIZE.txt"
          "$TOOLS/aapt" dump badging "$APK" | tee "$REPORTS/APK_BADGING.txt"
          grep -q "package: name='$PACKAGE_NAME' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$REPORTS/APK_BADGING.txt"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > "$REPORTS/APK_MANIFEST_TREE.txt"
          grep -Eq 'screenOrientation.*0x0([[:space:]]|$)' "$REPORTS/APK_MANIFEST_TREE.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$REPORTS/APK_SIGNING.txt"
          "$TOOLS/zipalign" -c -v 4 "$APK" > "$REPORTS/APK_ZIPALIGN.txt"
          unzip -Z1 "$APK" | grep -q '^lib/x86_64/libgodot_android.so$'
          unzip -Z1 "$APK" | grep -q 'assets/.godot/imported/bb_validation_cube_1m.glb'

      - name: Launch landscape cube APK on API 34 and capture visible proof
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-landscape"
          REPORTS="$ROOT/reports"
          LOGS="$ROOT/logs"
          ARTIFACTS="$ROOT/artifacts"
          APK="$ARTIFACTS/$APK_NAME"
          SCREENSHOT="$ARTIFACTS/cube-smoke-android-landscape.png"
          LOGCAT="$LOGS/CUBE_ANDROID_LOGCAT.txt"
          FILTERED="$LOGS/CUBE_ANDROID_LOGCAT_FILTERED.txt"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"
          "$EMULATOR" -version 2>&1 | tee "$REPORTS/EMULATOR_VERSION.txt"
          export ANDROID_USER_HOME="$ROOT/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          AVD_NAME="bahrain-brick-phase1-landscape-api34"
          rm -rf "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD_NAME" --package "$SYSTEM_IMAGE" --device pixel_7 > "$LOGS/AVD_CREATE.txt" 2>&1
          "$EMULATOR" -list-avds | tee "$REPORTS/AVD_LIST.txt"
          grep -qx "$AVD_NAME" "$REPORTS/AVD_LIST.txt"

          sudo chmod a+rw /dev/kvm || true
          "$EMULATOR" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -camera-back none -camera-front none -memory 3072 -cores 2 -no-metrics > "$LOGS/EMULATOR.txt" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 300 adb wait-for-device
          booted=false
          for _ in $(seq 1 150); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then booted=true; break; fi
            kill -0 "$EMULATOR_PID"
            sleep 2
          done
          [[ "$booted" == true ]]
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb shell settings put system screen_off_timeout 2147483647
          adb shell settings put secure immersive_mode_confirmations confirmed
          test "$(adb shell settings get secure immersive_mode_confirmations | tr -d '\r')" = "confirmed"
          sleep 3

          adb install -r -t "$APK" | tee "$LOGS/APK_INSTALL.txt"
          adb logcat -c
          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start -W -n "$PACKAGE_NAME/com.godot.game.GodotApp" | tee "$LOGS/APK_LAUNCH.txt"
          ready=false
          for _ in $(seq 1 120); do
            adb logcat -d -v threadtime > "$LOGCAT"
            if grep -q 'BAHRAIN_BRICK_CUBE_SMOKE_READY size=1.000,1.000,1.000' "$LOGCAT"; then ready=true; break; fi
            test -n "$(adb shell pidof "$PACKAGE_NAME" 2>/dev/null | tr -d '\r')"
            sleep 2
          done
          [[ "$ready" == true ]]
          sleep 5
          adb logcat -d -v threadtime > "$LOGCAT"
          grep -Ei "$PACKAGE_NAME|Godot|godot|BAHRAIN_BRICK_CUBE_SMOKE_READY|FATAL EXCEPTION|Fatal signal|am_crash|am_anr|ANR in|Program linking failed|shader failed to compile" "$LOGCAT" > "$FILTERED" || true
          if grep -Eq 'FATAL EXCEPTION|Fatal signal|am_crash|am_anr|ANR in|Program linking failed|shader failed to compile' "$FILTERED"; then
            cat "$FILTERED"
            exit 1
          fi
          test -n "$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"
          adb shell dumpsys window windows > "$REPORTS/WINDOW_STATE.txt"
          grep -q "$PACKAGE_NAME" "$REPORTS/WINDOW_STATE.txt"
          adb shell dumpsys activity activities > "$REPORTS/ACTIVITY_STATE.txt"
          grep -q "$PACKAGE_NAME/com.godot.game.GodotApp" "$REPORTS/ACTIVITY_STATE.txt"

          adb exec-out screencap -p > "$SCREENSHOT"
          python3 - "$SCREENSHOT" "$REPORTS/SCREENSHOT_VALIDATION.json" <<'PY'
          from PIL import Image, ImageStat
          import json
          import sys

          image = Image.open(sys.argv[1]).convert("RGB")
          width, height = image.size
          stat = ImageStat.Stat(image)
          pixels = image.load()
          orange = 0
          for y in range(height):
              for x in range(width):
                  r, g, b = pixels[x, y]
                  if r >= 150 and 35 <= g <= 180 and b <= 120 and r >= g + 35:
                      orange += 1
          report = {
              "width": width,
              "height": height,
              "mean_rgb": stat.mean,
              "extrema": stat.extrema,
              "orange_cube_pixels": orange,
          }
          assert width > height, report
          assert sum(1 for lo, hi in stat.extrema if hi - lo > 25) >= 2, report
          assert sum(stat.mean) / 3 > 4, report
          assert orange >= 500, report
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          sha256sum "$SCREENSHOT" | tee "$REPORTS/ANDROID_SCREENSHOT_SHA256SUM.txt"

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')" SCREEN_SHA="$(sha256sum "$SCREENSHOT" | awk '{print $1}')" python3 - "$REPORTS/PHASE1_CUBE_ANDROID_RESULT.json" <<'PY'
          import json
          import os
          import sys
          report = {
              "status": "PASS",
              "source_run_id": 31290094969,
              "source_artifact_id": 9031108247,
              "cube_sha256": "00b2e146a7af0cc1043e9492f87c9ef2747d884aa0ada987e9be812537de8e2b",
              "api_level": 34,
              "abi": "x86_64",
              "orientation": "landscape",
              "package": "com.bahrainbrick.cubesmoke",
              "activity": "com.godot.game.GodotApp",
              "apk_sha256": os.environ["APK_SHA"],
              "runtime_marker": "BAHRAIN_BRICK_CUBE_SMOKE_READY size=1.000,1.000,1.000",
              "screenshot_sha256": os.environ["SCREEN_SHA"],
              "crash_and_shader_scan": "PASS",
              "visible_cube_pixel_check": "PASS",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload landscape Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-master-asset-phase1-landscape-${{ github.run_id }}
          path: |
            build/master-asset-phase1-landscape/reports
            build/master-asset-phase1-landscape/logs
            build/master-asset-phase1-landscape/artifacts
            build/master-asset-phase1-landscape/project
          if-no-files-found: error
          retention-days: 30
