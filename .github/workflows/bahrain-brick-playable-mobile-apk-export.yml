name: Bahrain Brick Playable Mobile APK Export

on:
  push:
    branches:
      - work/bahrain-brick-renderer-runtime-debugging-r1
      - work/bahrain-brick-reference-visual-upgrade
    paths:
      - .github/workflows/bahrain-brick-playable-mobile-apk-export.yml
      - project.godot
      - scenes/splash_screen.tscn
      - scenes/loading_screen.tscn
      - scenes/main_menu.tscn
      - scenes/character_select.tscn
      - scripts/splash_screen.gd
      - scripts/loading_screen.gd
      - scripts/main_menu.gd
      - scripts/character_select.gd
      - scripts/game_manager.gd
      - scripts/save_manager.gd
      - scripts/ui/**
      - tools/graphics/patch_r1_playable_export.py
      - tools/graphics/export_r1_playable_mobile_apk.sh
      - tools/graphics/verify_visual_upgrade_slice_a.py
      - tests/graphics/test_r1_playable_apk_export.py
      - tests/visual/test_visual_upgrade_slice_a.py

permissions:
  contents: read

concurrency:
  group: bahrain-brick-playable-mobile-apk-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-playable-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OUTPUT_ROOT: /tmp/bahrain-brick-playable-mobile
      OUTPUT_APK: /tmp/bahrain-brick-playable-mobile/bahrain-brick-playable-mobile-arm64.apk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install export dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb unzip
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Verify playable-export regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_playable_apk_export.py -v
          python3 -m py_compile tools/graphics/patch_r1_playable_export.py
          bash -n tools/graphics/export_r1_playable_mobile_apk.sh

      - name: Verify visual upgrade source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/visual/test_visual_upgrade_slice_a.py -v
          python3 -m py_compile tools/graphics/verify_visual_upgrade_slice_a.py
          python3 tools/graphics/verify_visual_upgrade_slice_a.py --root .

      - name: Export production-scene APK
        shell: bash
        run: |
          set -euo pipefail
          bash tools/graphics/export_r1_playable_mobile_apk.sh "$GITHUB_WORKSPACE" "$OUTPUT_ROOT"

      - name: Verify visual upgrade APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/graphics/verify_visual_upgrade_slice_a.py \
            --root . \
            --apk "$OUTPUT_APK"

      - name: Verify APK identity and handoff
        shell: bash
        run: |
          set -euo pipefail
          APK="$OUTPUT_APK"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$OUTPUT_ROOT/playable-apk-signing.txt"
          set +e
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" > "$OUTPUT_ROOT/playable-apk-badging.txt" 2>&1
          AAPT_STATUS=$?
          set -e
          cat "$OUTPUT_ROOT/playable-apk-badging.txt"
          if (( AAPT_STATUS != 0 )); then
            if grep -Fq "AndroidManifest.xml:0: error: failed to read attribute 'android:required': attribute is not an integer value." "$OUTPUT_ROOT/playable-apk-badging.txt"; then
              printf '%s\n' 'Known aapt AndroidManifest android:required warning accepted; continuing with explicit identity checks.'
            else
              printf '%s\n' 'aapt dump badging failed unexpectedly' >&2
              exit "$AAPT_STATUS"
            fi
          fi
          grep -q "package: name='com.brickbahrain.playable.mobile'" "$OUTPUT_ROOT/playable-apk-badging.txt"
          grep -q "application-label:'Bahrain Brick Open World'" "$OUTPUT_ROOT/playable-apk-badging.txt"
          sha256sum "$APK" | tee "$OUTPUT_ROOT/PLAYABLE_APK_SHA256SUMS.txt"
          python3 - "$APK" "$OUTPUT_ROOT/PLAYABLE_APK_HANDOFF.json" "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          apk = Path(sys.argv[1])
          output = Path(sys.argv[2])
          source_commit = sys.argv[3]
          h = hashlib.sha256()
          with apk.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  h.update(chunk)
          payload = {
              'schema_version': 1,
              'purpose': 'Playable Android package using the production project main scene',
              'source_commit': source_commit,
              'engine': '4.3-stable',
              'renderer': 'mobile',
              'architecture': 'arm64-v8a',
              'package': 'com.brickbahrain.playable.mobile',
              'filename': apk.name,
              'size_bytes': apk.stat().st_size,
              'sha256': h.hexdigest(),
              'production_main_scene_preserved': True,
              'diagnostic_main_scene_selected': False,
              'diagnostic_evidence_camera_selected': False,
              'debug_signed': True,
          }
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Print handoff diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          printf '%s\n' '===== output inventory ====='
          find "$OUTPUT_ROOT" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
          for log in \
            "$OUTPUT_ROOT/import.log" \
            "$OUTPUT_ROOT/export-gl.log" \
            "$OUTPUT_ROOT/export-mobile.log" \
            "$OUTPUT_ROOT/playable-apk-signing.txt" \
            "$OUTPUT_ROOT/playable-apk-badging.txt" \
            "$OUTPUT_ROOT/PLAYABLE_APK_SHA256SUMS.txt" \
            "$OUTPUT_ROOT/SOURCE_TREE_EQUIVALENCE.json"; do
            if [[ -f "$log" ]]; then
              printf '\n===== tail: %s =====\n' "$log"
              tail -n 500 "$log"
            fi
          done
          printf '\n===== crash traces =====\n'
          find "$OUTPUT_ROOT" "$GITHUB_WORKSPACE" -type f \
            \( -name 'core*' -o -name '*.crash' -o -name '*.stacktrace' \) \
            -print 2>/dev/null

      - name: Upload handoff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-playable-handoff-diagnostics-${{ github.run_id }}
          path: |
            /tmp/bahrain-brick-playable-mobile/import.log
            /tmp/bahrain-brick-playable-mobile/export-gl.log
            /tmp/bahrain-brick-playable-mobile/export-mobile.log
            /tmp/bahrain-brick-playable-mobile/GODOT_VERSION.txt
            /tmp/bahrain-brick-playable-mobile/SOURCE_TREE_EQUIVALENCE.json
            /tmp/bahrain-brick-playable-mobile/reconstruction/evidence/FINAL_TREE_MANIFEST.json
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_HANDOFF.json
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_SHA256SUMS.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-signing.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-badging.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-playable-mobile-arm64-${{ github.run_id }}
          path: |
            /tmp/bahrain-brick-playable-mobile/bahrain-brick-playable-mobile-arm64.apk
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_HANDOFF.json
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_SHA256SUMS.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-signing.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-badging.txt
            /tmp/bahrain-brick-playable-mobile/export-mobile.log
          retention-days: 30
