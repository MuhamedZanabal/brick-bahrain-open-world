name: Bahrain Brick Playable Mobile APK Export

on:
  push:
    branches:
      - work/bahrain-brick-renderer-runtime-debugging-r1
      - work/bahrain-brick-reference-visual-upgrade
    paths:
      - .github/workflows/bahrain-brick-playable-mobile-apk-export.yml
      - project.godot
      - scenes/splash_screen.tscn
      - scenes/loading_screen.tscn
      - scenes/main_menu.tscn
      - scenes/character_select.tscn
      - scripts/splash_screen.gd
      - scripts/loading_screen.gd
      - scripts/main_menu.gd
      - scripts/character_select.gd
      - scripts/game_manager.gd
      - scripts/save_manager.gd
      - scripts/ui/**
      - tools/graphics/patch_r1_playable_export.py
      - tools/graphics/export_r1_playable_mobile_apk.sh
      - tools/graphics/verify_visual_upgrade_slice_a.py
      - tests/graphics/test_r1_playable_apk_export.py
      - tests/visual/test_visual_upgrade_slice_a.py

permissions:
  contents: read

concurrency:
  group: bahrain-brick-playable-mobile-apk-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-playable-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OUTPUT_ROOT: /tmp/bahrain-brick-playable-mobile
      OUTPUT_APK: /tmp/bahrain-brick-playable-mobile/bahrain-brick-playable-mobile-arm64.apk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install export dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb unzip
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Verify playable-export regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_playable_apk_export.py -v
          python3 -m py_compile tools/graphics/patch_r1_playable_export.py
          bash -n tools/graphics/export_r1_playable_mobile_apk.sh

      - name: Verify visual upgrade source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/visual/test_visual_upgrade_slice_a.py -v
          python3 -m py_compile tools/graphics/verify_visual_upgrade_slice_a.py
          python3 tools/graphics/verify_visual_upgrade_slice_a.py --root .

      - name: Export production-scene APK
        shell: bash
        run: |
          set -euo pipefail
          bash tools/graphics/export_r1_playable_mobile_apk.sh "$GITHUB_WORKSPACE" "$OUTPUT_ROOT"

      - name: Verify visual upgrade APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/graphics/verify_visual_upgrade_slice_a.py \
            --root . \
            --apk "$OUTPUT_APK"

      - name: Verify APK identity and handoff
        shell: bash
        run: |
          set -euo pipefail
          APK="$OUTPUT_APK"
          test -s "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          APKANALYZER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -perm -u+x | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -n "$APKANALYZER"
          test -x "$APKANALYZER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUTPUT_ROOT/playable-apk-signing.txt"
          "$APKANALYZER" apk summary "$APK" | tee "$OUTPUT_ROOT/playable-apk-summary.txt"
          "$APKANALYZER" manifest print "$APK" | tee "$OUTPUT_ROOT/playable-apk-manifest.xml"
          "$APKANALYZER" manifest application-id "$APK" | tee "$OUTPUT_ROOT/playable-apk-application-id.txt"
          "$APKANALYZER" manifest version-name "$APK" | tee "$OUTPUT_ROOT/playable-apk-version-name.txt"
          "$APKANALYZER" manifest version-code "$APK" | tee "$OUTPUT_ROOT/playable-apk-version-code.txt"
          "$APKANALYZER" manifest min-sdk "$APK" | tee "$OUTPUT_ROOT/playable-apk-min-sdk.txt"
          "$APKANALYZER" manifest target-sdk "$APK" | tee "$OUTPUT_ROOT/playable-apk-target-sdk.txt"
          "$APKANALYZER" manifest permissions "$APK" | tee "$OUTPUT_ROOT/playable-apk-permissions.txt"
          "$APKANALYZER" resources value --config default --name godot_project_name_string --type string --package com.brickbahrain.playable.mobile "$APK" | tee "$OUTPUT_ROOT/playable-apk-app-label.txt"
          unzip -l "$APK" | tee "$OUTPUT_ROOT/playable-apk-inventory.txt"

          set +e
          "$AAPT" dump badging "$APK" > "$OUTPUT_ROOT/playable-apk-badging.txt" 2>&1
          AAPT_STATUS=$?
          set -e
          cat "$OUTPUT_ROOT/playable-apk-badging.txt"
          if (( AAPT_STATUS != 0 )); then
            if grep -Fq "AndroidManifest.xml:0: error: failed to read attribute 'android:required': attribute is not an integer value." "$OUTPUT_ROOT/playable-apk-badging.txt"; then
              printf '%s\n' 'Known aapt AndroidManifest android:required warning accepted; apkanalyzer remains the identity authority.'
            else
              printf '%s\n' 'aapt dump badging failed unexpectedly' >&2
              exit "$AAPT_STATUS"
            fi
          fi

          APPLICATION_ID="$(tr -d '\r\n' < "$OUTPUT_ROOT/playable-apk-application-id.txt")"
          APP_LABEL="$(tr -d '\r\n' < "$OUTPUT_ROOT/playable-apk-app-label.txt")"
          VERSION_NAME="$(tr -d '\r\n' < "$OUTPUT_ROOT/playable-apk-version-name.txt")"
          VERSION_CODE="$(tr -d '\r\n' < "$OUTPUT_ROOT/playable-apk-version-code.txt")"
          MIN_SDK="$(tr -d '\r\n' < "$OUTPUT_ROOT/playable-apk-min-sdk.txt")"
          TARGET_SDK="$(tr -d '\r\n' < "$OUTPUT_ROOT/playable-apk-target-sdk.txt")"
          SIGNING_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' "$OUTPUT_ROOT/playable-apk-signing.txt")"

          test "$APPLICATION_ID" = "com.brickbahrain.playable.mobile"
          test "$APP_LABEL" = "Bahrain Brick Open World"
          test "$VERSION_CODE" = "1404"
          test "$VERSION_NAME" = "1.4.0.4-premium-visual-qa"
          test "$MIN_SDK" = "21"
          test "$TARGET_SDK" = "34"
          test -n "$SIGNING_CERT_SHA256"
          grep -Fxq 'android.permission.INTERNET' "$OUTPUT_ROOT/playable-apk-permissions.txt"
          grep -Fxq 'android.permission.ACCESS_NETWORK_STATE' "$OUTPUT_ROOT/playable-apk-permissions.txt"
          grep -Fq 'android:label="@string/godot_project_name_string"' "$OUTPUT_ROOT/playable-apk-manifest.xml"
          grep -Fq 'android:screenOrientation="landscape"' "$OUTPUT_ROOT/playable-apk-manifest.xml"
          grep -Eq 'lib/arm64-v8a/libgodot_android\.so' "$OUTPUT_ROOT/playable-apk-inventory.txt"
          if grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/' "$OUTPUT_ROOT/playable-apk-inventory.txt"; then
            printf '%s\n' 'unexpected non-arm64 native library found in playable APK' >&2
            exit 1
          fi

          sha256sum "$APK" | tee "$OUTPUT_ROOT/PLAYABLE_APK_SHA256SUMS.txt"
          python3 - "$APK" "$OUTPUT_ROOT/PLAYABLE_APK_HANDOFF.json" "$GITHUB_SHA" \
            "$APPLICATION_ID" "$APP_LABEL" "$VERSION_CODE" "$VERSION_NAME" \
            "$MIN_SDK" "$TARGET_SDK" "$SIGNING_CERT_SHA256" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          apk = Path(sys.argv[1])
          output = Path(sys.argv[2])
          source_commit = sys.argv[3]
          application_id, app_label = sys.argv[4:6]
          version_code, version_name = sys.argv[6:8]
          min_sdk, target_sdk, signing_certificate_sha256 = sys.argv[8:11]
          h = hashlib.sha256()
          with apk.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  h.update(chunk)
          payload = {
              'schema_version': 2,
              'purpose': 'Playable Android package using the production project main scene',
              'source_commit': source_commit,
              'engine': '4.3-stable',
              'renderer': 'mobile',
              'architecture': 'arm64-v8a',
              'package': application_id,
              'app_label': app_label,
              'version_code': int(version_code),
              'version_name': version_name,
              'min_sdk': int(min_sdk),
              'target_sdk': int(target_sdk),
              'filename': apk.name,
              'size_bytes': apk.stat().st_size,
              'sha256': h.hexdigest(),
              'signing_certificate_sha256': signing_certificate_sha256,
              'production_main_scene_preserved': True,
              'diagnostic_main_scene_selected': False,
              'diagnostic_evidence_camera_selected': False,
              'debug_signed': True,
          }
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Print handoff diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          printf '%s\n' '===== output inventory ====='
          find "$OUTPUT_ROOT" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
          for log in \
            "$OUTPUT_ROOT/import.log" \
            "$OUTPUT_ROOT/export-gl.log" \
            "$OUTPUT_ROOT/export-mobile.log" \
            "$OUTPUT_ROOT/playable-apk-signing.txt" \
            "$OUTPUT_ROOT/playable-apk-badging.txt" \
            "$OUTPUT_ROOT/playable-apk-summary.txt" \
            "$OUTPUT_ROOT/playable-apk-manifest.xml" \
            "$OUTPUT_ROOT/playable-apk-application-id.txt" \
            "$OUTPUT_ROOT/playable-apk-app-label.txt" \
            "$OUTPUT_ROOT/playable-apk-version-name.txt" \
            "$OUTPUT_ROOT/playable-apk-version-code.txt" \
            "$OUTPUT_ROOT/playable-apk-min-sdk.txt" \
            "$OUTPUT_ROOT/playable-apk-target-sdk.txt" \
            "$OUTPUT_ROOT/playable-apk-permissions.txt" \
            "$OUTPUT_ROOT/playable-apk-inventory.txt" \
            "$OUTPUT_ROOT/PLAYABLE_APK_SHA256SUMS.txt" \
            "$OUTPUT_ROOT/SOURCE_TREE_EQUIVALENCE.json"; do
            if [[ -f "$log" ]]; then
              printf '\n===== tail: %s =====\n' "$log"
              tail -n 500 "$log"
            fi
          done
          printf '\n===== crash traces =====\n'
          find "$OUTPUT_ROOT" "$GITHUB_WORKSPACE" -type f \
            \( -name 'core*' -o -name '*.crash' -o -name '*.stacktrace' \) \
            -print 2>/dev/null

      - name: Upload handoff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-playable-handoff-diagnostics-${{ github.run_id }}
          path: |
            /tmp/bahrain-brick-playable-mobile/import.log
            /tmp/bahrain-brick-playable-mobile/export-gl.log
            /tmp/bahrain-brick-playable-mobile/export-mobile.log
            /tmp/bahrain-brick-playable-mobile/GODOT_VERSION.txt
            /tmp/bahrain-brick-playable-mobile/SOURCE_TREE_EQUIVALENCE.json
            /tmp/bahrain-brick-playable-mobile/reconstruction/evidence/FINAL_TREE_MANIFEST.json
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_HANDOFF.json
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_SHA256SUMS.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-signing.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-badging.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-summary.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-manifest.xml
            /tmp/bahrain-brick-playable-mobile/playable-apk-application-id.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-app-label.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-version-name.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-version-code.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-min-sdk.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-target-sdk.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-permissions.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-inventory.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-playable-mobile-arm64-${{ github.run_id }}
          path: |
            /tmp/bahrain-brick-playable-mobile/bahrain-brick-playable-mobile-arm64.apk
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_HANDOFF.json
            /tmp/bahrain-brick-playable-mobile/PLAYABLE_APK_SHA256SUMS.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-signing.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-badging.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-summary.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-manifest.xml
            /tmp/bahrain-brick-playable-mobile/playable-apk-application-id.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-app-label.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-version-name.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-version-code.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-min-sdk.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-target-sdk.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-permissions.txt
            /tmp/bahrain-brick-playable-mobile/playable-apk-inventory.txt
            /tmp/bahrain-brick-playable-mobile/export-mobile.log
          retention-days: 30
