name: Bahrain Brick Asset Production CI

on:
  push:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    paths:
      - .github/workflows/asset-production-ci.yml
      - tools/asset_lab/**
      - tests/test_validation_cube_pipeline.py
      - tests/test_asset_production_workflow.py
      - asset_lab/reports/**
  pull_request:
    branches: [work/bahrain-brick-premium-visual-v14]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_PREMIUM_AUTHORITY: e26ec912db5c10d071a8e120010bdb5a9a136f17
  EXPECTED_CHECKPOINT: 5383c376df40f2a427fc5f739cac0ad23584de35
  EXPECTED_INTEGRATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ASSET_AUTHORITY_COMMIT: 84ac94399262f71f29bf65dd553cd7729d87cce0
  ASSET_CORRECTIVE_COMMIT: 7aed2cf05f63e0c3c607a98acde454ff103584eb
  BLENDER_VERSION: 4.3.2
  GODOT_VERSION: 4.3
  GODOT_BUILD: 77dcf97d8
  ANDROID_PLATFORM: android-34
  ANDROID_BUILD_TOOLS: 34.0.0
  GLTF_VALIDATOR_VERSION: 2.0.0-dev.3.10
  GAME_SOURCE_URL: https://github.com/MuhamedZanabal/brick-bahrain-open-world/releases/download/v1.4.0.3-graphics-qa/bahrain_brick_v14.0.3-graphics-source.zip
  GAME_SOURCE_SHA256: 5c4d8ac4497eda7752058424062a74a97c1f6f5e0c9a1ff393abac2a2c7c828a
  PACKAGE_NAME: com.bahrainbrick.game.qa
  VERSION_CODE: '1404'
  VERSION_NAME: 1.4.0.4-premium-visual-qa
  APK_NAME: bahrain-brick-asset-production-debug.apk

jobs:
  production:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'work/bahrain-brick-asset-lab-integration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact authorized integration commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Provision Java 17
        uses: actions/setup-java@81c13a41f910e657690fdbe251b91fddc27e217c
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision pinned Android SDK tools
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      - name: Run complete production chain
        shell: bash
        run: |
          mkdir -p build/asset-production/logs
          set -o pipefail
          bash tools/asset_lab/run_asset_production_ci.sh 2>&1 | tee build/asset-production/logs/production-driver.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build final evidence inventory
        if: always()
        shell: bash
        run: |
          mkdir -p build/asset-production
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('build/asset-production'); files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and ('reports' in x.parts or 'logs' in x.parts or 'artifacts' in x.parts or x.suffix in {'.blend','.glb'})):
              files.append({'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'EVIDENCE_INVENTORY.json').write_text(json.dumps({'files':files},indent=2)+'\n')
          PY
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-asset-production-${{ github.run_id }}
          path: |
            build/asset-production/reports
            build/asset-production/logs
            build/asset-production/artifacts
            build/asset-production/cube-a
            build/asset-production/generated
            build/asset-production/EVIDENCE_INVENTORY.json
          if-no-files-found: error
          retention-days: 30
