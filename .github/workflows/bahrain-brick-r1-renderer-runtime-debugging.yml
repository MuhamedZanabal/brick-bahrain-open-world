name: Bahrain Brick R1 Targeted Android Engine Fix

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-g0-2-android-renderer-qualification]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-r1-renderer-runtime-debugging.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bahrain-brick-r1-targeted-engine-fix
  cancel-in-progress: false

jobs:
  targeted_android_fix:
    if: github.head_ref == 'work/bahrain-brick-renderer-runtime-debugging-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact fix head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run focused engine-upgrade tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_engine_upgrade.py -v
          python3 -m py_compile tools/graphics/prepare_r1_android_variant.py tools/graphics/patch_r1_reconstruction_preflight.py
          bash -n tools/graphics/run_r1_renderer_debug.sh

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17.0.12'
          check-latest: false

      - name: Set up API 34 AOSP x86_64 Android environment
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            emulator
            platforms;android-34
            build-tools;34.0.0
            system-images;android-34;default;x86_64

      - name: Install export and emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check | tee build-r1-acceleration.txt || true

      - name: Build and launch GL and Mobile with Godot 4.7.1
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash tools/graphics/run_r1_renderer_debug.sh "$PWD" "$PWD/build/r1" 2>&1 | tee build/r1-targeted-runner.log

      - name: Upload targeted Android proof
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-r1-engine-fix-${{ github.run_id }}
          path: |
            build/r1/R1_ENGINE_UPGRADE_RESULT.json
            build/r1/GODOT_VERSION.txt
            build/r1/APK_SHA256SUMS.txt
            build/r1/SOURCE_TREE_EQUIVALENCE.json
            build/r1/raw
            build/r1/*.log
            build/r1/*.txt
            build/r1-targeted-runner.log
            build-r1-acceleration.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce targeted Android result
        if: always()
        shell: bash
        run: test '${{ steps.targeted.outcome }}' = success
