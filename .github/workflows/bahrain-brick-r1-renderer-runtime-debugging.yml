name: Bahrain Brick R1 Engine 4.7.1 Comparison

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-g0-2-android-renderer-qualification]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-r1-renderer-runtime-debugging.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bahrain-brick-r1-engine-4-7-1-comparison
  cancel-in-progress: false

jobs:
  targeted_engine_comparison:
    if: github.head_ref == 'work/bahrain-brick-renderer-runtime-debugging-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run focused engine-comparison tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_engine_upgrade.py -v
          python3 -m unittest tests/graphics/test_r1_engineering_stop.py -v
          python3 -m json.tool reports/graphics/r1/R1_ENGINEERING_STOP.json >/dev/null
          python3 -m json.tool reports/graphics/r1/R1_DIAGNOSTIC_CONTINUATION.json >/dev/null
          python3 -m json.tool reports/graphics/r1/R1_ENGINE_UPGRADE_EXPERIMENT.json >/dev/null
          python3 -m json.tool .ai/project-state.json >/dev/null
          bash -n tools/graphics/run_r1_renderer_debug.sh
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17.0.12'
      - uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            emulator
            platforms;android-34
            build-tools;34.0.0
            system-images;android-34;default;x86_64
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers vulkan-tools python3-pil
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Build and launch GL and Mobile
        id: engine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash tools/graphics/run_r1_renderer_debug.sh "$PWD" "$PWD/build/r1" 2>&1 | tee build-r1-engine.log
      - name: Upload engine-comparison proof
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-r1-engine-4-7-1-${{ github.run_id }}
          path: |
            build/r1/R1_ENGINE_UPGRADE_RESULT.json
            build/r1/GODOT_VERSION.txt
            build/r1/GL_VARIANT_OVERRIDE.json
            build/r1/MOBILE_VARIANT_OVERRIDE.json
            build/r1/SOURCE_TREE_EQUIVALENCE.json
            build/r1/APK_SHA256SUMS.txt
            build/r1/raw/gl_production
            build/r1/raw/mobile_baseline
            build-r1-engine.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce engine decision
        if: always()
        run: test '${{ steps.engine.outcome }}' = success
