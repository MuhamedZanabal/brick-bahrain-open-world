name: Bahrain Brick R1 Final Engineering Stop

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-g0-2-android-renderer-qualification]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-r1-renderer-runtime-debugging.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: bahrain-brick-r1-final-engineering-stop
  cancel-in-progress: true

jobs:
  verify_final_engineering_stop:
    if: github.head_ref == 'work/bahrain-brick-renderer-runtime-debugging-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify final R1 engineering stop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_engine_upgrade.py -v
          python3 -m unittest tests/graphics/test_r1_engineering_stop.py -v
          python3 -m json.tool reports/graphics/r1/R1_ENGINEERING_STOP.json >/dev/null
          python3 -m json.tool reports/graphics/r1/R1_DIAGNOSTIC_CONTINUATION.json >/dev/null
          python3 -m json.tool reports/graphics/r1/R1_ENGINE_UPGRADE_EXPERIMENT.json >/dev/null
          python3 -m json.tool reports/graphics/r1/R1_ENGINE_UPGRADE_RESULT.json >/dev/null
          python3 -m json.tool .ai/project-state.json >/dev/null
          bash -n tools/graphics/run_r1_renderer_debug.sh
          bash -n tools/graphics/run_r1_engine_retry.sh
          set +e
          output="$(bash tools/graphics/run_r1_renderer_debug.sh 2>&1)"
          status=$?
          set -e
          test "$status" -eq 64
          grep -q 'R1_ENGINEERING_STOP' <<<"$output"
