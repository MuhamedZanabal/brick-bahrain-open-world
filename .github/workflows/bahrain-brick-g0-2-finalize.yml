          PY

      - name: Validate and stage terminal outputs
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/g0_2_terminal/reports')
          required=[
            'authority.json','shared_import_equivalence.json','emulator_environment.json','apk_inventory.json',
            'gl_compatibility/state_machine.json','gl_compatibility/package_report.json','gl_compatibility/launch_report.json','gl_compatibility/runtime.json','gl_compatibility/frame_metrics.csv','gl_compatibility/logcat_full.txt','gl_compatibility/logcat_critical.txt','gl_compatibility/screenshot.png','gl_compatibility/classification.json',
            'mobile_vulkan/state_machine.json','mobile_vulkan/package_report.json','mobile_vulkan/launch_report.json','mobile_vulkan/runtime.json','mobile_vulkan/frame_metrics.csv','mobile_vulkan/logcat_full.txt','mobile_vulkan/logcat_critical.txt','mobile_vulkan/screenshot.png','mobile_vulkan/classification.json',
            'screenshot_comparison.json','screenshot_difference.png','G0_2_TERMINAL_REPORT.json','G0_2_TERMINAL_REPORT.md',
          ]
          for rel in required:
            path=root/rel
            assert path.is_file() and path.stat().st_size>0,(rel,path.stat().st_size if path.exists() else None)
          for path in root.rglob('*.json'): json.loads(path.read_text())
          terminal=json.loads((root/'G0_2_TERMINAL_REPORT.json').read_text())
          assert terminal['terminal_outcome']=='G0_2_ANDROID_NEITHER_RENDERER_FUNCTIONAL'
          assert terminal['gl_compatibility']['classification']=='ANDROID_CRITICAL_RUNTIME_FAILURE'
          assert terminal['mobile_vulkan']['classification']=='ANDROID_SCENE_READINESS_FAILURE'
          assert terminal['gate_g0']=='G0_EVIDENCE_INSUFFICIENT'
          assert terminal['renderer_decision'] is None
          assert terminal['renderer_defaults_modified'] is False
          assert terminal['g1_authorized'] is False
          assert terminal['device_handoff_tests_performed'] is False
          assert terminal['screenshot_comparison']['comparison_performed'] is False
          handoff=Path('build/g0_2_terminal/handoff')
          for name in ('README.md','device_result.schema.json','run_device_test.sh','run_device_test.ps1','adb_capture_commands.txt','expected_markers.txt','apk_sha256.txt'):
            path=handoff/name; assert path.is_file() and path.stat().st_size>0,name
          json.loads((handoff/'device_result.schema.json').read_text())
          PY
          bash -n build/g0_2_terminal/handoff/run_device_test.sh
          rm -rf reports/graphics/g0_2
          mkdir -p reports/graphics/g0_2 reports/graphics/g0/device_handoff
          cp -R build/g0_2_terminal/reports/. reports/graphics/g0_2/
          cp build/g0_2_terminal/handoff/* reports/graphics/g0/device_handoff/

      - name: Commit terminal reports and reconciled state
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/graphics/finalize_g0_2_android_evidence.py tests/graphics/test_finalize_g0_2_android_evidence.py reports/graphics/g0_2 reports/graphics/g0/device_handoff .ai/project-state.json .ai/CHECKPOINT.md
          git rm tools/graphics/apply_g0_2_finalizer_fix.py
          allowed='^(tools/graphics/finalize_g0_2_android_evidence.py|tests/graphics/test_finalize_g0_2_android_evidence.py|reports/graphics/g0_2/|reports/graphics/g0/device_handoff/|\.ai/project-state\.json$|\.ai/CHECKPOINT\.md$)'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          git commit -m 'G0.2: emit paired Android terminal qualification reports'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
