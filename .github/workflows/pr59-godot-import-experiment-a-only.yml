name: Bahrain Brick PR59 Godot Import Experiment A Only

on:
  push:
    branches: [ci/pr59-existing-apk-gate-closure-20260717]
    paths: [.github/workflows/pr59-godot-import-experiment-a-only.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  INPUT_RUN_ID: '29627302405'
  INPUT_ARTIFACT: pr59-godot-import-experiment-input-29627302405

jobs:
  experiment_a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-existing-apk-gate-closure-20260717
          path: tooling
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.INPUT_ARTIFACT }}
          path: build/input
          repository: MuhamedZanabal/brick-bahrain-open-world
          run-id: ${{ env.INPUT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Run exact same-runner same-path sequential imports
        shell: bash
        run: |
          set -euo pipefail
          godot="$(find build/input/input/godot -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          source_zip=build/input/input/MANAMA_SOUQ_COMPOSITE_SOURCE.zip
          test -n "$godot"; chmod +x "$godot"
          test "$($godot --version)" = '4.3.stable.official.77dcf97d8'
          test "$(sha256sum "$source_zip" | awk '{print $1}')" = '5ca9ff72aaaddeb9d86fb02c2fe99de5da280988b3945c4c627e80effeb01aa7'
          mkdir -p build/a
          python3 - "$source_zip" "$godot" <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          module_path=Path('tooling/.github/forensics/pr59_import_experiments.py')
          spec=importlib.util.spec_from_file_location('exp',module_path)
          exp=importlib.util.module_from_spec(spec);spec.loader.exec_module(exp)
          source_zip=Path(sys.argv[1]);godot=Path(sys.argv[2]);base=Path('/tmp/bahrain-brick-experiment-a');out=Path('build/a')
          a1=exp.run_import('A1_same_runner_same_path',source_zip,godot,base/'canonical/game',315532800,out,base/'xdg')
          a2=exp.run_import('A2_same_runner_same_path',source_zip,godot,base/'canonical/game',315532800,out,base/'xdg')
          result=exp.compare(a1,a2)
          result['causal_control']={'same_runner':True,'same_absolute_path':a1['materialization']['target']==a2['materialization']['target'],'same_source_zip':a1['materialization']['source_zip_sha256']==a2['materialization']['source_zip_sha256'],'same_epoch':a1['materialization']['epoch']==a2['materialization']['epoch'],'same_normalized_environment':a1['environment']['effective_env']==a2['environment']['effective_env'],'same_umask':a1['environment']['umask']==a2['environment']['umask'],'same_cpu_count':a1['environment']['cpu_count']==a2['environment']['cpu_count']}
          result['intrinsic_uid_generation_nondeterminism_proven']=result['uid_difference_count']>0 and all(result['causal_control'].values())
          exp.write_json(out/'EXPERIMENT_A.json',result)
          PY
      - name: Record experiment A locator
        shell: bash
        working-directory: tooling
        run: |
          set -euo pipefail
          mkdir -p .github/forensics
          printf '{"run_id":%s,"workflow_commit":"%s"}\n' '${{ github.run_id }}' '${{ github.sha }}' > .github/forensics/LATEST_IMPORT_EXPERIMENT_A_RUN.json
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/LATEST_IMPORT_EXPERIMENT_A_RUN.json
          git commit -m "ci(forensics): record import experiment A ${{ github.run_id }}"
          git pull --rebase origin ci/pr59-existing-apk-gate-closure-20260717
          git push origin HEAD:ci/pr59-existing-apk-gate-closure-20260717
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: bahrain-brick-pr59-import-experiment-a-${{ github.run_id }}
          path: build/a
          if-no-files-found: error
          compression-level: 9
          retention-days: 30