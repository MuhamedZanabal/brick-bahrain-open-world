name: Bahrain Brick PR59 Nondeterminism Taxonomy Locator

on:
  workflow_run:
    workflows: [Bahrain Brick PR59 Godot Nondeterminism Taxonomy]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'ci/pr59-existing-apk-gate-closure-20260717'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-existing-apk-gate-closure-20260717
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/forensics
          cat > .github/forensics/LATEST_NONDETERMINISM_TAXONOMY_RUN.json <<JSON
          {"run_id":${{ github.event.workflow_run.id }},"conclusion":"${{ github.event.workflow_run.conclusion }}","head_sha":"${{ github.event.workflow_run.head_sha }}","workflow":"${{ github.event.workflow_run.name }}"}
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/LATEST_NONDETERMINISM_TAXONOMY_RUN.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(forensics): record nondeterminism taxonomy run ${{ github.event.workflow_run.id }}"
            git push origin HEAD:ci/pr59-existing-apk-gate-closure-20260717
          fi