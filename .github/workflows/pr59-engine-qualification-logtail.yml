name: Bahrain Brick Strict 4.5.2 Stage 2 Failure Context

on:
  push:
    branches: [ci/pr59-godot-engine-qualification-20260718]
    paths: [.github/workflows/pr59-engine-qualification-logtail.yml]

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-godot-engine-qualification-20260718
          fetch-depth: 0
      - name: Extract strict Stage 2 failure context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github/forensics/run-locators /tmp/joblog
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'User-Agent: pr59-strict-452-stage2-log-context' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/88093545257/logs" -o /tmp/joblog/raw
          if unzip -t /tmp/joblog/raw >/dev/null 2>&1; then unzip -p /tmp/joblog/raw > /tmp/joblog/decoded.txt; else cp /tmp/joblog/raw /tmp/joblog/decoded.txt; fi
          {
            grep -n -B 70 -A 100 -E 'Run strict exact-source Stage 2|Traceback|RuntimeError|ValueError|AssertionError|STRICT|Process completed with exit code|##\[error\]' /tmp/joblog/decoded.txt || true
            printf '\n--- final 180 lines ---\n'
            tail -n 180 /tmp/joblog/decoded.txt
          } > .github/forensics/run-locators/pr59-strict-452-stage2-failure-context.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/run-locators/pr59-strict-452-stage2-failure-context.txt
          git commit -m 'ci: record strict 4.5.2 Stage 2 failure context [skip ci]'
          git pull --rebase origin ci/pr59-godot-engine-qualification-20260718
          git push origin HEAD:ci/pr59-godot-engine-qualification-20260718
