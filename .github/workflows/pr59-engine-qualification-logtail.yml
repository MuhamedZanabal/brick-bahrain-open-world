name: Bahrain Brick Engine Qualification Integrity Diagnostic

on:
  push:
    branches: [ci/pr59-godot-engine-qualification-20260718]
    paths: [.github/workflows/pr59-engine-qualification-logtail.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-godot-engine-qualification-20260718
          fetch-depth: 0
      - name: Record exact harness and driver integrity
        shell: bash
        run: |
          set -u
          mkdir -p .github/forensics/run-locators /tmp/qdiag
          REPORT=.github/forensics/run-locators/pr59-engine-qualification-integrity-diagnostic.txt
          {
            echo 'PART_SIZES'
            wc -c .github/forensics/engine_qualification_parts/part*.b64
            cat .github/forensics/engine_qualification_parts/part*.b64 | tr -d '\n' > /tmp/qdiag/all.b64
            echo 'AGGREGATE_BASE64_BYTES'
            wc -c /tmp/qdiag/all.b64
            echo 'AGGREGATE_BASE64_SHA256'
            sha256sum /tmp/qdiag/all.b64
            echo 'BASE64_DECODE'
            base64 -d /tmp/qdiag/all.b64 > /tmp/qdiag/harness.gz; echo base64_exit=$?
            echo 'GZIP_BYTES_SHA256'
            wc -c /tmp/qdiag/harness.gz
            sha256sum /tmp/qdiag/harness.gz
            echo 'GZIP_TEST'
            gzip -t /tmp/qdiag/harness.gz; echo gzip_test_exit=$?
            echo 'GZIP_DECODE'
            gzip -dc /tmp/qdiag/harness.gz > /tmp/qdiag/harness.py; echo gzip_decode_exit=$?
            echo 'HARNESS_BYTES_SHA256'
            wc -c /tmp/qdiag/harness.py
            sha256sum /tmp/qdiag/harness.py
            echo 'HARNESS_COMPILE'
            python3 -m py_compile /tmp/qdiag/harness.py; echo compile_exit=$?
            echo 'DRIVER_BYTES_SHA256'
            wc -c .github/forensics/pr59_engine_qualification_driver.sh
            sha256sum .github/forensics/pr59_engine_qualification_driver.sh
            echo 'DRIVER_BASH_N'
            bash -n .github/forensics/pr59_engine_qualification_driver.sh; echo bash_n_exit=$?
          } > "$REPORT" 2>&1
          cat "$REPORT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT"
          git commit -m 'ci: record qualification integrity diagnostic [skip ci]'
          git pull --rebase origin ci/pr59-godot-engine-qualification-20260718
          git push origin HEAD:ci/pr59-godot-engine-qualification-20260718
