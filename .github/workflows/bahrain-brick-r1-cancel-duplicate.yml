name: Cancel queued duplicate R1 run

on:
  push:
    branches: [work/bahrain-brick-renderer-runtime-debugging-r1]

permissions:
  actions: write
  contents: read

jobs:
  cancel_duplicate:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel only queued non-adjudicative duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/30179862337/cancel"
