name: Golden Master Godot Android Gate

on:
  push:
    branches: [work/bahrain-brick-golden-master-batch1-v1]
    paths: &runtime_paths
      - .github/workflows/golden-master-godot-android-gate.yml
      - asset_lab/runtime/golden_master_manifest.json
      - asset_lab/reviews/golden-master-v31/README.md
      - scenes/golden_master_preview_district.tscn
      - scripts/golden_master_quality.gd
      - scripts/golden_master_lod_instance.gd
      - scripts/golden_master_preview_district.gd
      - tests/test_golden_master_runtime_contract.py
      - tests/golden_master_runtime_test.gd
      - tools/asset_lab/generate_golden_master_textures.py
      - tools/asset_lab/generate_golden_masters.py
      - tools/asset_lab/generate_golden_masters_v2.py
      - tools/asset_lab/generate_golden_masters_v3.py
      - tools/asset_lab/generate_golden_masters_v3_1.py
  pull_request:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    types: [opened, synchronize, reopened]
    paths: *runtime_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-master-godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: 4.3.2
  GODOT_VERSION: 4.3
  GODOT_BUILD: stable
  EXPECTED_GODOT_VERSION: 4.3.stable.official.77dcf97d8
  PACKAGE_NAME: com.brickbahrain.goldenmasterqa
  PROTECTED_WORLD_BLOB: c72ca10bdde7e421f3df6421240588946bb55e4f
  PROTECTED_PLAYER_BLOB: badf5f651c33450c140e4a7bebb37a1fe25ac586
  PROTECTED_TOUCH_BLOB: b19e59c2ce6d88e1154b8a9fa4cddcc3242898dd

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Batch 1 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify protected gameplay authority blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/world.gd)" = "$PROTECTED_WORLD_BLOB"
          test "$(git rev-parse HEAD:scripts/player_controller.gd)" = "$PROTECTED_PLAYER_BLOB"
          test "$(git rev-parse HEAD:scripts/touch_input.gd)" = "$PROTECTED_TOUCH_BLOB"
      - name: Run runtime contract and generator tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_golden_master_runtime_contract \
            tests.test_golden_master_contract \
            tests.test_golden_master_materials \
            tests.test_golden_master_texture_plan \
            tests.test_golden_master_generation_plan \
            tests.test_golden_master_v3_towers \
            tests.test_golden_master_v31_hero \
            -v
          python3 -m py_compile \
            tools/asset_lab/generate_golden_master_textures.py \
            tools/asset_lab/generate_golden_masters.py \
            tools/asset_lab/generate_golden_masters_v2.py \
            tools/asset_lab/generate_golden_masters_v3.py \
            tools/asset_lab/generate_golden_masters_v3_1.py

  godot_android:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out exact Batch 1 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record protected authority before production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          {
            echo "head=$(git rev-parse HEAD)"
            echo "world_blob=$(git rev-parse HEAD:scripts/world.gd)"
            echo "player_blob=$(git rev-parse HEAD:scripts/player_controller.gd)"
            echo "touch_blob=$(git rev-parse HEAD:scripts/touch_input.gd)"
          } | tee build/reports/PROTECTED_AUTHORITY_BEFORE.txt
          test "$(git rev-parse HEAD:scripts/world.gd)" = "$PROTECTED_WORLD_BLOB"
          test "$(git rev-parse HEAD:scripts/player_controller.gd)" = "$PROTECTED_PLAYER_BLOB"
          test "$(git rev-parse HEAD:scripts/touch_input.gd)" = "$PROTECTED_TOUCH_BLOB"
      - name: Install deterministic production dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless unzip rsync libfontconfig1 libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0
          mkdir -p build/downloads build/tools build/preview-project build/reports build/android-evidence
      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          cd build/downloads
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.3"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/$archive" -o "$archive"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/blender-${BLENDER_VERSION}.sha256" -o blender.sha256
          grep " $archive$" blender.sha256 | sha256sum -c -
          tar -xf "$archive"
          "$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" --version | tee ../reports/BLENDER_VERSION.txt
          grep -q '^Blender 4.3.2' ../reports/BLENDER_VERSION.txt
      - name: Install official Godot editor and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          cd build/downloads
          editor="Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-${GODOT_BUILD}_export_templates.tpz"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_BUILD}"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/$editor" -o "$editor"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/$templates" -o "$templates"
          sha256sum "$editor" "$templates" | tee ../reports/GODOT_DOWNLOAD_SHA256SUMS.txt
          unzip -q "$editor" -d ../tools/godot
          chmod +x ../tools/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64
          GODOT="$PWD/../tools/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          test "$($GODOT --version)" = "$EXPECTED_GODOT_VERSION"
          printf '%s\n' "$($GODOT --version)" | tee ../reports/GODOT_VERSION.txt
          rm -rf ../templates
          mkdir -p ../templates
          unzip -q "$templates" -d ../templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_BUILD}"
          cp -a ../templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_BUILD}/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_BUILD}/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_BUILD}/android_release.apk"
      - name: Assemble isolated preview project from production runtime sources
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW="$PWD/build/preview-project"
          mkdir -p \
            "$PREVIEW/scripts" \
            "$PREVIEW/scenes" \
            "$PREVIEW/tests" \
            "$PREVIEW/asset_lab/runtime" \
            "$PREVIEW/assets/asset_lab/golden_textures" \
            "$PREVIEW/assets/asset_lab/golden_masters"
          cp scripts/golden_master_quality.gd "$PREVIEW/scripts/"
          cp scripts/golden_master_lod_instance.gd "$PREVIEW/scripts/"
          cp scripts/golden_master_preview_district.gd "$PREVIEW/scripts/"
          cp scenes/golden_master_preview_district.tscn "$PREVIEW/scenes/"
          cp tests/golden_master_runtime_test.gd "$PREVIEW/tests/"
          cp asset_lab/runtime/golden_master_manifest.json "$PREVIEW/asset_lab/runtime/"
          cat > "$PREVIEW/project.godot" <<'EOF'
          ; Isolated CI project generated from the approved Bahrain Brick runtime sources.
          config_version=5

          [application]
          config/name="Bahrain Brick Golden Master QA"
          run/main_scene="res://scenes/golden_master_preview_district.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")

          [display]
          window/size/viewport_width=1920
          window/size/viewport_height=1080
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"
          window/handheld/orientation=1

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true
          EOF
          cat > "$PREVIEW/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../bahrain_brick_golden_master_qa.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86_64=true
          architectures/x86=false
          keystore/debug="res://debug.keystore"
          keystore/debug_password="android"
          keystore/debug_user="androiddebugkey"
          version/code=140531
          version/name="1.4.0-golden-master-v31"
          package/unique_name="com.brickbahrain.goldenmasterqa"
          package/name="Bahrain Brick Golden Master QA"
          package/signed=true
          package/app_category="game"
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          permissions/custom_permissions=PackedStringArray()
          permissions/access_network_state=false
          permissions/internet=false
          EOF
          keytool -genkeypair -noprompt \
            -keystore "$PREVIEW/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Bahrain Brick Golden Master QA,O=Zanabal Gaming,C=BH" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Generate approved V3.1 textures and complete 45-GLB matrix
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW="$PWD/build/preview-project"
          python3 tools/asset_lab/generate_golden_master_textures.py \
            --seed 140500 \
            --output-dir "$PREVIEW/assets/asset_lab/golden_textures" \
            --report build/reports/GOLDEN_MASTER_RUNTIME_TEXTURES.json
          BLENDER="$PWD/build/downloads/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python tools/asset_lab/generate_golden_masters_v3_1.py -- \
            --seed 1405 \
            --texture-dir "$PREVIEW/assets/asset_lab/golden_textures" \
            --output-dir "$PREVIEW/assets/asset_lab/golden_masters" \
            --report build/reports/GOLDEN_MASTER_RUNTIME_GENERATION.json
      - name: Validate generated manifest closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          preview = Path('build/preview-project')
          manifest = json.loads((preview/'asset_lab/runtime/golden_master_manifest.json').read_text())
          report = json.loads(Path('build/reports/GOLDEN_MASTER_RUNTIME_GENERATION.json').read_text())
          paths=[]
          for record in manifest['assets']:
              for profile in manifest['profiles']:
                  for path in record['paths'][profile]:
                      paths.append(path)
                      filesystem_path=preview/path.removeprefix('res://')
                      assert filesystem_path.is_file(), filesystem_path
                      assert filesystem_path.stat().st_size > 0, filesystem_path
          assert len(paths)==45 and len(set(paths))==45
          assert len(list((preview/'assets/asset_lab/golden_masters').rglob('*.glb')))==45
          assert report['generator_version']=='bahrain-brick-golden-master-v3.1-hero-colonnade'
          assert report['derivative_count']==45 and len(report['outputs'])==45
          inventory=[]
          for path in sorted(preview.glob('assets/asset_lab/golden_masters/**/*.glb')):
              inventory.append({'path':str(path.relative_to(preview)),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          Path('build/reports/GOLDEN_MASTER_RUNTIME_MANIFEST_CLOSURE.json').write_text(
              json.dumps({'passed':True,'asset_count':5,'runtime_path_count':45,'inventory':inventory},indent=2,sort_keys=True)+'\n'
          )
          PY
      - name: Import GLBs and run headless Godot runtime tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/build/tools/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          PREVIEW="$PWD/build/preview-project"
          "$GODOT" --headless --editor --path "$PREVIEW" --quit 2>&1 | tee build/reports/GODOT_IMPORT.log
          test "$(find "$PREVIEW/.godot/imported" -type f | wc -l)" -gt 45
          "$GODOT" --headless --path "$PREVIEW" --script res://tests/golden_master_runtime_test.gd \
            2>&1 | tee build/reports/GODOT_RUNTIME_TEST.log
          grep -q 'GOLDEN_MASTER_RUNTIME_TEST_PASS assets=5 resources=45 profile=balanced' build/reports/GODOT_RUNTIME_TEST.log
          if grep -E 'SCRIPT ERROR|Parse Error|GOLDEN_MASTER_RUNTIME_TEST_FAIL|GOLDEN_MASTER_PREVIEW_FAILED' build/reports/GODOT_IMPORT.log build/reports/GODOT_RUNTIME_TEST.log; then
            exit 1
          fi
      - name: Provision Android SDK API 34 and emulator image
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"
          printf 'sdk_root=%s\nsdkmanager=%s\navdmanager=%s\n' "$SDK_ROOT" "$SDKMANAGER" "$AVDMANAGER" \
            | tee build/reports/ANDROID_TOOLCHAIN.txt
      - name: Export and verify Android QA APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          GODOT="$PWD/build/tools/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          PREVIEW="$PWD/build/preview-project"
          APK="$PWD/build/bahrain_brick_golden_master_qa.apk"
          "$GODOT" --headless --path "$PREVIEW" --export-debug Android "$APK" \
            2>&1 | tee build/reports/GODOT_ANDROID_EXPORT.log
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee build/reports/APKSIGNER_VERIFY.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" \
            | tee build/reports/APK_BADGING.txt
          grep -q "package: name='$PACKAGE_NAME'" build/reports/APK_BADGING.txt
          sha256sum "$APK" | tee build/reports/APK_SHA256SUM.txt
      - name: Run Android API 34 landscape runtime validation
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          echo no | "$AVDMANAGER" create avd --force \
            --name golden_master_api34 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_7"
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" \
            -avd golden_master_api34 \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            -memory 4096 > build/reports/EMULATOR_STDOUT.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill $EMULATOR_PID || true' EXIT
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$ANDROID_HOME/platform-tools/adb" shell settings put system accelerometer_rotation 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put system user_rotation 1
          "$ANDROID_HOME/platform-tools/adb" install -r build/bahrain_brick_golden_master_qa.apk \
            | tee build/reports/ADB_INSTALL.txt
          "$ANDROID_HOME/platform-tools/adb" logcat -c
          "$ANDROID_HOME/platform-tools/adb" shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1 \
            | tee build/reports/ADB_LAUNCH.txt
          READY=0
          for attempt in $(seq 1 60); do
            "$ANDROID_HOME/platform-tools/adb" logcat -d > build/reports/ANDROID_LOGCAT.txt
            if grep -q 'GOLDEN_MASTER_PREVIEW_READY profile=balanced assets=5' build/reports/ANDROID_LOGCAT.txt; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" -eq 1
          "$ANDROID_HOME/platform-tools/adb" exec-out screencap -p > build/android-evidence/golden_master_preview_landscape.png
          "$ANDROID_HOME/platform-tools/adb" shell dumpsys window displays > build/reports/ANDROID_WINDOW_DISPLAYS.txt
          "$ANDROID_HOME/platform-tools/adb" shell dumpsys activity activities > build/reports/ANDROID_ACTIVITY.txt
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json

          screenshot=Path('build/android-evidence/golden_master_preview_landscape.png')
          assert screenshot.stat().st_size > 50000, screenshot.stat().st_size
          image=Image.open(screenshot).convert('RGB')
          width,height=image.size
          assert width > height, (width,height)
          extrema=ImageStat.Stat(image).extrema
          dynamic_channels=sum(1 for low,high in extrema if high-low > 40)
          assert dynamic_channels >= 2, extrema
          Path('build/reports/ANDROID_RUNTIME_VALIDATION.json').write_text(
              json.dumps({'passed':True,'package':'com.brickbahrain.goldenmasterqa','profile':'balanced','visible_assets':5,'landscape':True,'screenshot':str(screenshot),'dimensions':[width,height]},indent=2,sort_keys=True)+'\n'
          )
          PY
          if grep -E 'SCRIPT ERROR|Parse Error|GOLDEN_MASTER_PREVIEW_FAILED|FATAL EXCEPTION' build/reports/ANDROID_LOGCAT.txt; then
            exit 1
          fi
      - name: Verify protected authority after production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head=$(git rev-parse HEAD)"
            echo "world_blob=$(git rev-parse HEAD:scripts/world.gd)"
            echo "player_blob=$(git rev-parse HEAD:scripts/player_controller.gd)"
            echo "touch_blob=$(git rev-parse HEAD:scripts/touch_input.gd)"
          } | tee build/reports/PROTECTED_AUTHORITY_AFTER.txt
          test "$(git rev-parse HEAD:scripts/world.gd)" = "$PROTECTED_WORLD_BLOB"
          test "$(git rev-parse HEAD:scripts/player_controller.gd)" = "$PROTECTED_PLAYER_BLOB"
          test "$(git rev-parse HEAD:scripts/touch_input.gd)" = "$PROTECTED_TOUCH_BLOB"
          cmp build/reports/PROTECTED_AUTHORITY_BEFORE.txt build/reports/PROTECTED_AUTHORITY_AFTER.txt
          git diff --exit-code -- scripts/world.gd scripts/player_controller.gd scripts/touch_input.gd
      - name: Upload Godot, APK, and Android runtime evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-golden-master-godot-android-${{ github.run_id }}
          path: |
            build/bahrain_brick_golden_master_qa.apk
            build/android-evidence
            build/reports
            build/preview-project/asset_lab/runtime/golden_master_manifest.json
            build/preview-project/scripts/golden_master_quality.gd
            build/preview-project/scripts/golden_master_lod_instance.gd
            build/preview-project/scripts/golden_master_preview_district.gd
            build/preview-project/scenes/golden_master_preview_district.tscn
          if-no-files-found: warn
          retention-days: 30
