name: Publish V3.1 Review Evidence

on:
  push:
    branches: [work/bahrain-brick-golden-master-batch1-v1]
    paths:
      - .github/workflows/publish-v31-review-evidence.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_ARTIFACT_ID: "8353372533"
      TARGET_BRANCH: work/bahrain-brick-golden-master-batch1-v1
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Recover successful V3.1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > build/source.zip
          unzip -tq build/source.zip
          unzip -q build/source.zip -d build/source
          test -f build/source/golden-renders-v31/contact-sheets/bh_waterfront_tower_a_01.png
          test -f build/source/golden-renders-v31/contact-sheets/bh_cr_skyscraper_tower_01.png
      - name: Stage immutable review evidence
        shell: bash
        run: |
          set -euo pipefail
          target=asset_lab/reviews/golden-master-v31
          mkdir -p "$target"
          cp build/source/golden-renders-v31/contact-sheets/bh_waterfront_tower_a_01.png "$target/"
          cp build/source/golden-renders-v31/contact-sheets/bh_cr_skyscraper_tower_01.png "$target/"
          cp build/source/reports/GOLDEN_MASTER_V31_TECHNICAL_REVIEW.json "$target/"
          cp build/source/reports/GOLDEN_MASTER_CONTACT_SHEETS_V31.json "$target/"
          (
            cd "$target"
            sha256sum \
              bh_waterfront_tower_a_01.png \
              bh_cr_skyscraper_tower_01.png \
              GOLDEN_MASTER_V31_TECHNICAL_REVIEW.json \
              GOLDEN_MASTER_CONTACT_SHEETS_V31.json \
              > SHA256SUMS.txt
          )
          cat > "$target/README.md" <<'EOF'
          # Golden Master V3.1 Review Evidence

          - Source workflow run: `29440774938`
          - Source artifact: `8353372533`
          - Source artifact digest: `sha256:ff6d2ef349ebd96c61619fc0c569960eb64c61596cca9faa28095c15014386e5`
          - Review profile: `balanced`
          - Review LOD: `LOD0`
          - Status: awaiting human art review; not approved by publication alone.
          EOF
      - name: Commit evidence without merging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add asset_lab/reviews/golden-master-v31
          if git diff --cached --quiet; then
            echo 'Evidence already published.'
            exit 0
          fi
          git commit -m 'evidence: publish V3.1 tower contact sheets'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Post review links to PR 58
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(cat <<'EOF'
          ## V3.1 tower visual-review evidence

          Generated by successful run `29440774938`, artifact `8353372533`.

          - [Waterfront tower contact sheet](https://github.com/MuhamedZanabal/brick-bahrain-open-world/blob/work/bahrain-brick-golden-master-batch1-v1/asset_lab/reviews/golden-master-v31/bh_waterfront_tower_a_01.png?raw=1)
          - [Hero skyline tower contact sheet](https://github.com/MuhamedZanabal/brick-bahrain-open-world/blob/work/bahrain-brick-golden-master-batch1-v1/asset_lab/reviews/golden-master-v31/bh_cr_skyscraper_tower_01.png?raw=1)
          - [Evidence checksums](https://github.com/MuhamedZanabal/brick-bahrain-open-world/blob/work/bahrain-brick-golden-master-batch1-v1/asset_lab/reviews/golden-master-v31/SHA256SUMS.txt)

          Publication does not imply art approval. PR #58 remains draft and unmerged.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/58/comments" -f body="$body"
