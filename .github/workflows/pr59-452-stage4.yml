name: Bahrain Brick Godot 4.5.2 Stage 4 Full Model Corpus

on:
  push:
    branches: [ci/pr59-godot-engine-qualification-20260718]
    paths: [.github/forensics/pr59-452-stage4-trigger.txt]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN: '29627302405'
  SOURCE_ARTIFACT: pr59-godot-import-experiment-input-29627302405

jobs:
  seed_authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: qualification, fetch-depth: 1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: '${{ env.SOURCE_ARTIFACT }}', path: build/source, repository: MuhamedZanabal/brick-bahrain-open-world, run-id: '${{ env.SOURCE_RUN }}', github-token: '${{ github.token }}'}
      - name: Download verified official engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/engine
          curl -fL --retry 4 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o build/engine/godot.zip
          test "$(sha256sum build/engine/godot.zip | cut -d' ' -f1)" = 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
          unzip -q build/engine/godot.zip -d build/engine/bin
          ENGINE=$(find build/engine/bin -type f -name 'Godot*' -print -quit); chmod +x "$ENGINE"
          test "$($ENGINE --version | head -1)" = 4.5.2.stable.official.6ce3de25a
          echo "ENGINE=$ENGINE" >> "$GITHUB_ENV"
      - name: Generate exact 800-model sidecar authority
        shell: bash
        env: {TZ: UTC, LC_ALL: C.UTF-8, LANG: C.UTF-8}
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/.github/forensics/pr59_452_full_corpus.py
          SOURCE=$(find build/source -name MANAMA_SOUQ_COMPOSITE_SOURCE.zip -type f -print -quit)
          python3 qualification/.github/forensics/pr59_452_full_corpus.py seed --engine "$ENGINE" --source-zip "$SOURCE" --output build/seed --work-root /tmp/pr59-452-stage4-seed
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'pr59-452-stage4-sidecars-${{ github.run_id }}', path: build/seed, if-no-files-found: error, compression-level: 9, retention-days: 30}

  import_full:
    needs: seed_authority
    strategy:
      fail-fast: false
      matrix:
        label: [D1, D2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: qualification, fetch-depth: 1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: '${{ env.SOURCE_ARTIFACT }}', path: build/source, repository: MuhamedZanabal/brick-bahrain-open-world, run-id: '${{ env.SOURCE_RUN }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'pr59-452-stage4-sidecars-${{ github.run_id }}', path: build/seed}
      - name: Download verified official engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/engine
          curl -fL --retry 4 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o build/engine/godot.zip
          test "$(sha256sum build/engine/godot.zip | cut -d' ' -f1)" = 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
          unzip -q build/engine/godot.zip -d build/engine/bin
          ENGINE=$(find build/engine/bin -type f -name 'Godot*' -print -quit); chmod +x "$ENGINE"
          echo "ENGINE=$ENGINE" >> "$GITHUB_ENV"
      - name: Run independent full-corpus import
        shell: bash
        env: {TZ: UTC, LC_ALL: C.UTF-8, LANG: C.UTF-8}
        run: |
          set -euo pipefail
          SOURCE=$(find build/source -name MANAMA_SOUQ_COMPOSITE_SOURCE.zip -type f -print -quit)
          SIDECARS=$(find build/seed -name GODOT_4_5_2_FULL_MODEL_SIDECARS.zip -type f -print -quit)
          python3 qualification/.github/forensics/pr59_452_full_corpus.py run --engine "$ENGINE" --source-zip "$SOURCE" --sidecar-zip "$SIDECARS" --label '${{ matrix.label }}' --output build/result --work-root /tmp/pr59-452-stage4-'${{ matrix.label }}'
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'pr59-452-stage4-${{ matrix.label }}-${{ github.run_id }}', path: build/result, if-no-files-found: error, compression-level: 9, retention-days: 30}

  compare:
    needs: import_full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: qualification, fetch-depth: 1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'pr59-452-stage4-D1-${{ github.run_id }}', path: build/d1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'pr59-452-stage4-D2-${{ github.run_id }}', path: build/d2}
      - name: Compare all 800 model outputs
        shell: bash
        run: |
          set +e
          mkdir -p build/final
          D1=$(find build/d1 -name FULL_MODEL_CORPUS_D1.json -type f -print -quit)
          D2=$(find build/d2 -name FULL_MODEL_CORPUS_D2.json -type f -print -quit)
          python3 qualification/.github/forensics/pr59_452_full_corpus.py compare --d1 "$D1" --d2 "$D2" --output build/final
          code=$?
          echo "$code" > build/final/EXIT_CODE.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'pr59-godot-4.5.2-stage4-${{ github.run_id }}', path: build/final, if-no-files-found: error, compression-level: 9, retention-days: 30}
      - name: Enforce Stage 4
        shell: bash
        run: test "$(cat build/final/EXIT_CODE.txt)" = 0
