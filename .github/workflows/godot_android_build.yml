name: Brick Bahrain v1.4 Phone APK Build

on:
  workflow_dispatch:
  push:
    branches: [v14-runtime-verification]

permissions:
  contents: read

env:
  GODOT_VERSION: '4.3'
  GODOT_RELEASE: '4.3-stable'
  ANDROID_API: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  APK_PATH: 'build/brick_bahrain_v14-phone-test.apk'
  LOG_DIR: 'build/logs'

jobs:
  direct_phone_build:
    name: Direct import, runtime test and Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip python3 openjdk-17-jdk libasound2 libpulse0 libgl1 libglu1-mesa libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2 libwayland-client0
          mkdir -p "$LOG_DIR" build
          java -version 2>&1 | tee "$LOG_DIR/java-version.txt"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
          sdkmanager --list_installed | tee "$LOG_DIR/android-sdk-packages.txt"

      - name: Install Godot 4.3 and Android templates
        run: bash tools/ci_install_godot_linux.sh

      - name: Configure Android export environment
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS
          export PATH="$HOME/.local/bin:$PATH"
          godot --version | tee "$LOG_DIR/godot-version.txt"

      - name: Import exact v1.4 project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          timeout 900 godot --headless --path . --editor --quit --verbose 2>&1 | tee "$LOG_DIR/godot-import.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$LOG_DIR/godot-import-exit.txt"
          test "$status" -eq 0
          python3 tools/check_godot_log.py "$LOG_DIR/godot-import.log" --report "$LOG_DIR/godot-import-analysis.txt"

      - name: Execute v1.4 runtime smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          timeout 1200 godot --headless --path . --script res://tests/runtime_smoke_test_v14.gd 2>&1 | tee "$LOG_DIR/runtime-smoke.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$LOG_DIR/runtime-smoke-exit.txt"
          test "$status" -eq 0
          grep -q 'RUNTIME_SMOKE_TEST_PASS' "$LOG_DIR/runtime-smoke.log"
          python3 tools/check_godot_log.py "$LOG_DIR/runtime-smoke.log" --report "$LOG_DIR/runtime-smoke-analysis.txt"

      - name: Export Android debug APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          timeout 1800 godot --headless --path . --export-debug Android "$APK_PATH" 2>&1 | tee "$LOG_DIR/android-export.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$LOG_DIR/android-export-exit.txt"
          test "$status" -eq 0
          test -s "$APK_PATH"

      - name: Verify APK identity, integrity and signature
        run: |
          AAPT="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          unzip -t "$APK_PATH" | tee "$LOG_DIR/apk-unzip-test.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_PATH" | tee "$LOG_DIR/apk-zipalign.txt"
          "$AAPT" dump badging "$APK_PATH" | tee "$LOG_DIR/apk-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee "$LOG_DIR/apk-signature.txt"
          sha256sum "$APK_PATH" | tee "${APK_PATH}.sha256"
          grep -q "package: name='com.brickbahrain.openworld' versionCode='14' versionName='1.4.0'" "$LOG_DIR/apk-badging.txt"
          unzip -l "$APK_PATH" | tee "$LOG_DIR/apk-file-list.txt"
          grep -Eq 'assets/.*\.pck|assets/.*\.godot|assets/_cl_' "$LOG_DIR/apk-file-list.txt"

      - name: Upload phone-test APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-bahrain-v14-phone-test
          path: |
            build/brick_bahrain_v14-phone-test.apk
            build/brick_bahrain_v14-phone-test.apk.sha256
            build/logs/
            build/ci_logs/
          if-no-files-found: warn
          retention-days: 30
