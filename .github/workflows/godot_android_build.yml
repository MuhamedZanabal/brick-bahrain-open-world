name: Godot 4.3 Android Toolchain Package

on:
  workflow_dispatch:
  push:
    branches: [v14-runtime-verification]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: '4.3'
  GODOT_RELEASE: '4.3-stable'
  ANDROID_API: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_HOME: '/usr/local/lib/android/sdk'
  ANDROID_SDK_ROOT: '/usr/local/lib/android/sdk'
  JAVA_HOME: '/usr/lib/jvm/java-17-openjdk-amd64'

jobs:
  package_toolchain:
    name: Package exact local-build toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies and JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip openjdk-17-jdk
          mkdir -p build
          java -version

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install Godot 4.3 and matching export templates
        run: bash tools/ci_install_godot_linux.sh

      - name: Package and split portable toolchain
        run: |
          GODOT_BIN="$(find "$HOME/.local/share/godot-ci/bin" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -x "$GODOT_BIN"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -x "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          test -x "$JAVA_HOME/bin/java"
          sudo tar --numeric-owner -C / -czf "$GITHUB_WORKSPACE/build/godot43-android34-jdk17-toolchain.tar.gz" \
            "${GODOT_BIN#/}" \
            "home/runner/.local/share/godot/export_templates/4.3.stable" \
            "usr/local/lib/android/sdk/build-tools/$ANDROID_BUILD_TOOLS" \
            "usr/local/lib/android/sdk/platforms/android-$ANDROID_API" \
            "usr/local/lib/android/sdk/platform-tools" \
            "usr/lib/jvm/java-17-openjdk-amd64"
          sha256sum build/godot43-android34-jdk17-toolchain.tar.gz > build/godot43-android34-jdk17-toolchain.tar.gz.sha256
          split -b 320M -d -a 2 build/godot43-android34-jdk17-toolchain.tar.gz build/toolchain.part-
          ls -lh build/godot43-android34-jdk17-toolchain.tar.gz build/toolchain.part-*
          test -s build/toolchain.part-00
          test -s build/toolchain.part-01
          test -s build/toolchain.part-02
          test -s build/toolchain.part-03
          test -s build/toolchain.part-04

      - name: Upload toolchain part 00
        uses: actions/upload-artifact@v4
        with:
          name: godot43-toolchain-part-00
          path: build/toolchain.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 01
        uses: actions/upload-artifact@v4
        with:
          name: godot43-toolchain-part-01
          path: build/toolchain.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 02
        uses: actions/upload-artifact@v4
        with:
          name: godot43-toolchain-part-02
          path: build/toolchain.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 03
        uses: actions/upload-artifact@v4
        with:
          name: godot43-toolchain-part-03
          path: build/toolchain.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 04 and checksum
        uses: actions/upload-artifact@v4
        with:
          name: godot43-toolchain-part-04
          path: |
            build/toolchain.part-04
            build/godot43-android34-jdk17-toolchain.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
