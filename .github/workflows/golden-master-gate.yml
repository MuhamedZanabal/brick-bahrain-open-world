name: Bahrain Brick Golden Master Gate

on:
  push:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    paths: &golden_paths
      - .github/workflows/golden-master-gate.yml
      - docs/assets/GOLDEN_MASTER_CONTRACT.json
      - tools/asset_lab/golden_master_contract.py
      - tools/asset_lab/golden_master_materials.py
      - tools/asset_lab/generate_golden_master_textures.py
      - tools/asset_lab/generate_golden_masters.py
      - tools/asset_lab/generate_golden_masters_v2.py
      - tools/asset_lab/render_golden_master_contact_sheets.py
      - tools/asset_lab/evaluate_golden_master_gate.py
      - tests/test_golden_master_contract.py
      - tests/test_golden_master_materials.py
      - tests/test_golden_master_texture_plan.py
      - tests/test_golden_master_generation_plan.py
      - tests/test_golden_master_render_plan.py
      - tests/test_golden_master_gate.py
  pull_request:
    branches:
      - work/bahrain-brick-premium-visual-v14
      - work/bahrain-brick-asset-lab-integration-v1
    types: [opened, synchronize, reopened]
    paths: *golden_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run golden-master authority tests
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_golden_master*.py' -v
          python3 -m py_compile \
            tools/asset_lab/golden_master_contract.py \
            tools/asset_lab/golden_master_materials.py \
            tools/asset_lab/generate_golden_master_textures.py \
            tools/asset_lab/generate_golden_masters.py \
            tools/asset_lab/generate_golden_masters_v2.py \
            tools/asset_lab/render_golden_master_contact_sheets.py \
            tools/asset_lab/evaluate_golden_master_gate.py

  generate:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BLENDER_VERSION: 4.3.2
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install deterministic texture dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0
      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/downloads build/golden-masters build/golden-textures build/golden-renders build/reports
          cd build/downloads
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.3"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/$archive" -o "$archive"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' "$base/blender-${BLENDER_VERSION}.sha256" -o blender.sha256
          grep " $archive$" blender.sha256 | sha256sum -c -
          tar -xf "$archive"
          "${PWD}/blender-${BLENDER_VERSION}-linux-x64/blender" --version | tee ../reports/BLENDER_VERSION.txt
          grep -q '^Blender 4.3.2' ../reports/BLENDER_VERSION.txt
      - name: Generate 24 shared deterministic textures
        shell: bash
        run: |
          python3 tools/asset_lab/generate_golden_master_textures.py \
            --seed 140500 \
            --output-dir build/golden-textures \
            --report build/reports/GOLDEN_MASTER_TEXTURES.json
      - name: Generate all 45 textured golden-master derivatives
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$PWD/build/downloads/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER" --background --factory-startup \
            --python tools/asset_lab/generate_golden_masters_v2.py -- \
            --seed 1405 \
            --texture-dir build/golden-textures \
            --output-dir build/golden-masters \
            --report build/reports/GOLDEN_MASTER_GENERATION.json
      - name: Validate generated matrix, textures and mobile cost ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          report=json.loads(Path('build/reports/GOLDEN_MASTER_GENERATION.json').read_text())
          texture_report=json.loads(Path('build/reports/GOLDEN_MASTER_TEXTURES.json').read_text())
          outputs=report['outputs']
          assert report['generator_version']=='bahrain-brick-golden-master-v2', report
          assert texture_report['texture_count']==24, texture_report
          assert len(list(Path('build/golden-textures').rglob('*_albedo.png')))==24
          assert report['source_asset_count']==5, report
          assert report['derivative_count']==45, report
          assert len(outputs)==45, len(outputs)
          paths=[item['path'] for item in outputs]
          assert len(paths)==len(set(paths)), 'duplicate output paths'
          assert len(list(Path('build/golden-masters').rglob('*.glb')))==45
          for item in outputs:
              path=Path(item['path'])
              assert path.is_file() and path.stat().st_size==item['bytes'], item
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256'], item
              assert item['triangle_count']>0, item
              assert item['collision_object_count']>=1, item
              assert 1 <= item['material_count'] <= 8, item
          by_asset_profile={}
          by_asset_lod={}
          for item in outputs:
              by_asset_profile.setdefault((item['asset_id'],item['profile']),[]).append(item)
              by_asset_lod.setdefault((item['asset_id'],item['lod']),[]).append(item)
          for key,items in by_asset_profile.items():
              items=sorted(items,key=lambda x:x['lod'])
              triangles=[x['triangle_count'] for x in items]
              assert triangles[0] >= triangles[1] >= triangles[2], (key,triangles)
              assert len({x['sha256'] for x in items})==3, (key,'identical LOD hashes')
          profile_rank={'low':0,'balanced':1,'high':2}
          for key,items in by_asset_lod.items():
              items=sorted(items,key=lambda x:profile_rank[x['profile']])
              triangles=[x['triangle_count'] for x in items]
              assert triangles[0] <= triangles[1] <= triangles[2], (key,triangles)
          detail_floors={
              'bh_traditional_projecting_window_01':1200,
              'bh_souq_shop_gold_01':1200,
              'bh_waterfront_tower_a_01':1500,
              'bh_supermarket_storefront_a_01':1200,
              'bh_cr_skyscraper_tower_01':2500,
          }
          for asset_id,floor in detail_floors.items():
              item=next(x for x in outputs if x['asset_id']==asset_id and x['profile']=='balanced' and x['lod']==0)
              assert item['triangle_count']>=floor, (asset_id,item['triangle_count'],floor)
          Path('build/reports/GOLDEN_MASTER_TECHNICAL_VALIDATION.json').write_text(
              json.dumps({'passed':True,'validated_assets':45,'texture_count':24,'failures':[]},indent=2)+'\n'
          )
          PY
          find build/golden-masters -type f -name '*.glb' -print0 | sort -z | xargs -0 sha256sum > build/reports/GOLDEN_MASTER_SHA256SUMS.txt
          find build/golden-textures -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum > build/reports/GOLDEN_MASTER_TEXTURE_SHA256SUMS.txt
      - name: Render 15 textured evidence views
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$PWD/build/downloads/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER" --background --factory-startup \
            --python tools/asset_lab/render_golden_master_contact_sheets.py -- \
            render \
            --input-root build/golden-masters \
            --output-root build/golden-renders \
            --report build/reports/GOLDEN_MASTER_RENDER_VIEWS.json
      - name: Compose and validate five contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/asset_lab/render_golden_master_contact_sheets.py \
            compose \
            --view-report build/reports/GOLDEN_MASTER_RENDER_VIEWS.json \
            --output-root build/golden-renders \
            --report build/reports/GOLDEN_MASTER_CONTACT_SHEETS.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          views=json.loads(Path('build/reports/GOLDEN_MASTER_RENDER_VIEWS.json').read_text())
          sheets=json.loads(Path('build/reports/GOLDEN_MASTER_CONTACT_SHEETS.json').read_text())
          assert views['view_count']==15 and len(views['renders'])==15, views
          assert sheets['contact_sheet_count']==5 and len(sheets['contact_sheets'])==5, sheets
          assert len(list(Path('build/golden-renders/views').glob('*.png')))==15
          assert len(list(Path('build/golden-renders/contact-sheets').glob('*.png')))==5
          assert all(Path(record['path']).stat().st_size > 10000 for record in sheets['contact_sheets'])
          PY
      - name: Record intentionally closed pre-runtime gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tools.asset_lab.evaluate_golden_master_gate import evaluate_evidence
          technical=json.loads(Path('build/reports/GOLDEN_MASTER_TECHNICAL_VALIDATION.json').read_text())
          sheets=json.loads(Path('build/reports/GOLDEN_MASTER_CONTACT_SHEETS.json').read_text())['contact_sheets']
          evidence={
              'technical_validation':technical,
              'contact_sheets':sheets,
              'protected_authority':{'passed':False},
              'godot_import':{'passed':False,'imported_assets':[]},
              'android_runtime':{'passed':False,'landscape':False,'visible_assets':[]},
              'android_screenshots':[],
              'art_approvals':[],
          }
          report=evaluate_evidence(evidence)
          assert report['mass_regeneration_allowed'] is False
          Path('build/reports/GOLDEN_MASTER_GATE_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload golden-master technical and visual evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-golden-masters-${{ github.run_id }}
          path: |
            build/golden-masters
            build/golden-textures
            build/golden-renders
            build/reports
          if-no-files-found: error
          retention-days: 30
