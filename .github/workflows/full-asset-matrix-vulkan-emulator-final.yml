name: Bahrain Brick Vulkan Matrix Emulator Final

on:
  push:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    paths:
      - .github/workflows/full-asset-matrix-vulkan-emulator-final.yml
      - tools/asset_lab/run_full_matrix_emulator_validation.sh
  pull_request:
    branches: [work/bahrain-brick-premium-visual-v14]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/full-asset-matrix-vulkan-emulator-final.yml
      - tools/asset_lab/run_full_matrix_emulator_validation.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-vulkan-matrix-emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARTIFACT_ID: '8361923664'
  EXPECTED_APK_SHA256: c703597d478f61b65256fdc6e4b4f2536680d0a663e7853da2b3cca9fde07b39
  PACKAGE_NAME: com.bahrainbrick.game.qa
  ANDROID_USER_HOME: ${{ github.workspace }}/build/vulkan-matrix-runtime/android-user
  ANDROID_AVD_HOME: ${{ github.workspace }}/build/vulkan-matrix-runtime/android-user/avd

jobs:
  emulator_endurance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'work/bahrain-brick-asset-lab-integration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out exact runtime harness head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recover exact signed Vulkan APK and prerequisite evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/vulkan-matrix-runtime
          mkdir -p "$ROOT/source" "$ROOT/reports" "$ROOT/logs" "$ROOT/artifacts"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$ROOT/source.zip"
          unzip -tq "$ROOT/source.zip"
          unzip -q "$ROOT/source.zip" -d "$ROOT/source"
          cp "$ROOT/source/artifacts/bahrain-brick-full-matrix-vulkan-debug.apk" "$ROOT/bahrain-brick-full-matrix-vulkan-debug.apk"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$ROOT/bahrain-brick-full-matrix-vulkan-debug.apk" | sha256sum -c -
          grep -q "package: name='$PACKAGE_NAME' versionCode='1406' versionName='1.4.0.6-full-matrix-vulkan-qa'" "$ROOT/source/reports/APK_BADGING.txt"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          base=Path('build/vulkan-matrix-runtime')
          apk=base/'bahrain-brick-full-matrix-vulkan-debug.apk'
          with ZipFile(apk) as archive:
              names=set(archive.namelist())
          assert 'lib/x86_64/libgodot_android.so' in names
          root=base/'source/reports'
          pre=(root/'FROZEN_CONTROLS_VULKAN_PRE.json').read_bytes()
          post=(root/'FROZEN_CONTROLS_VULKAN_POST.json').read_bytes()
          assert pre == post
          scan=json.loads((root/'CRITICAL_RUNTIME_ERROR_SCAN.json').read_text())
          assert scan['conclusion'] == 'pass' and scan['unresolved_count'] == 0, scan
          PY
          cp "$ROOT/source/reports/APK_BADGING.txt" "$ROOT/reports/SOURCE_APK_BADGING.txt"
          cp "$ROOT/source/reports/APK_SHA256SUM.txt" "$ROOT/reports/SOURCE_APK_SHA256SUM.txt"
          cp "$ROOT/source/reports/FROZEN_CONTROLS_VULKAN_POST.json" "$ROOT/reports/SOURCE_FROZEN_CONTROLS.json"
          cp "$ROOT/source/reports/CRITICAL_RUNTIME_ERROR_SCAN.json" "$ROOT/reports/SOURCE_CRITICAL_RUNTIME_ERROR_SCAN.json"

      - name: Provision Java 17
        uses: actions/setup-java@81c13a41f910e657690fdbe251b91fddc27e217c
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision pinned Android API 34 environment
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            emulator
            system-images;android-34;google_apis;x86_64

      - name: Provision screenshot validator
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0

      - name: Run exact Vulkan API 34 traversal and soak gate
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/vulkan-matrix-runtime
          EXPECTED_APK_SHA256="$EXPECTED_APK_SHA256" \
          bash tools/asset_lab/run_full_matrix_emulator_validation.sh \
            "$ROOT/bahrain-brick-full-matrix-vulkan-debug.apk" \
            "$PACKAGE_NAME" \
            "$ROOT/reports" \
            "$ROOT/logs" \
            "$ROOT/artifacts"

      - name: Build runtime evidence inventory
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('build/vulkan-matrix-runtime'); files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='source.zip' and 'source' not in x.parts):
              files.append({'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'RUNTIME_EVIDENCE_INVENTORY.json').write_text(json.dumps({'file_count':len(files),'files':files},indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload complete Vulkan emulator evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-vulkan-matrix-emulator-${{ github.run_id }}
          path: |
            build/vulkan-matrix-runtime/bahrain-brick-full-matrix-vulkan-debug.apk
            build/vulkan-matrix-runtime/reports
            build/vulkan-matrix-runtime/logs
            build/vulkan-matrix-runtime/artifacts
            build/vulkan-matrix-runtime/RUNTIME_EVIDENCE_INVENTORY.json
          if-no-files-found: error
          retention-days: 30

      - name: Require final Vulkan emulator success after evidence upload
        if: always()
        shell: bash
        run: test '${{ steps.runtime.outcome }}' = 'success'
