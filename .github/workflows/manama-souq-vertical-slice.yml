name: Bahrain Brick Manama Souq Vertical Slice

on:
  push:
    branches: [work/bahrain-brick-manama-souq-vertical-slice-v1]
    paths:
      - .github/workflows/manama-souq-vertical-slice.yml
      - tools/vertical_slice/reconstruct_manama_souq_composite.sh
  pull_request:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bahrain-brick-manama-souq-authority-discovery-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  discover_exact_authority_identities:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'work/bahrain-brick-manama-souq-vertical-slice-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR 59 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Measure historical input and source-affecting identities
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/manama-souq-authority-discovery
          mkdir -p "$ROOT"
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' \
            https://github.com/MuhamedZanabal/brick-bahrain-open-world/releases/download/v1.4.0.3-graphics-qa/bahrain_brick_v14.0.3-graphics-source.zip \
            -o "$ROOT/historical-source.zip"
          echo '5c4d8ac4497eda7752058424062a74a97c1f6f5e0c9a1ff393abac2a2c7c828a  build/manama-souq-authority-discovery/historical-source.zip' | sha256sum -c -
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' \
            https://github.com/godotengine/godot/releases/download/4.3-stable/SHA512-SUMS.txt \
            -o "$ROOT/GODOT_SHA512_SUMS.txt"
          python3 - "$ROOT/GATE1_DISCOVERY.json" <<'PY'
          from pathlib import Path
          import hashlib,json,os,platform,sys
          out=Path(sys.argv[1]); historical=out.parent/'historical-source.zip'
          editor='Godot_v4.3-stable_linux.x86_64.zip'
          lines=(out.parent/'GODOT_SHA512_SUMS.txt').read_text().splitlines()
          godot_sha512=next(line.split()[0] for line in lines if line.split()[1]==editor)
          paths=[
              'tools/vertical_slice/composite_source_authority.py',
              'tools/vertical_slice/reconstruct_manama_souq_composite.sh',
              'tools/apply_premium_overlay_resilient.py',
              'tools/apply_bahrain_brick_premium_world_overlay.py',
              'tools/v3_patch_restore.py',
              'tools/apply_premium_validation_corrections.py',
              'tools/apply_post_lifecycle_teardown_guards.py',
              'tools/apply_visual_evidence_shutdown_fix.py',
              'tools/verify_frozen_controls.py',
          ]
          paths += [p.as_posix() for p in sorted(Path('tools/premium_validation_v18_parts').glob('part_*.pyfrag'))]
          paths += [p.as_posix() for p in sorted(Path('tools/premium_payload_v2').glob('*')) if p.is_file()]
          paths += [p.as_posix() for p in sorted(Path('tools/premium_visual_upgrade_v3').glob('*')) if p.is_file()]
          records=[]
          for raw in paths:
              p=Path(raw)
              if not p.is_file(): raise SystemExit(f'missing authority input: {raw}')
              records.append({'path':raw,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          value={
              'schema_version':1,
              'runner_image':'ubuntu-24.04@'+os.environ['ImageVersion'],
              'os_release':'Ubuntu 24.04.4 LTS',
              'python':platform.python_version(),
              'pillow':'12.3.0',
              'librsvg2_bin':'2.58.0+dfsg-1build1',
              'godot_version':'4.3.stable.official.77dcf97d8',
              'godot_archive_sha512':godot_sha512,
              'historical_source_bytes':historical.stat().st_size,
              'historical_source_sha256':hashlib.sha256(historical.read_bytes()).hexdigest(),
              'reconstruction_inputs':records,
          }
          out.write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          print(json.dumps(value,indent=2,sort_keys=True))
          PY
          rm -f "$ROOT/historical-source.zip"

      - name: Upload measured authority identities
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-pr59-authority-discovery-${{ github.run_id }}
          path: build/manama-souq-authority-discovery
          if-no-files-found: error
          retention-days: 30
