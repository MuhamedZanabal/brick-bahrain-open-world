name: Bahrain Brick Manama Souq Vertical Slice

on:
  push:
    branches: [work/bahrain-brick-manama-souq-vertical-slice-v1]
    paths:
      - .github/workflows/manama-souq-vertical-slice.yml
      - tools/vertical_slice/promote_manama_souq_asset_authority.sh
  pull_request:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bahrain-brick-manama-souq-authority-promotion-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  promote_exact_asset_authority:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'work/bahrain-brick-manama-souq-vertical-slice-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact PR 59 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Promote accepted exact bytes to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/manama-souq-authority-promotion
          bash tools/vertical_slice/promote_manama_souq_asset_authority.sh \
            8360668742 \
            v1.4.0.3-graphics-qa \
            76964c58c283cacaee137152189727d678aa83230d7211dc6a15aa9af9d4a67a \
            469706251 \
            bahrain-brick-full-asset-matrix-authority-76964c58c283caca.zip \
            build/manama-souq-authority-promotion/ASSET_AUTHORITY_PROMOTION.json

      - name: Discover immutable tool identities and script checksums
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/manama-souq-authority-promotion
          editor=Godot_v4.3-stable_linux.x86_64.zip
          curl --fail --location --retry 8 --retry-all-errors --proto '=https' \
            https://github.com/godotengine/godot/releases/download/4.3-stable/SHA512-SUMS.txt \
            -o "$ROOT/GODOT_SHA512_SUMS.txt"
          GODOT_SHA512="$(awk -v editor="$editor" '$2==editor {print $1}' "$ROOT/GODOT_SHA512_SUMS.txt")"
          test "${#GODOT_SHA512}" -eq 128
          python3 - "$ROOT/GATE1_DISCOVERY.json" "$GODOT_SHA512" <<'PY'
          from pathlib import Path
          import hashlib,json,os,platform,sys
          out=Path(sys.argv[1]); godot_sha512=sys.argv[2]
          paths=[
              'tools/vertical_slice/composite_source_authority.py',
              'tools/vertical_slice/promote_manama_souq_asset_authority.sh',
              'tools/apply_premium_overlay_resilient.py',
              'tools/apply_bahrain_brick_premium_world_overlay.py',
              'tools/v3_patch_restore.py',
              'tools/apply_premium_validation_corrections.py',
              'tools/apply_post_lifecycle_teardown_guards.py',
              'tools/apply_visual_evidence_shutdown_fix.py',
              'tools/verify_frozen_controls.py',
          ]
          paths += [p.as_posix() for p in sorted(Path('tools/premium_validation_v18_parts').glob('part_*.pyfrag'))]
          paths += [p.as_posix() for p in sorted(Path('tools/premium_payload_v2').glob('*')) if p.is_file()]
          paths += [p.as_posix() for p in sorted(Path('tools/premium_visual_upgrade_v3').glob('*')) if p.is_file()]
          files=[]
          for raw in paths:
              p=Path(raw)
              if not p.is_file(): raise SystemExit(f'missing authority input: {raw}')
              files.append({'path':raw,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          os_release={}
          for line in Path('/etc/os-release').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); os_release[k]=v.strip('"')
          value={
              'schema_version':1,
              'runner_image':f"{os.environ.get('ImageOS')}@{os.environ.get('ImageVersion')}",
              'os_release':os_release.get('PRETTY_NAME'),
              'python':platform.python_version(),
              'godot_version':'4.3.stable.official.77dcf97d8',
              'godot_archive_sha512':godot_sha512,
              'reconstruction_inputs':files,
          }
          out.write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          print(json.dumps(value,indent=2,sort_keys=True))
          PY

      - name: Upload promotion and discovery evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-pr59-authority-promotion-${{ github.run_id }}
          path: build/manama-souq-authority-promotion
          if-no-files-found: error
          retention-days: 30
