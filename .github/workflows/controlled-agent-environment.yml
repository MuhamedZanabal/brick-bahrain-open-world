name: Bahrain Brick Controlled Agent Environment

on:
  push:
    branches:
      - work/bahrain-brick-controlled-agent-os-v1
    paths:
      - CLAUDE.md
      - .claude/**
      - .mcp.json
      - tools/agent_env/**
      - tests/test_controlled_agent_environment.py
      - .github/workflows/controlled-agent-environment.yml
  pull_request:
    branches:
      - work/bahrain-brick-renderer-runtime-debugging-r1
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-controlled-agent-environment-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3.stable.official.77dcf97d8
  GODOT_ARCHIVE: Godot_v4.3-stable_linux.x86_64.zip
  GODOT_EDITOR_SHA512: fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a
  GODOT_ROOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.3-stable

jobs:
  control-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Compile controlled environment Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .claude/hooks/bahrain_brick_hook.py \
            tools/agent_env/bahrain_brick_mcp.py \
            tools/agent_env/blender_asset_validator.py \
            tools/agent_env/verify_environment.py \
            tests/test_controlled_agent_environment.py

      - name: Validate configuration and static contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/controlled-agent/contracts
          python3 tools/agent_env/verify_environment.py config | tee build/controlled-agent/contracts/config.json
          python3 tests/test_controlled_agent_environment.py 2>&1 | tee build/controlled-agent/contracts/tests.log

      - name: Invoke non-destructive MCP tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent_env/verify_environment.py mcp-smoke | tee build/controlled-agent/contracts/mcp-smoke.json

      - name: Upload controlled environment contract evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-controlled-agent-contracts-${{ github.run_id }}
          path: build/controlled-agent
          if-no-files-found: error
          retention-days: 30

  baseline-tests:
    needs: control-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Run representative repository baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/controlled-agent/baseline
          python3 tools/agent_env/verify_environment.py baseline | tee build/controlled-agent/baseline/results.json

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-controlled-agent-baseline-${{ github.run_id }}
          path: build/controlled-agent/baseline
          if-no-files-found: error
          retention-days: 30

  godot-headless:
    needs: control-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install Godot 4.3 authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/controlled-agent/godot/editor build/controlled-agent/godot/evidence
          curl --fail --location --retry 5 --retry-all-errors \
            "$GODOT_ROOT_URL/$GODOT_ARCHIVE" \
            -o "build/controlled-agent/godot/$GODOT_ARCHIVE"
          printf '%s  %s\n' "$GODOT_EDITOR_SHA512" "build/controlled-agent/godot/$GODOT_ARCHIVE" | sha512sum -c -
          unzip -q "build/controlled-agent/godot/$GODOT_ARCHIVE" -d build/controlled-agent/godot/editor
          GODOT_BIN="$(find build/controlled-agent/godot/editor -maxdepth 1 -type f -name 'Godot*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          test "$($GODOT_BIN --version)" = "$GODOT_VERSION"
          printf '%s\n' "$GODOT_BIN" > build/controlled-agent/godot/GODOT_BIN.txt

      - name: Run Godot headless validation
        shell: bash
        run: |
          set -euo pipefail
          export BAHRAIN_BRICK_GODOT="$PWD/$(cat build/controlled-agent/godot/GODOT_BIN.txt)"
          python3 tools/agent_env/verify_environment.py godot | tee build/controlled-agent/godot/evidence/headless-validation.json

      - name: Upload Godot validation evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-controlled-agent-godot-${{ github.run_id }}
          path: build/controlled-agent/godot/evidence
          if-no-files-found: error
          retention-days: 30

  android-debug-apk:
    needs: [control-contracts, baseline-tests, godot-headless]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17.0.12'
          check-latest: false

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: '14742923'
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Install export host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb unzip

      - name: Validate Android export contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_playable_apk_export.py -v
          python3 -m py_compile tools/graphics/patch_r1_playable_export.py
          bash -n tools/graphics/export_r1_playable_mobile_apk.sh

      - name: Build source-derived debug APK
        id: export
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/controlled-agent/android
          bash tools/graphics/export_r1_playable_mobile_apk.sh \
            "$PWD" "$PWD/build/controlled-agent/android" \
            2>&1 | tee build/controlled-agent/android/export.log

      - name: Collect APK evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/controlled-agent/android/evidence
          APK=build/controlled-agent/android/bahrain-brick-playable-mobile-arm64.apk
          if [[ -s "$APK" ]]; then
            python3 tools/agent_env/bahrain_brick_mcp.py --help >/dev/null
            python3 - "$APK" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          server = subprocess.Popen(
              [sys.executable, 'tools/agent_env/bahrain_brick_mcp.py', '--root', str(root)],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
          )
          def call(message):
              server.stdin.write(json.dumps(message, separators=(',', ':')) + '\n')
              server.stdin.flush()
              return json.loads(server.stdout.readline())
          call({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'ci','version':'1'}}})
          server.stdin.write(json.dumps({'jsonrpc':'2.0','method':'notifications/initialized'}) + '\n'); server.stdin.flush()
          response = call({'jsonrpc':'2.0','id':2,'method':'tools/call','params':{'name':'collect_build_evidence','arguments':{'artifact_path':sys.argv[1],'output_path':'build/controlled-agent/android/evidence/APK_EVIDENCE.json'}}})
          Path('build/controlled-agent/android/evidence/MCP_RESPONSE.json').write_text(json.dumps(response, indent=2, sort_keys=True) + '\n')
          server.stdin.close(); server.wait(timeout=5)
          if response.get('result', {}).get('isError'):
              raise SystemExit(1)
          PY
          else
            printf '%s\n' '{"status":"failed","reason":"APK was not produced"}' > build/controlled-agent/android/evidence/APK_EVIDENCE.json
          fi
          printf '%s\n' '${{ steps.export.outcome }}' > build/controlled-agent/android/evidence/EXPORT_STEP_OUTCOME.txt

      - name: Upload Android build and evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-controlled-agent-android-${{ github.run_id }}
          path: build/controlled-agent/android
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Enforce Android export result
        if: always()
        shell: bash
        run: test '${{ steps.export.outcome }}' = success
