name: Bahrain Brick Engine Qualification Probe

on:
  push:
    branches: [ci/pr59-godot-engine-qualification-20260718]
    paths: [.github/workflows/pr59-engine-qualification-probe.yml]

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-godot-engine-qualification-20260718
          fetch-depth: 0
      - name: Query workflow validation and run state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github/forensics/run-locators
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'pr59-engine-qualification-probe'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:return {'status':r.status,'body':json.load(r)}
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: body=json.loads(body)
                  except Exception: pass
                  return {'status':e.code,'body':body}
          workflow=get(f'https://api.github.com/repos/{repo}/actions/workflows/pr59-engine-qualification.yml')
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/pr59-engine-qualification.yml/runs?branch=ci/pr59-godot-engine-qualification-20260718&per_page=20')
          allruns=get(f'https://api.github.com/repos/{repo}/actions/runs?branch=ci/pr59-godot-engine-qualification-20260718&per_page=50')
          out={'probe_run_id':int(os.environ['GITHUB_RUN_ID']),'probe_sha':os.environ['GITHUB_SHA'],'workflow_query':workflow,'workflow_runs_query':runs,'branch_runs_query':allruns}
          open('.github/forensics/run-locators/pr59-engine-qualification-probe.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/run-locators/pr59-engine-qualification-probe.json
          git commit -m 'ci: record engine qualification probe [skip ci]'
          for i in 1 2 3 4 5; do
            git pull --rebase origin ci/pr59-godot-engine-qualification-20260718 && git push origin HEAD:ci/pr59-godot-engine-qualification-20260718 && exit 0
            sleep $((i*2))
          done
          exit 1
