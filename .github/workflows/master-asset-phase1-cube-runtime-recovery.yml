name: Bahrain Brick Master Asset Phase 1 Cube Runtime Recovery

on:
  push:
    branches:
      - work/bahrain-brick-master-asset-integration-v1
    paths:
      - .github/workflows/master-asset-phase1-cube-runtime-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-master-asset-phase1-cube-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARTIFACT_ID: "9031108247"
  SOURCE_RUN_ID: "31290094969"
  EXPECTED_APK_SHA256: "a293e5973b0635197c3f54380caf83f203869a0824f7039f5de7984bdc7a6ede"
  PACKAGE_NAME: "com.bahrainbrick.cubesmoke"
  VERSION_CODE: "1"
  VERSION_NAME: "0.1.0-phase1-cube"
  APK_NAME: "bahrain-brick-phase1-cube-smoke.apk"
  SYSTEM_IMAGE: "system-images;android-34;default;x86_64"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  android_runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out runtime evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Recover exact Phase 1 APK and prerequisite evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-runtime"
          mkdir -p "$ROOT/source" "$ROOT/reports" "$ROOT/logs" "$ROOT/artifacts"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$ROOT/source.zip"
          unzip -tq "$ROOT/source.zip"
          unzip -q "$ROOT/source.zip" -d "$ROOT/source"
          cp "$ROOT/source/artifacts/$APK_NAME" "$ROOT/artifacts/$APK_NAME"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$ROOT/artifacts/$APK_NAME" | sha256sum -c -
          test -f "$ROOT/source/reports/CUBE_GENERATION_A.json"
          test -f "$ROOT/source/reports/CUBE_GENERATION_B.json"
          test -f "$ROOT/source/reports/CUBE_INDEPENDENT_VALIDATION.json"
          test -f "$ROOT/source/reports/APK_BADGING.txt"
          test -f "$ROOT/source/reports/APK_SIGNING.txt"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path(sys.argv[1])
          source = root / "source"
          a = json.loads((source / "reports/CUBE_GENERATION_A.json").read_text())
          b = json.loads((source / "reports/CUBE_GENERATION_B.json").read_text())
          independent = json.loads((source / "reports/CUBE_INDEPENDENT_VALIDATION.json").read_text())
          assert a["dimensions_m"] == [1.0, 1.0, 1.0], a
          assert b["dimensions_m"] == [1.0, 1.0, 1.0], b
          assert independent["bounds"]["dimensions"] == [1.0, 1.0, 1.0], independent
          assert independent["passed"] is True, independent
          glb_a = source / "cube-a/bb_validation_cube_1m.glb"
          glb_b = source / "cube-b/bb_validation_cube_1m.glb"
          assert glb_a.read_bytes() == glb_b.read_bytes()
          badging = (source / "reports/APK_BADGING.txt").read_text()
          required = "package: name='com.bahrainbrick.cubesmoke' versionCode='1' versionName='0.1.0-phase1-cube'"
          assert required in badging, badging
          signing = (source / "reports/APK_SIGNING.txt").read_text()
          assert "Verified using v2 scheme (APK Signature Scheme v2): true" in signing, signing
          apk = root / "artifacts/bahrain-brick-phase1-cube-smoke.apk"
          report = {
              "source_run_id": 31290094969,
              "source_artifact_id": 9031108247,
              "apk_sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "cube_glb_sha256": hashlib.sha256(glb_a.read_bytes()).hexdigest(),
              "cube_dimensions_m": [1.0, 1.0, 1.0],
              "prerequisite_evidence": "PASS",
          }
          assert report["apk_sha256"] == "a293e5973b0635197c3f54380caf83f203869a0824f7039f5de7984bdc7a6ede"
          (root / "reports/SOURCE_AUTHORITY.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Provision Java 17
        uses: actions/setup-java@81c13a41f910e657690fdbe251b91fddc27e217c
        with:
          distribution: temurin
          java-version: "17"

      - name: Provision pinned Android API 34 environment
        uses: android-actions/setup-android@4d90f943634881869c98b16d759177c8ee849798
        with:
          cmdline-tools-version: "14742923"
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            emulator
            ${{ env.SYSTEM_IMAGE }}

      - name: Provision emulator runtime libraries and screenshot validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep -q 'libpulse.so.0'
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0

      - name: Independently validate exact APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-runtime"
          APK="$ROOT/artifacts/$APK_NAME"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"
          "$TOOLS/aapt" dump badging "$APK" | tee "$ROOT/reports/RUNTIME_APK_BADGING.txt"
          grep -q "package: name='$PACKAGE_NAME' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$ROOT/reports/RUNTIME_APK_BADGING.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$ROOT/reports/RUNTIME_APK_SIGNING.txt"
          "$TOOLS/zipalign" -c -v 4 "$APK" > "$ROOT/reports/RUNTIME_APK_ZIPALIGN.txt"
          unzip -t "$APK" > "$ROOT/logs/RUNTIME_APK_ZIP_INTEGRITY.txt"
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$APK" | sha256sum -c -
          unzip -Z1 "$APK" | grep -q '^lib/x86_64/libgodot_android.so$'
          unzip -Z1 "$APK" | grep -q 'assets/.godot/imported/bb_validation_cube_1m.glb'

      - name: Launch exact cube APK on API 34
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/master-asset-phase1-runtime"
          REPORTS="$ROOT/reports"
          LOGS="$ROOT/logs"
          ARTIFACTS="$ROOT/artifacts"
          APK="$ARTIFACTS/$APK_NAME"
          SCREENSHOT="$ARTIFACTS/cube-smoke-android.png"
          LOGCAT="$LOGS/CUBE_ANDROID_LOGCAT.txt"
          FILTERED="$LOGS/CUBE_ANDROID_LOGCAT_FILTERED.txt"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"
          "$EMULATOR" -version 2>&1 | tee "$REPORTS/EMULATOR_VERSION.txt"
          export ANDROID_USER_HOME="$ROOT/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          AVD_NAME="bahrain-brick-phase1-cube-api34"
          rm -rf "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"

          echo no | "$AVDMANAGER" create avd --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE" \
            --device pixel_7 > "$LOGS/AVD_CREATE.txt" 2>&1
          "$EMULATOR" -list-avds | tee "$REPORTS/AVD_LIST.txt"
          grep -qx "$AVD_NAME" "$REPORTS/AVD_LIST.txt"

          sudo chmod a+rw /dev/kvm || true
          "$EMULATOR" -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            -memory 3072 -cores 2 -no-metrics > "$LOGS/EMULATOR.txt" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          timeout 300 adb wait-for-device
          booted=false
          for _ in $(seq 1 150); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            kill -0 "$EMULATOR_PID"
            sleep 2
          done
          [[ "$booted" == true ]]
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell settings put system screen_off_timeout 2147483647 || true
          sleep 5

          adb install -r -t "$APK" | tee "$LOGS/APK_INSTALL.txt"
          adb logcat -c
          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start -W -n "$PACKAGE_NAME/com.godot.game.GodotApp" | tee "$LOGS/APK_LAUNCH.txt"

          ready=false
          for _ in $(seq 1 120); do
            adb logcat -d -v threadtime > "$LOGCAT"
            if grep -q 'BAHRAIN_BRICK_CUBE_SMOKE_READY size=1.000,1.000,1.000' "$LOGCAT"; then
              ready=true
              break
            fi
            test -n "$(adb shell pidof "$PACKAGE_NAME" 2>/dev/null | tr -d '\r')"
            sleep 2
          done
          [[ "$ready" == true ]]
          sleep 5
          adb logcat -d -v threadtime > "$LOGCAT"
          grep -Ei "$PACKAGE_NAME|Godot|BAHRAIN_BRICK_CUBE_SMOKE_READY|FATAL EXCEPTION|Fatal signal|am_crash|am_anr|ANR in" "$LOGCAT" > "$FILTERED" || true
          if grep -Eq 'FATAL EXCEPTION|Fatal signal|am_crash|am_anr|ANR in' "$FILTERED"; then
            cat "$FILTERED"
            exit 1
          fi
          test -n "$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"
          adb shell dumpsys window windows > "$REPORTS/WINDOW_STATE.txt"
          grep -q "$PACKAGE_NAME" "$REPORTS/WINDOW_STATE.txt"

          adb exec-out screencap -p > "$SCREENSHOT"
          python3 - "$SCREENSHOT" <<'PY'
          from PIL import Image, ImageStat
          import sys

          image = Image.open(sys.argv[1]).convert("RGB")
          width, height = image.size
          stat = ImageStat.Stat(image)
          assert width > height, (width, height)
          assert sum(1 for lo, hi in stat.extrema if hi - lo > 25) >= 2, stat.extrema
          assert sum(stat.mean) / 3 > 4, stat.mean
          print(f"{width}x{height}")
          PY
          sha256sum "$SCREENSHOT" | tee "$REPORTS/ANDROID_SCREENSHOT_SHA256SUM.txt"

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')" \
          SCREEN_SHA="$(sha256sum "$SCREENSHOT" | awk '{print $1}')" \
          python3 - "$REPORTS/PHASE1_CUBE_ANDROID_RESULT.json" <<'PY'
          import json
          import os
          import sys

          report = {
              "status": "PASS",
              "source_run_id": 31290094969,
              "source_artifact_id": 9031108247,
              "api_level": 34,
              "abi": "x86_64",
              "package": "com.bahrainbrick.cubesmoke",
              "activity": "com.godot.game.GodotApp",
              "apk_sha256": os.environ["APK_SHA"],
              "runtime_marker": "BAHRAIN_BRICK_CUBE_SMOKE_READY size=1.000,1.000,1.000",
              "screenshot_sha256": os.environ["SCREEN_SHA"],
              "crash_scan": "PASS",
          }
          assert report["apk_sha256"] == "a293e5973b0635197c3f54380caf83f203869a0824f7039f5de7984bdc7a6ede"
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload Phase 1 Android runtime evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-master-asset-phase1-runtime-${{ github.run_id }}
          path: |
            build/master-asset-phase1-runtime/reports
            build/master-asset-phase1-runtime/logs
            build/master-asset-phase1-runtime/artifacts
          if-no-files-found: error
          retention-days: 30
