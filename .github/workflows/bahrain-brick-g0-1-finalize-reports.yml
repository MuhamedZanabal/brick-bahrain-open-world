name: Bahrain Brick G0.1 Finalize Root-Cause Reports

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-upgrade-v1]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-g0-1-finalize-reports.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: bahrain-brick-g0-1-finalize-reports
  cancel-in-progress: false

env:
  REDUCED_ARTIFACT_ID: '8609597152'
  REDUCED_ARTIFACT_SHA256: 152a3a2f9df4a2db9b0ba701d3f6f00d0032adbb783c9eb064c8990f56f3f722

jobs:
  finalize_reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact G0.1 branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download exact reduced evidence artifact
        if: hashFiles('reports/graphics/g0_1/root_cause_report.json') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/g0_1_reduced
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$REDUCED_ARTIFACT_ID/zip" \
            --output build/g0_1_reduced.zip
          echo "$REDUCED_ARTIFACT_SHA256  build/g0_1_reduced.zip" | sha256sum -c -
          unzip -q build/g0_1_reduced.zip -d build/g0_1_reduced
          rm -f build/g0_1_reduced.zip

      - name: Generate required G0.1 outputs
        if: hashFiles('reports/graphics/g0_1/root_cause_report.json') == ''
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/graphics/finalize_g0_1_startup_evidence.py \
            --source build/g0_1_reduced \
            --output reports/graphics/g0_1

      - name: Reconcile persistent project state
        if: hashFiles('reports/graphics/g0_1/root_cause_report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          state_path=Path('.ai/project-state.json')
          state=json.loads(state_path.read_text())
          state['stage_g0_1']={
            'title':'ANDROID APPLICATION STARTUP ROOT-CAUSE QUALIFICATION',
            'state':'CLOSED',
            'primary_classification':'G0_1_CAUSE_NOT_PROVEN',
            'apk_reused_without_rebuild':True,
            'android_evidence_run_id':30126561161,
            'reducer_run_id':30126886903,
            'package_installed':True,
            'launcher_resolved':True,
            'activity_start_result':'ok',
            'process_created':True,
            'process_remained_alive':True,
            'window_became_visible':True,
            'corrective_implementation_performed':False,
            'smallest_corrective_action':'Harden only the historical Tier B evidence harness launch and process/window acquisition logic.',
            'g1_authorized':False,
          }
          state['next_action']={
            'stage':'G0.1 closed',
            'action':'Await explicit authorization for a separate harness-only corrective implementation. Do not begin G1.',
          }
          state_path.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          Path('.ai/CHECKPOINT.md').write_text('''# Bahrain Brick Graphics — G0.1 Checkpoint

Recorded: 2026-07-24

## Terminal state

- Stage: **BAHRAIN BRICK — STAGE G0.1**
- Classification: `G0_1_CAUSE_NOT_PROVEN`
- Exact APK reused without rebuild: yes
- Package installation: passed
- Launcher resolution: passed
- Explicit `am start -W -S`: `Status: ok`
- Process remained alive: yes
- Window became visible: yes
- Java/native/linker crash: not detected
- Corrective implementation: not performed
- Renderer defaults: unchanged
- G1: unauthorized

## Evidence authority

- Android run: `30126561161`
- Raw artifact: `8609540209`
- Reducer run: `30126886903`
- Reduced artifact: `8609597152`
- Required reports: `reports/graphics/g0_1/`

## Boundary

The exact accepted APK starts and reaches the Godot renderer, mission, scene-readiness, capture, and live-evidence markers on the API 34 x86_64 emulator. The earlier Tier B no-process condition was not reproduced, so its transient cause is not proven.

The smallest proposal is harness-only: resolve the launcher component, start logcat before launch, use `am start -W -S`, preserve ActivityManager process-start evidence, and poll PID plus visible-window state. Await separate authorization before implementing it.
''')
          PY

      - name: Validate reports and staged authority boundary
        if: hashFiles('reports/graphics/g0_1/root_cause_report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('reports/graphics/g0_1')
          required=[
            'authority.json','package_resolution.txt','launch_attempts.json','logcat_full.txt',
            'logcat_critical.txt','process_state.json','activity_state.txt','apk_native_inventory.json',
            'manifest_report.json','emulator_environment.json','root_cause_report.json','root_cause_report.md',
          ]
          for name in required:
            path=root/name
            assert path.is_file() and path.stat().st_size>0, name
          for name in [item for item in required if item.endswith('.json')]:
            json.loads((root/name).read_text())
          report=json.loads((root/'root_cause_report.json').read_text())
          assert report['primary_classification']=='G0_1_CAUSE_NOT_PROVEN'
          assert report['evidence_complete'] is False
          assert report['apk_reused_without_rebuild'] is True
          assert report['package_installed'] is True
          assert report['launcher_resolved'] is True
          assert report['process_remained_alive'] is True
          assert report['window_became_visible'] is True
          assert report['apk_rebuild_required'] is False
          PY
          test "$(git diff --name-only | grep -Ev '^(reports/graphics/g0_1/|\.ai/project-state\.json$|\.ai/CHECKPOINT\.md$)' | wc -l)" -eq 0

      - name: Archive finalizer and commit reports
        if: hashFiles('reports/graphics/g0_1/root_cause_report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/bahrain-brick-g0-1-finalize-reports.yml <<'YAML'
          name: Bahrain Brick G0.1 Finalize Root-Cause Reports — Archived

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            archived:
              if: false
              runs-on: ubuntu-24.04
              steps:
                - run: echo 'G0.1 root-cause reports are terminal. Do not rerun.'
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/graphics/g0_1 .ai/project-state.json .ai/CHECKPOINT.md .github/workflows/bahrain-brick-g0-1-finalize-reports.yml
          allowed='^(reports/graphics/g0_1/|\.ai/project-state\.json$|\.ai/CHECKPOINT\.md$|\.github/workflows/bahrain-brick-g0-1-finalize-reports\.yml$)'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          if git diff --cached --quiet; then
            echo 'Reports already committed; no action required.'
            exit 0
          fi
          git commit -m 'G0.1: emit Android startup root-cause qualification reports'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
