name: Bahrain Brick Engine Qualification Locator

on:
  workflow_run:
    workflows: [Official Godot Engine Determinism Qualification]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'ci/pr59-godot-engine-qualification-20260718'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-godot-engine-qualification-20260718
          fetch-depth: 0
      - name: Record completed qualification run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/forensics
          cat > .github/forensics/engine_qualification_run.json <<JSON
          {"run_id":${{ github.event.workflow_run.id }},"conclusion":"${{ github.event.workflow_run.conclusion }}","head_sha":"${{ github.event.workflow_run.head_sha }}","workflow_name":"${{ github.event.workflow_run.name }}"}
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/engine_qualification_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci(forensics): record engine qualification run [skip ci]'
          for i in 1 2 3 4 5; do
            git pull --rebase origin ci/pr59-godot-engine-qualification-20260718
            git push origin HEAD:ci/pr59-godot-engine-qualification-20260718 && exit 0
            sleep $((i*2))
          done
          exit 1
