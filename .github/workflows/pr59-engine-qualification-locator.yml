name: Bahrain Brick Engine Qualification Locator

on:
  push:
    branches: [ci/pr59-godot-engine-qualification-20260718]
    paths: [.github/workflows/pr59-engine-qualification.yml]

permissions:
  actions: read
  contents: write

jobs:
  locator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-godot-engine-qualification-20260718
          fetch-depth: 0
      - name: Locate qualification run and record immutable locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 12
          mkdir -p .github/forensics/run-locators
          python3 - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/pr59-engine-qualification.yml/runs?branch=ci/pr59-godot-engine-qualification-20260718&event=push&per_page=20'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'pr59-engine-qualification-locator'})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          matches=[x for x in data.get('workflow_runs',[]) if x.get('head_sha')==sha]
          if len(matches)!=1: raise SystemExit(f'expected exactly one main run for {sha}, found {len(matches)}')
          x=matches[0]
          out={'run_id':x['id'],'status':x['status'],'conclusion':x['conclusion'],'head_sha':x['head_sha'],'workflow_path':x['path'],'created_at':x['created_at']}
          open('.github/forensics/run-locators/pr59-engine-qualification.json','w').write(json.dumps(out,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/run-locators/pr59-engine-qualification.json
          git commit -m 'ci: record engine qualification run [skip ci]'
          for i in 1 2 3 4 5; do
            git pull --rebase origin ci/pr59-godot-engine-qualification-20260718 && git push origin HEAD:ci/pr59-godot-engine-qualification-20260718 && exit 0
            sleep $((i*2))
          done
          exit 1
