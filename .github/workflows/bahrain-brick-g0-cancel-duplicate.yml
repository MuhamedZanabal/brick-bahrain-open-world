name: Cancel Duplicate G0 Evidence Runs

on:
  pull_request:
    branches: [work/bahrain-brick-manama-souq-vertical-slice-v1]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-g0-cancel-duplicate.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel_duplicates:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel unintended duplicate evidence runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 30087878937 30087878888; do
            status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq .status)"
            if [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "waiting" || "$status" == "requested" || "$status" == "pending" ]]; then
              gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel"
            fi
          done
