name: Temporary Bahrain Brick Playable APK Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-bahrain-brick-playable-apk.yml
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-bahrain-brick-playable-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REF: work/bahrain-brick-renderer-runtime-debugging-r1
      OUTPUT_ROOT: ${{ runner.temp }}/bahrain-brick-playable-mobile
      TAG: bahrain-brick-playable-mobile-corrected
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/bahrain-brick-renderer-runtime-debugging-r1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install export dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb unzip
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify playable export contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/graphics/test_r1_playable_apk_export.py -v
          python3 -m py_compile tools/graphics/patch_r1_playable_export.py
          bash -n tools/graphics/export_r1_playable_mobile_apk.sh

      - name: Export playable production-scene APK
        shell: bash
        run: |
          set -euo pipefail
          bash tools/graphics/export_r1_playable_mobile_apk.sh "$GITHUB_WORKSPACE" "$OUTPUT_ROOT"

      - name: Verify APK identity, startup scene, and signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$OUTPUT_ROOT/bahrain-brick-playable-mobile-arm64.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release/playable-apk-signing.txt
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee release/playable-apk-badging.txt
          grep -q "package: name='com.brickbahrain.playable.mobile'" release/playable-apk-badging.txt
          unzip -p "$APK" assets/project.binary > release/project.binary
          grep -a -q 'res://scenes/splash_screen.tscn' release/project.binary
          ! grep -a -q 'res://tests/graphics/r1_renderer_runtime_debug.tscn' release/project.binary
          cp "$APK" release/
          sha256sum release/bahrain-brick-playable-mobile-arm64.apk | tee release/PLAYABLE_APK_SHA256SUMS.txt
          SOURCE_SHA="$(git rev-parse HEAD)"
          python3 - "$SOURCE_SHA" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          apk = Path('release/bahrain-brick-playable-mobile-arm64.apk')
          h = hashlib.sha256()
          with apk.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  h.update(chunk)
          payload = {
              'schema_version': 1,
              'purpose': 'Playable Android package using production startup and game scenes',
              'source_commit': sys.argv[1],
              'engine': '4.3-stable',
              'renderer': 'mobile',
              'architecture': 'arm64-v8a',
              'package': 'com.brickbahrain.playable.mobile',
              'filename': apk.name,
              'size_bytes': apk.stat().st_size,
              'sha256': h.hexdigest(),
              'production_main_scene': 'res://scenes/splash_screen.tscn',
              'production_main_scene_preserved': True,
              'diagnostic_main_scene_selected': False,
              'diagnostic_evidence_camera_selected': False,
              'debug_signed': True,
          }
          Path('release/PLAYABLE_APK_HANDOFF.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-playable-mobile-arm64-${{ github.run_id }}
          path: release/
          retention-days: 30

      - name: Publish stable prerelease URL
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/bahrain-brick-playable-mobile-arm64.apk \
              release/PLAYABLE_APK_HANDOFF.json \
              release/PLAYABLE_APK_SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              release/bahrain-brick-playable-mobile-arm64.apk \
              release/PLAYABLE_APK_HANDOFF.json \
              release/PLAYABLE_APK_SHA256SUMS.txt \
              --target "$(git rev-parse HEAD)" \
              --title 'Bahrain Brick Corrected Playable Mobile APK' \
              --notes 'Verified ARM64 debug build using the production splash/game startup path. The R1 diagnostic evidence camera is not selected.' \
              --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
