name: PR59 Extract Accepted Primary APK

on:
  push:
    branches:
      - ci/pr59-existing-apk-gate-closure-20260717
    paths:
      - .github/workflows/pr59-extract-primary-apk-only.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: pr59-extract-primary-apk-only
  cancel-in-progress: false

jobs:
  extract_primary_apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download accepted evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            /repos/MuhamedZanabal/brick-bahrain-open-world/actions/artifacts/8411002980/zip \
            > primary-evidence.zip

      - name: Extract and verify accepted APK
        run: |
          set -euo pipefail
          mkdir -p extracted
          mapfile -t matches < <(unzip -Z1 primary-evidence.zip | grep -E '(^|/)bahrain-brick-pr59-primary-debug\.apk$')
          test "${#matches[@]}" -eq 1
          unzip -p primary-evidence.zip "${matches[0]}" > extracted/bahrain-brick-pr59-primary-debug.apk
          test "$(stat -c '%s' extracted/bahrain-brick-pr59-primary-debug.apk)" = '347919106'
          echo '0956a0c8195dc9319238b1230ef3c0291a09742c357256ae29da46aa649bf455  extracted/bahrain-brick-pr59-primary-debug.apk' | sha256sum -c -
          sha256sum extracted/bahrain-brick-pr59-primary-debug.apk > extracted/SHA256SUMS.txt
          stat -c '%n %s bytes' extracted/bahrain-brick-pr59-primary-debug.apk > extracted/APK_SIZE.txt

      - name: Upload APK-only artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-pr59-primary-apk-only
          path: extracted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
