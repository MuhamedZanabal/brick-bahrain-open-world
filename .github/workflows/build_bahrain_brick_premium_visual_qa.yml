name: Build Bahrain Brick Premium Visual QA

on:
  push:
    branches: [work/bahrain-brick-premium-visual-v14]
  pull_request:
    branches: [baseline/bahrain-brick-v14.0.3-functional-graphics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: barichello/godot-ci:4.3
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      LIBGL_ALWAYS_SOFTWARE: "1"
      SOURCE_URL: https://github.com/MuhamedZanabal/brick-bahrain-open-world/releases/download/v1.4.0.3-graphics-qa/bahrain_brick_v14.0.3-graphics-source.zip
      SOURCE_SHA256: 5c4d8ac4497eda7752058424062a74a97c1f6f5e0c9a1ff393abac2a2c7c828a
      APK_NAME: bahrain_brick_v14.0.4-premium-visual-qa.apk
      PACKAGE_NAME: com.bahrainbrick.game.qa
    steps:
      - name: Check out premium visual branch
        uses: actions/checkout@v4

      - name: Install build and evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pil openjdk-17-jdk-headless unzip zip curl ca-certificates coreutils \
            xvfb ffmpeg libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 libxrender1
          update-alternatives --set java "$JAVA_HOME/bin/java"
          update-alternatives --set javac "$JAVA_HOME/bin/javac"
          python3 -m py_compile tools/apply_bahrain_brick_premium_world_overlay.py tools/verify_frozen_controls.py

      - name: Recover checksum-locked integrated v1.4.0.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads baseline/v14 recovery/v14
          curl -fL --retry 4 --retry-delay 3 "$SOURCE_URL" -o downloads/source.zip
          echo "$SOURCE_SHA256  downloads/source.zip" | sha256sum -c -
          unzip -q downloads/source.zip -d baseline/v14
          unzip -q downloads/source.zip -d recovery/v14
          test -f baseline/v14/project.godot
          test -f recovery/v14/project.godot

      - name: Capture matched baseline gameplay-world views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/v14/build/premium_visual_evidence/before baseline/v14/build/logs
          python3 tools/apply_bahrain_brick_premium_world_overlay.py baseline/v14 --evidence-only \
            --report baseline/v14/build/premium_visual_evidence/BASELINE_EVIDENCE_HARNESS_REPORT.json
          godot --headless --path baseline/v14 --editor --quit \
            2>&1 | tee baseline/v14/build/logs/godot-import-before.log
          set -o pipefail
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path baseline/v14 --audio-driver Dummy \
            --display-driver x11 --rendering-method gl_compatibility \
            res://scenes/premium_world_visual_evidence.tscn -- \
            --output=res://build/premium_visual_evidence/before \
            2>&1 | tee baseline/v14/build/logs/world-evidence-before.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q 'PREMIUM WORLD VISUAL EVIDENCE COMPLETE' baseline/v14/build/logs/world-evidence-before.log

      - name: Apply premium gameplay-world overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/v14/build/reports recovery/v14/build/logs
          python3 tools/apply_bahrain_brick_premium_world_overlay.py recovery/v14 \
            --report recovery/v14/build/reports/PREMIUM_WORLD_OVERLAY_REPORT.json \
            2>&1 | tee recovery/v14/build/logs/premium-world-overlay.log
          python3 tools/verify_frozen_controls.py recovery/v14 \
            --json-out recovery/v14/build/reports/FROZEN_CONTROLS_PRE_TEST.json \
            --markdown-out recovery/v14/build/reports/FROZEN_CONTROLS_PRE_TEST.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('recovery/v14/export_presets.cfg')
          text=path.read_text(encoding='utf-8')
          text,n1=re.subn(r'(?m)^version/code=.*$', 'version/code=1404', text)
          text,n2=re.subn(r'(?m)^version/name=.*$', 'version/name="1.4.0.4-premium-visual-qa"', text)
          if (n1,n2)!=(1,1): raise SystemExit(f'version replacement failure {(n1,n2)}')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Import premium source and run acceptance suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/v14/build/ci/test-user-data/{smoke,controls,presentation,premium}
          set -o pipefail
          godot --headless --path recovery/v14 --editor --quit --verbose \
            2>&1 | tee recovery/v14/build/logs/godot-import-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Failed to create an autoload' recovery/v14/build/logs/godot-import-premium.log; then exit 1; fi

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/smoke" \
            timeout 700 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://build/ci/runtime_smoke_runner_v14.tscn \
            2>&1 | tee recovery/v14/build/logs/runtime-smoke-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q ', 0 failed' recovery/v14/build/logs/runtime-smoke-premium.log

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/controls" \
            timeout 700 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://scenes/mobile_input_pipeline_test.tscn \
            2>&1 | tee recovery/v14/build/logs/mobile-input-regression-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q '28 passed, 0 failed' recovery/v14/build/logs/mobile-input-regression-premium.log

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/presentation" \
            timeout 700 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://scenes/presentation_flow_test.tscn -- --presentation-test \
            2>&1 | tee recovery/v14/build/logs/presentation-flow-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q '10 passed, 0 failed' recovery/v14/build/logs/presentation-flow-premium.log

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/premium" \
            timeout 500 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://scenes/premium_world_acceptance_test.tscn \
            2>&1 | tee recovery/v14/build/logs/premium-world-acceptance.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q '12 passed, 0 failed' recovery/v14/build/logs/premium-world-acceptance.log

      - name: Capture upgraded world and presentation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/v14/build/premium_visual_evidence/after \
                   recovery/v14/build/visual_evidence/startup_frames \
