name: Build Bahrain Brick Premium Visual QA

on:
  pull_request:
    branches:
      - work/bahrain-brick-premium-visual-v14
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-configuration-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Fail until the complete corrected validation workflow is committed
        shell: bash
        run: |
          echo "Validation workflow configuration is being replaced atomically on the premium branch." >&2
          echo "Do not dispatch this intermediate revision." >&2
          exit 1
