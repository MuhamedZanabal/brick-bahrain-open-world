name: Build Bahrain Brick Premium Visual QA

on:
  push:
    branches: [work/bahrain-brick-premium-visual-v14]
  pull_request:
    branches: [baseline/bahrain-brick-v14.0.3-functional-graphics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: barichello/godot-ci:4.3
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      LIBGL_ALWAYS_SOFTWARE: "1"
      SOURCE_URL: https://github.com/MuhamedZanabal/brick-bahrain-open-world/releases/download/v1.4.0.3-graphics-qa/bahrain_brick_v14.0.3-graphics-source.zip
      SOURCE_SHA256: 5c4d8ac4497eda7752058424062a74a97c1f6f5e0c9a1ff393abac2a2c7c828a
      APK_NAME: bahrain_brick_v14.0.4-premium-visual-qa.apk
      PACKAGE_NAME: com.bahrainbrick.game.qa
    steps:
      - name: Check out premium visual branch
        uses: actions/checkout@v4

      - name: Install build and evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pil openjdk-17-jdk-headless unzip zip curl ca-certificates coreutils \
            xvfb ffmpeg libgl1-mesa-dri libglx-mesa0 libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 libxrender1
          update-alternatives --set java "$JAVA_HOME/bin/java"
          update-alternatives --set javac "$JAVA_HOME/bin/javac"
          python3 -m py_compile tools/apply_bahrain_brick_premium_world_overlay.py tools/verify_frozen_controls.py

      - name: Recover checksum-locked integrated v1.4.0.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads baseline/v14 recovery/v14
          curl -fL --retry 4 --retry-delay 3 "$SOURCE_URL" -o downloads/source.zip
          echo "$SOURCE_SHA256  downloads/source.zip" | sha256sum -c -
          unzip -q downloads/source.zip -d baseline/v14
          unzip -q downloads/source.zip -d recovery/v14
          test -f baseline/v14/project.godot
          test -f recovery/v14/project.godot

      - name: Capture matched baseline gameplay-world views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/v14/build/premium_visual_evidence/before baseline/v14/build/logs
          python3 tools/apply_bahrain_brick_premium_world_overlay.py baseline/v14 --evidence-only \
            --report baseline/v14/build/premium_visual_evidence/BASELINE_EVIDENCE_HARNESS_REPORT.json
          godot --headless --path baseline/v14 --editor --quit \
            2>&1 | tee baseline/v14/build/logs/godot-import-before.log
          set -o pipefail
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path baseline/v14 --audio-driver Dummy \
            --display-driver x11 --rendering-method gl_compatibility \
            res://scenes/premium_world_visual_evidence.tscn -- \
            --output=res://build/premium_visual_evidence/before \
            2>&1 | tee baseline/v14/build/logs/world-evidence-before.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q 'PREMIUM WORLD VISUAL EVIDENCE COMPLETE' baseline/v14/build/logs/world-evidence-before.log

      - name: Apply premium gameplay-world overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/v14/build/reports recovery/v14/build/logs
          python3 tools/apply_bahrain_brick_premium_world_overlay.py recovery/v14 \
            --report recovery/v14/build/reports/PREMIUM_WORLD_OVERLAY_REPORT.json \
            2>&1 | tee recovery/v14/build/logs/premium-world-overlay.log
          python3 tools/verify_frozen_controls.py recovery/v14 \
            --json-out recovery/v14/build/reports/FROZEN_CONTROLS_PRE_TEST.json \
            --markdown-out recovery/v14/build/reports/FROZEN_CONTROLS_PRE_TEST.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('recovery/v14/export_presets.cfg')
          text=path.read_text(encoding='utf-8')
          text,n1=re.subn(r'(?m)^version/code=.*$', 'version/code=1404', text)
          text,n2=re.subn(r'(?m)^version/name=.*$', 'version/name="1.4.0.4-premium-visual-qa"', text)
          if (n1,n2)!=(1,1): raise SystemExit(f'version replacement failure {(n1,n2)}')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Import premium source and run acceptance suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/v14/build/ci/test-user-data/{smoke,controls,presentation,premium}
          set -o pipefail
          godot --headless --path recovery/v14 --editor --quit --verbose \
            2>&1 | tee recovery/v14/build/logs/godot-import-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Failed to create an autoload' recovery/v14/build/logs/godot-import-premium.log; then exit 1; fi

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/smoke" \
            timeout 700 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://build/ci/runtime_smoke_runner_v14.tscn \
            2>&1 | tee recovery/v14/build/logs/runtime-smoke-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q ', 0 failed' recovery/v14/build/logs/runtime-smoke-premium.log

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/controls" \
            timeout 700 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://scenes/mobile_input_pipeline_test.tscn \
            2>&1 | tee recovery/v14/build/logs/mobile-input-regression-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q '28 passed, 0 failed' recovery/v14/build/logs/mobile-input-regression-premium.log

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/presentation" \
            timeout 700 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://scenes/presentation_flow_test.tscn -- --presentation-test \
            2>&1 | tee recovery/v14/build/logs/presentation-flow-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q '10 passed, 0 failed' recovery/v14/build/logs/presentation-flow-premium.log

          set -o pipefail
          env XDG_DATA_HOME="$PWD/recovery/v14/build/ci/test-user-data/premium" \
            timeout 500 godot --headless --path recovery/v14 --audio-driver Dummy \
            res://scenes/premium_world_acceptance_test.tscn \
            2>&1 | tee recovery/v14/build/logs/premium-world-acceptance.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q '12 passed, 0 failed' recovery/v14/build/logs/premium-world-acceptance.log

      - name: Capture upgraded world and presentation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/v14/build/premium_visual_evidence/after \
                   recovery/v14/build/visual_evidence/startup_frames \
                   recovery/v14/build/visual_evidence/frames \
                   recovery/v14/build/visual_evidence/screenshots
          set -o pipefail
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path recovery/v14 --audio-driver Dummy \
            --display-driver x11 --rendering-method gl_compatibility \
            res://scenes/premium_world_visual_evidence.tscn -- \
            --output=res://build/premium_visual_evidence/after \
            2>&1 | tee recovery/v14/build/logs/world-evidence-after.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q 'PREMIUM WORLD VISUAL EVIDENCE COMPLETE' recovery/v14/build/logs/world-evidence-after.log

          set -o pipefail
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path recovery/v14 --audio-driver Dummy \
            --display-driver x11 --rendering-method gl_compatibility \
            res://scenes/presentation_visual_evidence.tscn -- --presentation-test \
            2>&1 | tee recovery/v14/build/logs/presentation-visual-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q 'presentation visual evidence complete' recovery/v14/build/logs/presentation-visual-premium.log

          set -o pipefail
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path recovery/v14 --audio-driver Dummy \
            --display-driver x11 --rendering-method gl_compatibility \
            res://scenes/mobile_input_visual_evidence.tscn \
            2>&1 | tee recovery/v14/build/logs/mobile-input-visual-premium.log
          status="${PIPESTATUS[0]}"; set +o pipefail
          test "$status" -eq 0
          grep -q 'rendered control evidence complete' recovery/v14/build/logs/mobile-input-visual-premium.log

          ffmpeg -y -framerate 15 -i recovery/v14/build/visual_evidence/startup_frames/frame_%04d.png \
            -vf "scale=1280:-2:flags=lanczos" -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p \
            recovery/v14/build/visual_evidence/bahrain_brick_v14.0.4_startup.mp4
          ffmpeg -y -framerate 12 -i recovery/v14/build/visual_evidence/frames/frame_%04d.png \
            -vf "scale=1280:-2:flags=lanczos" -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p \
            recovery/v14/build/visual_evidence/bahrain_brick_v14.0.4_controls.mp4

      - name: Generate matched comparisons and hosted performance report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageStat
          import json, shutil
          before=Path('baseline/v14/build/premium_visual_evidence/before')
          after=Path('recovery/v14/build/premium_visual_evidence/after')
          out=Path('recovery/v14/build/premium_visual_evidence/comparisons'); out.mkdir(parents=True,exist_ok=True)
          names=['city_road','waterfront','building_area','daylight','player_character','vehicle','hud_walking','hud_vehicle']
          metrics=[]
          for name in names:
              bp=before/f'{name}.png'; ap=after/f'{name}.png'
              if not bp.is_file() or not ap.is_file(): raise SystemExit(f'missing comparison source {name}')
              b=Image.open(bp).convert('RGB'); a=Image.open(ap).convert('RGB')
              if b.size!=(1280,720) or a.size!=(1280,720): raise SystemExit(f'bad dimensions {name}')
              canvas=Image.new('RGB',(2560,760),(18,18,22)); canvas.paste(b,(0,40)); canvas.paste(a,(1280,40))
              draw=ImageDraw.Draw(canvas); draw.text((20,12),f'BEFORE — v1.4.0.3 functional graphics — {name}',fill='white'); draw.text((1300,12),f'AFTER — v1.4.0.4 premium world — {name}',fill='white')
              canvas.save(out/f'{name}_before_after.png',optimize=True)
              def stats(im):
                  small=im.resize((160,90)); px=list(small.getdata()); total=len(px)
                  clipped=sum(1 for r,g,b in px if r>246 and g>246 and b>246)/total
                  dark=sum(1 for r,g,b in px if r<12 and g<12 and b<12)/total
                  mean=sum(ImageStat.Stat(small).mean)/3
                  return {'mean_luminance':round(mean,3),'near_white_ratio':round(clipped,6),'near_black_ratio':round(dark,6)}
              metrics.append({'view':name,'before':stats(b),'after':stats(a)})
          baseline_manifest=json.loads((before/'PREMIUM_WORLD_VISUAL_EVIDENCE.json').read_text())
          upgraded_manifest=json.loads((after/'PREMIUM_WORLD_VISUAL_EVIDENCE.json').read_text())
          report={
            'classification':'hosted GL Compatibility comparison; not physical Android performance',
            'views':metrics,
            'baseline_runtime':baseline_manifest,
            'upgraded_runtime':upgraded_manifest,
            'physical_android_tested':False,
          }
          (Path('recovery/v14/build/reports')/'PREMIUM_VISUAL_COMPARISON_AND_PERFORMANCE.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Recheck frozen controls after runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_frozen_controls.py recovery/v14 \
            --json-out recovery/v14/build/reports/FROZEN_CONTROLS_POST_TEST.json \
            --markdown-out recovery/v14/build/reports/FROZEN_CONTROLS_POST_TEST.md

      - name: Export and inspect Android QA APK
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_DIR="${RUNNER_TEMP:-/tmp}/bahrain-brick-premium-qa"; mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="$KEYSTORE_DIR/debug.keystore"; rm -f "$KEYSTORE_PATH"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bahrain Brick Premium Visual QA,O=Zanabal Gaming,C=BH"
          python3 - "$KEYSTORE_PATH" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('recovery/v14/export_presets.cfg'); t=p.read_text(); key=Path(sys.argv[1]).resolve().as_posix()
          t,n=re.subn(r'(?m)^keystore/debug=.*$',f'keystore/debug="{key}"',t)
          if n!=1: raise SystemExit(f'keystore replacement count={n}')
          p.write_text(t)
          PY
          godot --headless --path recovery/v14 --verbose --export-debug Android "recovery/v14/build/$APK_NAME" \
            2>&1 | tee recovery/v14/build/logs/android-export-premium.log
          test -s "recovery/v14/build/$APK_NAME"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then AAPT_CANDIDATE="$(find /opt /root /usr/local /usr/lib -type f -path '*/build-tools/*/aapt' 2>/dev/null | sort -V | tail -1)"; SDK_ROOT="${AAPT_CANDIDATE%%/build-tools/*}"; fi
          AAPT_BIN="$(command -v aapt || find "$SDK_ROOT" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER_BIN="$(command -v apksigner || find "$SDK_ROOT" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN_BIN="$(command -v zipalign || find "$SDK_ROOT" -type f -name zipalign | sort -V | tail -1)"
          unzip -t "recovery/v14/build/$APK_NAME" > recovery/v14/build/logs/apk-zip-integrity-premium.txt
          sha256sum "recovery/v14/build/$APK_NAME" | tee "recovery/v14/build/$APK_NAME.sha256"
          "$AAPT_BIN" dump badging "recovery/v14/build/$APK_NAME" | tee recovery/v14/build/logs/aapt-badging-premium.txt
          grep -q "package: name='$PACKAGE_NAME' versionCode='1404' versionName='1.4.0.4-premium-visual-qa'" recovery/v14/build/logs/aapt-badging-premium.txt
          grep -q "application-label:'Bahrain Brick'" recovery/v14/build/logs/aapt-badging-premium.txt
          ! grep -q 'android.permission.RECORD_AUDIO' recovery/v14/build/logs/aapt-badging-premium.txt
          "$AAPT_BIN" dump xmltree "recovery/v14/build/$APK_NAME" AndroidManifest.xml | tee recovery/v14/build/logs/aapt-manifest-premium.txt
          grep -Eq 'android:screenOrientation.*(0xb|=11)' recovery/v14/build/logs/aapt-manifest-premium.txt
          "$APKSIGNER_BIN" verify --verbose --print-certs "recovery/v14/build/$APK_NAME" | tee recovery/v14/build/logs/apksigner-premium.txt
          "$ZIPALIGN_BIN" -c -v 4 "recovery/v14/build/$APK_NAME" > recovery/v14/build/logs/zipalign-premium.txt

      - name: Package source, workspace and exact manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,zipfile
          root=Path('recovery/v14'); build=root/'build'; apk=build/'bahrain_brick_v14.0.4-premium-visual-qa.apk'
          export=root/'export_presets.cfg'; text=export.read_text(); text=re.sub(r'(?m)^keystore/debug=.*$','keystore/debug=""',text); export.write_text(text)
          def zip_tree(out, include_build=False):
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(root.rglob('*')):
                      rel=p.relative_to(root)
                      if not p.is_file() or '.godot' in rel.parts or '.git' in rel.parts: continue
                      if not include_build and rel.parts[:1]==('build',): continue
                      if p.name=='debug.keystore': continue
                      z.write(p,rel.as_posix())
          source=build/'bahrain_brick_v14.0.4-premium-visual-source.zip'; zip_tree(source,False)
          workspace=build/'bahrain_brick_v14.0.4-premium-visual-workspace.zip'
          with zipfile.ZipFile(workspace,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.write(source,source.name); z.write(apk,apk.name)
              for folder in ['reports','logs','premium_visual_evidence','visual_evidence']:
                  for p in sorted((build/folder).rglob('*')):
                      if p.is_file(): z.write(p,f'{folder}/{p.relative_to(build/folder).as_posix()}')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          for p in [apk,source,workspace]: p.with_suffix(p.suffix+'.sha256').write_text(f'{sha(p)}  {p.name}\n')
          report={
            'evidence_class':'VERIFIED package inspection and hosted runtime',
            'classification':'historical v1.4 premium-world QA; not v15 authority',
            'package':'com.bahrainbrick.game.qa','version_name':'1.4.0.4-premium-visual-qa','version_code':1404,
            'orientation':'sensorLandscape','app_label':'Bahrain Brick',
            'apk':apk.name,'apk_bytes':apk.stat().st_size,'apk_sha256':sha(apk),
            'baseline_apk_bytes':191128589,'baseline_apk_sha256':'753f9fe86a18da880886a6a6a501067aa3348dcbc8853e8f8a20e216e219ad4d',
            'apk_size_delta_bytes':apk.stat().st_size-191128589,
            'source_zip':source.name,'source_sha256':sha(source),
            'workspace_zip':workspace.name,'workspace_sha256':sha(workspace),
            'control_regression':'28 passed, 0 failed','presentation_regression':'10 passed, 0 failed',
            'premium_world_acceptance':'12 passed, 0 failed','physical_android_tested':False,
            'signing':'ephemeral QA certificate; not production',
          }
          (build/'reports'/'PREMIUM_VISUAL_BUILD_PROVENANCE.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          sha256sum recovery/v14/build/visual_evidence/*.mp4 \
            recovery/v14/build/visual_evidence/screenshots/*.png \
            recovery/v14/build/premium_visual_evidence/comparisons/*.png \
            > recovery/v14/build/reports/EVIDENCE_CHECKSUMS.sha256

      - name: Upload APK, source, workspace, evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-brick-premium-visual-qa
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovery/v14/build/bahrain_brick_v14.0.4-premium-visual-qa.apk*
            recovery/v14/build/bahrain_brick_v14.0.4-premium-visual-source.zip*
            recovery/v14/build/bahrain_brick_v14.0.4-premium-visual-workspace.zip*
            recovery/v14/build/logs/**
            recovery/v14/build/reports/**
            recovery/v14/build/premium_visual_evidence/**
            recovery/v14/build/visual_evidence/**
