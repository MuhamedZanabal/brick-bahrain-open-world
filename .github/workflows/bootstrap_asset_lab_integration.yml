name: Bootstrap Bahrain Brick Asset Lab Integration Authority

on:
  push:
    branches:
      - work/bahrain-brick-asset-lab-integration-v1
    paths:
      - 'asset_lab/bootstrap/asset-lab-integration-bootstrap.tar.gz'
      - '.github/workflows/bootstrap_asset_lab_integration.yml'
  pull_request:
    branches:
      - work/bahrain-brick-premium-visual-v14
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'asset_lab/bootstrap/asset-lab-integration-bootstrap.tar.gz'
      - '.github/workflows/bootstrap_asset_lab_integration.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  bootstrap:
    if: github.event_name == 'push' || (github.event.pull_request.head.ref == 'work/bahrain-brick-asset-lab-integration-v1' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/bahrain-brick-asset-lab-integration-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm reviewed bootstrap archive SHA-256
        shell: bash
        run: |
          set -euo pipefail
          archive='asset_lab/bootstrap/asset-lab-integration-bootstrap.tar.gz'
          test -f "$archive"
          test "$(stat -c '%s' "$archive")" = '14163'
          echo '88f676930147856971337bcea62b67e574e8e6971618302e4b6c113c5a3d13fd  asset_lab/bootstrap/asset-lab-integration-bootstrap.tar.gz' | sha256sum -c -
      - name: Inspect and extract reviewed bootstrap safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path('asset_lab/bootstrap/asset-lab-integration-bootstrap.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if len(members) != 16:
                  raise SystemExit(f'expected 16 bootstrap members, found {len(members)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe bootstrap member: {member.name}')
                  if not member.isfile():
                      raise SystemExit(f'non-file bootstrap member: {member.name}')
              handle.extractall('.')

          workflow = Path('.github/workflows/validate_asset_lab_authority.yml')
          text = workflow.read_text(encoding='utf-8')
          guard = "    if: github.actor != 'github-actions[bot]'\n"
          if text.count(guard) != 1:
              raise SystemExit('expected exactly one obsolete actor guard')
          workflow.write_text(text.replace(guard, ''), encoding='utf-8')
          print('BOOTSTRAP_ARCHIVE_SAFETY: PASS')
          PY
      - name: Install authority-test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Download exact Asset Lab authority bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 8 --retry-all-errors \
            'https://drive.usercontent.google.com/download?id=1SykBMg8fteOtnwsj-AlwNrLKZHOHZlhM&export=download&confirm=t' \
            --output asset_lab/source_authority/bahrain-brick-assets-phase5-asset-lab.bundle
          echo '98e3964a1c84200c8d764116bc027678de0019fc6481ca41825ed606aa2a9c41  asset_lab/source_authority/bahrain-brick-assets-phase5-asset-lab.bundle' | sha256sum -c -
      - name: Test authority and generate complete evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/asset_lab
          rm -rf .asset-lab-authority-run
          mkdir -p .asset-lab-authority-run
          python tools/asset_lab/verify_asset_lab_authority.py \
            --bundle asset_lab/source_authority/bahrain-brick-assets-phase5-asset-lab.bundle \
            --summary asset_lab/source_authority/bahrain-brick-assets-phase5-asset-lab-summary.json \
            --work-dir .asset-lab-authority-run \
            --report .asset-lab-authority-run/ASSET_LAB_AUTHORITY_REPORT.json \
            --ledger .asset-lab-authority-run/ASSET_LAB_HEAD_TRACKED_SHA256SUMS.txt
          python tools/asset_lab/build_integration_matrix.py \
            --manifest .asset-lab-authority-run/asset-authority/docs/assets/ASSET_MASTER_MANIFEST.csv \
            --csv .asset-lab-authority-run/ASSET_LAB_INTEGRATION_MATRIX.csv \
            --json .asset-lab-authority-run/ASSET_LAB_INTEGRATION_MATRIX.json
          mkdir -p docs/asset_lab
          cp .asset-lab-authority-run/ASSET_LAB_AUTHORITY_REPORT.json docs/asset_lab/ASSET_LAB_AUTHORITY_REPORT.json
          cp .asset-lab-authority-run/ASSET_LAB_HEAD_TRACKED_SHA256SUMS.txt docs/asset_lab/ASSET_LAB_HEAD_TRACKED_SHA256SUMS.txt
          cp .asset-lab-authority-run/ASSET_LAB_INTEGRATION_MATRIX.csv docs/asset_lab/ASSET_LAB_INTEGRATION_MATRIX.csv
          cp .asset-lab-authority-run/ASSET_LAB_INTEGRATION_MATRIX.json docs/asset_lab/ASSET_LAB_INTEGRATION_MATRIX.json
      - name: Commit verified authority gate to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f asset_lab/source_authority/bahrain-brick-assets-phase5-asset-lab.bundle
          rm -rf .asset-lab-authority-run asset_lab/bootstrap
          rm -f .github/workflows/bootstrap_asset_lab_integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(asset-lab): establish verified integration authority'
          git push origin HEAD:work/bahrain-brick-asset-lab-integration-v1
