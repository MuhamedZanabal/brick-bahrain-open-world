name: Bahrain Brick G0.1 Evidence Reducer

on:
  pull_request:
    branches: [work/bahrain-brick-graphics-upgrade-v1]
    types: [synchronize]
    paths:
      - .github/workflows/bahrain-brick-g0-1-reducer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bahrain-brick-g0-1-reducer
  cancel-in-progress: false

env:
  SOURCE_ARTIFACT_ID: '8609540209'
  SOURCE_ARTIFACT_SHA256: dd1f798d2ceee3c63b50916c4d8b6a0695f4d54e34f0d86479e26bde5ef684a5
  APK_SHA256: 8461e9916b5636a35dd921d674529013b7b4623b3504f2332a9d7b4ac064b7eb

jobs:
  reduce_existing_g0_1_artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download exact existing G0.1 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source build/reduced
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output build/source/g0_1.zip
          echo "$SOURCE_ARTIFACT_SHA256  build/source/g0_1.zip" | sha256sum -c -

      - name: Retain exact APK and raw diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          source=Path('build/source/g0_1.zip'); target=Path('build/reduced')
          inventory=[]; retained=[]; excluded=[]
          with zipfile.ZipFile(source) as zf:
              for info in zf.infolist():
                  if info.is_dir(): continue
                  path=info.filename.lstrip('./')
                  keep=path.startswith('apk/') or path.startswith('raw/')
                  reason=None if keep else 'AVD, emulator-home, source cache, or other non-diagnostic runtime bulk'
                  record={'path':path,'uncompressed_size':info.file_size,'compressed_size':info.compress_size,'retained':keep,'exclusion_reason':reason}
                  inventory.append(record)
                  if keep:
                      data=zf.read(info); record['sha256']=hashlib.sha256(data).hexdigest()
                      out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data); retained.append(record)
                  else:
                      record['sha256']=None; excluded.append(record)
          apk=target/'apk/bahrain-brick-g0-gl-compatibility-x86_64.apk'
          if hashlib.sha256(apk.read_bytes()).hexdigest()!=os.environ['APK_SHA256']:
              raise SystemExit('exact APK SHA mismatch after reduction')
          (target/'REDUCTION_INVENTORY.json').write_text(json.dumps({'schema_version':1,'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),'source_artifact_digest':'sha256:'+os.environ['SOURCE_ARTIFACT_SHA256'],'inventory':inventory,'retained_count':len(retained),'excluded_count':len(excluded)},indent=2,sort_keys=True)+'\n')
          PY
          rm -f build/source/g0_1.zip

      - name: Upload compact G0.1 evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-g0-1-reduced-${{ github.run_id }}
          path: build/reduced
          if-no-files-found: error
          retention-days: 30
