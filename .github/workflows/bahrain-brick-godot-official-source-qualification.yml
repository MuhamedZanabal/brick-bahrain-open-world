name: Bahrain Brick Official Godot Source Qualification

on:
  push:
    branches:
      - ci/pr59-existing-apk-gate-closure-20260717
    paths:
      - .github/workflows/bahrain-brick-godot-official-source-qualification.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      QUALIFICATION_TRIGGER: '2'
      FROZEN_PR_HEAD: 5b4e2466ef84f3984f3bf336b31925d4d2e97a7f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Record run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/locator.json
          import base64,json,os
          body=json.dumps({'run_id':int(os.environ['GITHUB_RUN_ID']),'workflow_sha':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'frozen_pr_head':os.environ['FROZEN_PR_HEAD']},sort_keys=True)+'\n'
          print(json.dumps({'message':'ci: record official Godot qualification run','branch':os.environ['GITHUB_REF_NAME'],'content':base64.b64encode(body.encode()).decode()}))
          PY
          curl --fail-with-body -sS -X PUT -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/forensics/godot-official-qualification-run.json" --data-binary @/tmp/locator.json

      - name: Verify frozen PR before qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/aggregate
          curl --fail-with-body -sS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/59" > evidence/aggregate/PR_BEFORE.json
          python3 - <<'PY'
          import json
          p=json.load(open('evidence/aggregate/PR_BEFORE.json'))
          assert p['head']['sha']=='5b4e2466ef84f3984f3bf336b31925d4d2e97a7f'
          assert p['state']=='open' and p['draft'] is True and p['merged_at'] is None and p['commits']==99
          PY

      - name: Audit official candidates and admit checksummed archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile .github/forensics/godot_official_source_qualification.py
          python3 .github/forensics/godot_official_source_qualification.py --output evidence --work-root /tmp/godot-official-qualification

      - name: Verify frozen PR after qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/59" > evidence/aggregate/PR_AFTER.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('evidence/aggregate/PR_AFTER.json'))
          assert p['head']['sha']=='5b4e2466ef84f3bf336b31925d4d2e97a7f'
          assert p['state']=='open' and p['draft'] is True and p['merged_at'] is None and p['commits']==99
          assert not [x.as_posix() for x in Path('evidence').rglob('*') if x.is_file() and x.suffix.lower() in {'.apk','.aab'}]
          PY

      - name: Upload 4.4.1 evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'bahrain-brick-godot-4.4.1-source-qualification-${{ github.run_id }}', path: evidence/4.4.1-stable, if-no-files-found: error, compression-level: 9, retention-days: 30}
      - name: Upload 4.5.2 evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'bahrain-brick-godot-4.5.2-source-qualification-${{ github.run_id }}', path: evidence/4.5.2-stable, if-no-files-found: error, compression-level: 9, retention-days: 30}
      - name: Upload 4.6.3 evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'bahrain-brick-godot-4.6.3-source-qualification-${{ github.run_id }}', path: evidence/4.6.3-stable, if-no-files-found: error, compression-level: 9, retention-days: 30}
      - name: Upload 4.7.1 evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'bahrain-brick-godot-4.7.1-source-qualification-${{ github.run_id }}', path: evidence/4.7.1-stable, if-no-files-found: error, compression-level: 9, retention-days: 30}
      - name: Upload 4.8-dev1 diagnostic
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'bahrain-brick-godot-4.8-dev1-source-diagnostic-${{ github.run_id }}', path: evidence/4.8-dev1, if-no-files-found: error, compression-level: 9, retention-days: 30}
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: 'bahrain-brick-godot-official-qualification-aggregate-${{ github.run_id }}', path: evidence/aggregate, if-no-files-found: error, compression-level: 9, retention-days: 30}
