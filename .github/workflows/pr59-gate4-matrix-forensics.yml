name: Bahrain Brick PR59 Gate 4 Matrix Forensics

on:
  push:
    branches: [ci/pr59-gate4-matrix-forensics-20260717]
    paths:
      - .github/workflows/pr59-gate4-matrix-forensics.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bahrain-brick-pr59-matrix-forensics
  cancel-in-progress: false

jobs:
  extract_and_reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out forensic tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/pr59-gate4-matrix-forensics-20260717
          path: forensic-tooling
          fetch-depth: 1

      - name: Check out exact PR 59 candidate read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f512fe8be09d15d2c9466f5edb089404a37a5c9b
          path: candidate
          fetch-depth: 1

      - name: Materialize forensic analyzer
        shell: bash
        run: |
          set -euo pipefail
          cat forensic-tooling/.github/forensics/pr59_matrix_forensics_part_*.pyfrag > /tmp/pr59_matrix_forensics.py
          python3 -m py_compile /tmp/pr59_matrix_forensics.py
          sha256sum /tmp/pr59_matrix_forensics.py

      - name: Download retained primary evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bahrain-brick-pr59-gate4-primary-29589205147
          path: build/extracted/primary
          repository: MuhamedZanabal/brick-bahrain-open-world
          run-id: '29589205147'
          github-token: ${{ github.token }}

      - name: Download retained secondary evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bahrain-brick-pr59-gate4-secondary-29589205147
          path: build/extracted/secondary
          repository: MuhamedZanabal/brick-bahrain-open-world
          run-id: '29589205147'
          github-token: ${{ github.token }}

      - name: Record exact source artifact authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/forensic-output
          find build/extracted/primary -type f -printf '%P\n' | LC_ALL=C sort > build/forensic-output/PRIMARY_SOURCE_ARTIFACT_FILE_LIST.txt
          find build/extracted/secondary -type f -printf '%P\n' | LC_ALL=C sort > build/forensic-output/SECONDARY_SOURCE_ARTIFACT_FILE_LIST.txt
          cat > build/forensic-output/SOURCE_ARTIFACT_AUTHORITY.json <<'JSON'
          {
            "source_run_id": 29589205147,
            "primary": {
              "artifact_id": 8411002980,
              "artifact_name": "bahrain-brick-pr59-gate4-primary-29589205147",
              "github_digest_sha256": "40c1a54244deebe14d0ba3f48fd73e1d38c0389ed02fac9e68679d5391d72f4b"
            },
            "secondary": {
              "artifact_id": 8410983642,
              "artifact_name": "bahrain-brick-pr59-gate4-secondary-29589205147",
              "github_digest_sha256": "312e86b65a9090e6de097d56671434b5d0f8a6dddd93cf897d6b01f70785aea8"
            }
          }
          JSON

      - name: Extract exact matrix manifest from retained composite source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/extracted/primary/forensic-source-authority/asset_lab/runtime build/forensic-output
          mapfile -t source_archives < <(find build/extracted/primary -type f -name MANAMA_SOUQ_COMPOSITE_SOURCE.zip -print)
          test "${#source_archives[@]}" = "1"
          source_archive="${source_archives[0]}"
          evidence_inventory="$(find build/extracted/primary -maxdepth 2 -type f -name EVIDENCE_INVENTORY.json -print -quit)"
          test -n "$evidence_inventory"
          python3 - "$source_archive" "$evidence_inventory" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          archive,inventory=Path(sys.argv[1]),Path(sys.argv[2])
          root=inventory.parent
          relative=archive.relative_to(root).as_posix()
          records=json.loads(inventory.read_text())['files']
          expected=next(r for r in records if r['path']==relative)
          actual={'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()}
          assert actual['bytes']==expected['bytes'] and actual['sha256']==expected['sha256'], (actual,expected)
          PY
          mapfile -t entries < <(unzip -Z1 "$source_archive" | grep -E '(^|/)asset_lab/runtime/full_asset_matrix_manifest\.json$')
          test "${#entries[@]}" = "1"
          manifest=build/extracted/primary/forensic-source-authority/asset_lab/runtime/full_asset_matrix_manifest.json
          unzip -p "$source_archive" "${entries[0]}" > "$manifest"
          final_tree="$(find build/extracted/primary -type f -path '*/reports/FINAL_TREE_MANIFEST.json' -print -quit)"
          test -n "$final_tree"
          python3 - "$manifest" "$final_tree" "$source_archive" "${entries[0]}" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          manifest,tree,archive,entry=Path(sys.argv[1]),Path(sys.argv[2]),Path(sys.argv[3]),sys.argv[4]
          digest=hashlib.sha256(manifest.read_bytes()).hexdigest()
          records=json.loads(tree.read_text())['files']
          expected=next(r for r in records if r['path']=='asset_lab/runtime/full_asset_matrix_manifest.json')
          value={
            'source_artifact_id':8411002980,
            'source_run_id':29589205147,
            'composite_source_archive_path':str(archive),
            'composite_source_archive_bytes':archive.stat().st_size,
            'composite_source_archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
            'archive_entry':entry,
            'manifest_bytes':manifest.stat().st_size,
            'manifest_sha256':digest,
            'final_tree_expected_bytes':expected['bytes'],
            'final_tree_expected_sha256':expected['sha256'],
            'verified_against_final_tree':manifest.stat().st_size==expected['bytes'] and digest==expected['sha256'],
          }
          Path('build/forensic-output/MATRIX_MANIFEST_SOURCE_AUTHORITY.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          assert value['verified_against_final_tree']
          PY

      - name: Reconcile expected matrix against both retained APKs
        shell: bash
        run: |
          set +e
          python3 /tmp/pr59_matrix_forensics.py \
            "$PWD/build/extracted/primary" \
            "$PWD/build/extracted/secondary" \
            "$PWD/candidate" \
            "$PWD/build/forensic-output" \
            > build/forensic-output/ANALYZER_STDOUT.txt \
            2> build/forensic-output/ANALYZER_STDERR.txt
          code=$?
          printf '%s\n' "$code" > build/forensic-output/ANALYZER_EXIT_CODE.txt
          exit 0

      - name: Finalize compact forensic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/forensic-output
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('build/forensic-output')
          records=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'COMPACT_EVIDENCE_INVENTORY.json'):
              records.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          value={'schema_version':1,'file_count':len(records),'total_bytes':sum(r['bytes'] for r in records),'files':records}
          (root/'COMPACT_EVIDENCE_INVENTORY.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          if value['total_bytes'] >= 50 * 1024 * 1024:
              raise SystemExit(f"compact evidence exceeds 50 MiB: {value['total_bytes']}")
          forbidden=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.apk','.glb','.pck'}]
          if forbidden:
              raise SystemExit(f"forbidden binaries in compact evidence: {forbidden}")
          PY
          du -ah build/forensic-output | sort -h > build/forensic-output/COMPACT_EVIDENCE_SIZE_LIST.txt
          test "$(cat build/forensic-output/ANALYZER_EXIT_CODE.txt)" = "0"
          for required in EXPECTED_MATRIX_PATHS.json PRIMARY_APK_LOGICAL_PATHS.json SECONDARY_APK_LOGICAL_PATHS.json PRIMARY_MATRIX_RECONCILIATION.json SECONDARY_MATRIX_RECONCILIATION.json MATRIX_RECONCILIATION_COMPARISON.json MATRIX_DISCREPANCY_CLASSIFICATION.json PROPOSED_CORRECTION.json; do
            test -s "build/forensic-output/$required"
          done

      - name: Record forensic run locator on isolated branch
        if: always()
        shell: bash
        working-directory: forensic-tooling
        run: |
          set -euo pipefail
          mkdir -p .github/forensics
          cat > .github/forensics/LATEST_RUN.json <<JSON
          {
            "workflow_name": "Bahrain Brick PR59 Gate 4 Matrix Forensics",
            "run_id": ${{ github.run_id }},
            "run_attempt": ${{ github.run_attempt }},
            "workflow_commit": "${{ github.sha }}",
            "candidate_head": "f512fe8be09d15d2c9466f5edb089404a37a5c9b",
            "source_run_id": 29589205147,
            "analysis_exit_code": "$(cat ../build/forensic-output/ANALYZER_EXIT_CODE.txt 2>/dev/null || printf unavailable)"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/forensics/LATEST_RUN.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(forensics): record PR59 matrix forensic run ${{ github.run_id }}"
            git push origin HEAD:ci/pr59-gate4-matrix-forensics-20260717
          fi

      - name: Upload compact matrix forensic evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bahrain-brick-pr59-gate4-matrix-forensics-${{ github.run_id }}
          path: build/forensic-output
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
