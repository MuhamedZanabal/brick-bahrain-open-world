name: Golden Master Rendered Frame Final

on:
  push:
    branches: [work/bahrain-brick-golden-master-batch1-v1]
    paths:
      - .github/workflows/golden-master-rendered-frame-final.yml
  pull_request:
    branches: [work/bahrain-brick-asset-lab-integration-v1]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/golden-master-rendered-frame-final.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: golden-master-rendered-frame-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARTIFACT_ID: "8359310173"
  EXPECTED_APK_SHA256: 5d3e39f7c9ce845435f2f1a3f9dc5f5ab0eac85d822c5d954daf8c7e4df6b36c
  EXPECTED_HOLDER_SHA256: 65149352c1d81f68444e292bedaf0017b0ff6b9ecd5a7923e632a895deb441e7
  PACKAGE_NAME: com.brickbahrain.goldenmasterqa
  HOLDER_PACKAGE: com.brickbahrain.landscapeholder
  ANDROID_USER_HOME: ${{ github.workspace }}/build/android-user
  ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-user/avd

jobs:
  rendered_frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact evidence head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Recover verified APKs and prior runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source build/reports build/android-evidence "$ANDROID_AVD_HOME"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > build/source.zip
          unzip -tq build/source.zip
          unzip -q build/source.zip -d build/source
          cp build/source/bahrain_brick_golden_master_nonimmersive_vulkan_qa.apk build/golden-master.apk
          cp build/source/landscape-holder/landscape-holder.apk build/landscape-holder.apk
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" build/golden-master.apk | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_HOLDER_SHA256" build/landscape-holder.apk | sha256sum -c -
          grep -q 'GOLDEN_MASTER_PREVIEW_READY profile=balanced assets=5' build/source/reports/ANDROID_LOGCAT.txt
          if grep -E 'FATAL EXCEPTION|Fatal signal|Condition "configured" is true|Singleton for Time already exists' build/source/reports/ANDROID_LOGCAT.txt; then
            exit 1
          fi
          cp build/source/reports/ANDROID_LOGCAT.txt build/reports/SOURCE_ANDROID_LOGCAT.txt
          cp build/source/reports/SOURCE_PROTECTED_AUTHORITY.txt build/reports/SOURCE_PROTECTED_AUTHORITY.txt
      - name: Provision unified API 34 AVD
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -x "$JAVA_HOME/bin/java"
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.3.0
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          rm -rf "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name golden_master_api34 \
            --package "system-images;android-34;google_apis;x86_64" --device "pixel_7"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee build/reports/EMULATOR_LIST_AVDS.txt
          grep -qx 'golden_master_api34' build/reports/EMULATOR_LIST_AVDS.txt
      - name: Capture first rendered golden-master frame
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          sudo chmod 666 /dev/kvm || true
          "$EMULATOR" -avd golden_master_api34 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 -no-metrics \
            > build/reports/EMULATOR_STDOUT.log 2>&1 &
          EMULATOR_PID=$!
          printf '%s\n' "$EMULATOR_PID" > build/reports/EMULATOR_PID.txt
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          timeout 240s "$ADB" wait-for-device
          BOOTED=0
          for attempt in $(seq 1 120); do
            kill -0 "$EMULATOR_PID"
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" -eq 1

          "$ADB" install -r build/landscape-holder.apk | tee build/reports/HOLDER_ADB_INSTALL.txt
          "$ADB" shell am start -W -n "$HOLDER_PACKAGE/.MainActivity" | tee build/reports/HOLDER_ADB_LAUNCH.txt
          STABLE=0
          for attempt in $(seq 1 90); do
            "$ADB" shell dumpsys window displays > build/reports/HOLDER_WINDOW_DISPLAYS.txt
            "$ADB" shell dumpsys window windows > build/reports/HOLDER_WINDOWS.txt
            if grep -q 'mDisplayRotation=ROTATION_90' build/reports/HOLDER_WINDOW_DISPLAYS.txt \
              && grep -q "$HOLDER_PACKAGE/.MainActivity" build/reports/HOLDER_WINDOWS.txt; then
              STABLE=$((STABLE + 1))
            else
              STABLE=0
            fi
            [ "$STABLE" -ge 5 ] && break
            sleep 1
          done
          test "$STABLE" -ge 5
          sleep 5

          "$ADB" install -r build/golden-master.apk | tee build/reports/ADB_INSTALL.txt
          "$ADB" logcat -c
          "$ADB" shell am start -W -n "$PACKAGE_NAME/com.godot.game.GodotApp" | tee build/reports/ADB_LAUNCH.txt
          READY=0
          for attempt in $(seq 1 90); do
            "$ADB" logcat -d > build/reports/ANDROID_LOGCAT.txt
            if grep -q 'GOLDEN_MASTER_PREVIEW_READY profile=balanced assets=5' build/reports/ANDROID_LOGCAT.txt; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" -eq 1

          RENDERED=0
          for attempt in $(seq 1 30); do
            CANDIDATE="build/android-evidence/frame-${attempt}.png"
            "$ADB" exec-out screencap -p > "$CANDIDATE"
            if python3 - "$CANDIDATE" "$attempt" <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json, sys
          path=Path(sys.argv[1])
          attempt=int(sys.argv[2])
          image=Image.open(path).convert('RGB')
          stat=ImageStat.Stat(image)
          width,height=image.size
          mean_luminance=sum(stat.mean)/3.0
          bright_ratio=sum(1 for pixel in image.resize((240,108)).getdata() if sum(pixel)/3.0 > 90.0)/(240*108)
          result={'attempt':attempt,'path':str(path),'bytes':path.stat().st_size,'dimensions':[width,height],'mean_luminance':mean_luminance,'bright_ratio':bright_ratio,'extrema':stat.extrema}
          Path('build/reports/SCREENSHOT_PROBE.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          ok=(width>height and path.stat().st_size>30000 and mean_luminance>55.0 and bright_ratio>0.12 and sum(1 for low,high in stat.extrema if high-low>40)>=2)
          raise SystemExit(0 if ok else 1)
          PY
            then
              cp "$CANDIDATE" build/android-evidence/golden_master_preview_landscape.png
              RENDERED=1
              break
            fi
            sleep 5
          done
          test "$RENDERED" -eq 1
          "$ADB" logcat -d > build/reports/ANDROID_LOGCAT.txt
          "$ADB" shell dumpsys window displays > build/reports/ANDROID_WINDOW_DISPLAYS.txt
          "$ADB" shell dumpsys activity activities > build/reports/ANDROID_ACTIVITY.txt
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json
          screenshot=Path('build/android-evidence/golden_master_preview_landscape.png')
          apk=Path('build/golden-master.apk')
          image=Image.open(screenshot)
          report=json.loads(Path('build/reports/SCREENSHOT_PROBE.json').read_text())
          Path('build/reports/ANDROID_RUNTIME_VALIDATION.json').write_text(
              json.dumps({'passed':True,'renderer':'mobile_vulkan','orientation':'landscape_holder_stabilized','immersive':False,'package':'com.brickbahrain.goldenmasterqa','profile':'balanced','visible_assets':5,'dimensions':list(image.size),'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'screenshot_probe':report},indent=2,sort_keys=True)+'\n'
          )
          PY
          if grep -E 'SCRIPT ERROR|Parse Error|GOLDEN_MASTER_PREVIEW_FAILED|FATAL EXCEPTION|Fatal signal|Condition "configured" is true|Singleton for Time already exists' build/reports/ANDROID_LOGCAT.txt; then
            exit 1
          fi
      - name: Upload final rendered-frame evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: golden-master-rendered-frame-final-${{ github.run_id }}
          path: |
            build/golden-master.apk
            build/landscape-holder.apk
            build/android-evidence
            build/reports
          if-no-files-found: warn
          retention-days: 30
      - name: Require rendered-frame success after evidence upload
        if: always()
        shell: bash
        run: test '${{ steps.runtime.outcome }}' = 'success'
